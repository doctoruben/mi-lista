<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutina Gym - ExerciseDB API</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151f32;
            --bg-darker: #090d16;
            --accent-color: #e50914;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 100px; }

        header {
            background-color: var(--bg-card); padding: 20px 15px; text-align: center;
            border-bottom: 3px solid var(--accent-color); position: sticky; top: 0; z-index: 100;
        }
        header h1 span { color: var(--accent-color); }
        header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 5px; }

        .day-nav {
            display: flex; background-color: var(--bg-darker); padding: 8px; gap: 5px;
            position: sticky; top: 76px; z-index: 99; border-bottom: 1px solid #222f47;
        }
        .day-btn {
            flex: 1; background: none; border: none; color: var(--text-muted); padding: 12px 5px;
            font-weight: 700; font-size: 0.8rem; text-transform: uppercase; cursor: pointer; border-radius: 6px;
        }
        .day-btn.active { background-color: var(--accent-color); color: white; }

        .app-container { max-width: 600px; margin: 20px auto; padding: 0 12px; }
        .routine-section { display: none; }
        .routine-section.active { display: block; }

        .card { background-color: var(--bg-card); border-radius: 12px; margin-bottom: 25px; overflow: hidden; border: 1px solid #1e2d4a; }
        
        .image-container {
            position: relative; width: 100%; height: 280px; background-color: #f8fafc;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .exercise-gif { height: 100%; width: 100%; object-fit: contain; }
        
        /* Shimmer effect mientras carga la API */
        .loading-placeholder {
            position: absolute; width:100%; height:100%; background: linear-gradient(90deg, #151f32 25%, #1e2d4a 50%, #151f32 75%);
            background-size: 200% 100%; animation: loading 1.5s infinite; z-index: 5;
        }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .badge-tag {
            position: absolute; top: 12px; right: 12px; background-color: rgba(0, 0, 0, 0.85);
            color: white; padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; z-index: 10;
        }

        .card-content { padding: 18px; }
        .exercise-name { font-size: 1.2rem; font-weight: 700; color: white; margin-bottom: 6px; text-transform: capitalize; }
        .exercise-presets { font-size: 0.85rem; color: var(--warning); font-weight: bold; margin-bottom: 12px; }
        
        .guide-box { background-color: var(--bg-darker); padding: 12px; border-radius: 8px; font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 15px; }
        .guide-box strong { color: white; display: block; margin-bottom: 4px; }

        .series-control { display: flex; align-items: center; justify-content: space-between; background-color: #0e1624; padding: 10px 12px; border-radius: 8px; }
        .series-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        .series-dots { display: flex; gap: 6px; }
        .dot { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #2d3f5e; color: var(--text-main); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; cursor: pointer; }
        .dot.completed { background-color: var(--success); border-color: var(--success); color: white; }

        .timer-bar { position: fixed; bottom: 0; left: 0; right: 0; background-color: #161d31; border-top: 3px solid var(--accent-color); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; transform: translateY(100%); transition: transform 0.3s; z-index: 1000; }
        .timer-bar.show { transform: translateY(0); }
        .timer-countdown { font-size: 1.5rem; font-weight: 800; color: var(--warning); font-family: monospace; }
        .timer-btn { background-color: var(--accent-color); border: none; color: white; padding: 8px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>Entrenamiento <span>Mancuernas</span></h1>
        <p>20 Ejercicios Animados - Conectado a ExerciseDB API</p>
    </header>

    <nav class="day-nav">
        <button class="day-btn active" onclick="changeDay(1, this)">Día 1: Empuje</button>
        <button class="day-btn" onclick="changeDay(2, this)">Día 2: Tirón</button>
        <button class="day-btn" onclick="changeDay(3, this)">Día 3: Piernas</button>
    </nav>

    <div class="app-container">
        <section id="day-1" class="routine-section active"></section>
        <section id="day-2" class="routine-section"></section>
        <section id="day-3" class="routine-section"></section>
    </div>

    <div id="global-timer" class="timer-bar">
        <div>
            <span style="font-size:0.75rem; display:block; color:var(--text-muted);">DESCANSO ACTIVO</span>
            <span id="countdown-display" class="timer-countdown">00:00</span>
        </div>
        <button class="timer-btn" onclick="closeTimer()">SALTAR</button>
    </div>

    <script>
        // CONFIGURACIÓN DE LA ROUTINA CON IDs REALES DE EXERCISEDB
        const routineData = {
            1: [ // DÍA 1: EMPUJE
                { id: '0292', name: 'Press de Banca con Mancuernas', sets: 4, reps: '10-12', rest: 90, target: 'Pecho' },
                { id: '0426', name: 'Press de Hombros Sentado', sets: 4, reps: '10', rest: 90, target: 'Hombros' },
                { id: '0333', name: 'Elevaciones Laterales', sets: 3, reps: '12-15', rest: 60, target: 'Hombros' },
                { id: '0308', name: 'Aperturas Planas (Dumbbell Fly)', sets: 3, reps: '12', rest: 90, target: 'Pecho' },
                { id: '0343', name: 'Patada de Tríceps', sets: 3, reps: '12', rest: 60, target: 'Tríceps' },
                { id: '0263', name: 'Press Arnold', sets: 3, reps: '10', rest: 90, target: 'Hombros' },
                { id: '0314', name: 'Press Inclinado con Mancuernas', sets: 3, reps: '10', rest: 90, target: 'Pecho' }
            ],
            2: [ // DÍA 2: TIRÓN
                { id: '0293', name: 'Remo con Mancuerna a una Mano', sets: 4, reps: '10', rest: 90, target: 'Espalda' },
                { id: '0285', name: 'Curl de Bíceps Alterno', sets: 4, reps: '12', rest: 60, target: 'Bíceps' },
                { id: '0412', name: 'Remo en Banco Inclinado (Prono)', sets: 3, reps: '12', rest: 90, target: 'Espalda' },
                { id: '0313', name: 'Curl Martillo', sets: 3, reps: '12', rest: 60, target: 'Bíceps' },
                { id: '0384', name: 'Remo Renegado', sets: 3, reps: '10', rest: 90, target: 'Espalda' },
                { id: '1677', name: 'Curl Zottman', sets: 3, reps: '10', rest: 60, target: 'Bíceps' }
            ],
            3: [ // DÍA 3: PIERNAS Y CORE
                { id: '0339', name: 'Sentadilla Goblet', sets: 4, reps: '12', rest: 90, target: 'Cuádriceps' },
                { id: '0382', name: 'Peso Muerto Rumano', sets: 4, reps: '10', rest: 90, target: 'Femorales' },
                { id: '0336', name: 'Zancadas (Lunges)', sets: 3, reps: '12', rest: 90, target: 'Piernas' },
                { id: '0408', name: 'Sentadilla Búlgara', sets: 3, reps: '10', rest: 90, target: 'Glúteos' },
                { id: '1381', name: 'Elevación de Talones (Gemelos)', sets: 4, reps: '15', rest: 60, target: 'Gemelos' },
                { id: '0390', name: 'Giros Rusos (Russian Twist)', sets: 3, reps: '20', rest: 60, target: 'Abdomen' },
                { id: '0834', name: 'Paseo del Granjero', sets: 3, reps: '40 seg', rest: 90, target: 'Agarre' }
            ]
        };

        // PON TU RAPIDAPI KEY AQUÍ ABAJO:
        const RAPIDAPI_KEY = 'TU_RAPIDAPI_KEY'; 

        // Función para renderizar los ejercicios e invocar la API
        function initApp() {
            Object.keys(routineData).forEach(day => {
                const container = document.getElementById(`day-${day}`);
                routineData[day].forEach((ex, idx) => {
                    // Generamos la tarjeta vacía con un esqueleto de carga (Placeholder)
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="image-container">
                            <div class="loading-placeholder" id="loader-${ex.id}"></div>
                            <span class="badge-tag">${ex.target}</span>
                            <img class="exercise-gif" id="gif-${ex.id}" alt="${ex.name}">
                        </div>
                        <div class="card-content">
                            <div class="exercise-name">${idx + 1}. ${ex.name}</div>
                            <div class="exercise-presets">${ex.sets} Series x ${ex.reps} Repeticiones</div>
                            <div class="guide-box">
                                <strong>Instrucciones de ejecución:</strong>
                                <span id="guide-${ex.id}">Cargando instrucciones técnicas oficiales...</span>
                            </div>
                            <div class="series-control">
                                <span class="series-label">Series Realizadas:</span>
                                <div class="series-dots">${Array.from({length: ex.sets}, (_, i) => `<div class="dot" onclick="toggleDot(this, ${ex.rest})">${i+1}</div>`).join('')}</div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                    
                    // Llamamos a la API de forma individual para este ejercicio si la clave está puesta
                    if(RAPIDAPI_KEY !== 'TU_RAPIDAPI_KEY') {
                        fetchExerciseFromAPI(ex.id);
                    } else {
                        document.getElementById(`guide-${ex.id}`).innerText = "Por favor, introduce tu API Key de RapidAPI en el código para ver las animaciones reales.";
                    }
                });
            });
        }

        function fetchExerciseFromAPI(id) {
            fetch(`https://exercisedb.p.rapidapi.com/exercises/exercise/${id}`, {
                method: 'GET',
                headers: {
                    'x-rapidapi-key': RAPIDAPI_KEY,
                    'x-rapidapi-host': 'exercisedb.p.rapidapi.com'
                }
            })
            .then(res => {
                if(!res.ok) throw new Error("Error en la API");
                return res.json();
            })
            .then(data => {
                // Insertamos el GIF real en movimiento suministrado por la API
                const imgElement = document.getElementById(`gif-${id}`);
                imgElement.src = data.gifUrl;
                imgElement.onload = () => {
                    document.getElementById(`loader-${id}`).style.display = 'none'; // Quitamos el efecto de carga
                };

                // Combinamos las instrucciones de la API (vienen en array)
                if (data.instructions && data.instructions.length > 0) {
                    // Traducimos términos clave rápidamente para comodidad del usuario
                    let rawInstructions = data.instructions.join(' ');
                    document.getElementById(`guide-${id}`).innerText = rawInstructions;
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById(`guide-${id}`).innerText = "Error al conectar con ExerciseDB. Revisa tu API Key o límite diario.";
            });
        }

        // CONTROLADORES DE LA INTERFAZ
        let timerInterval;
        let timeRemaining = 0;

        function changeDay(dayNumber, btnElement) {
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.routine-section').forEach(sec => sec.classList.remove('active'));
            btnElement.classList.add('active');
            document.getElementById(`day-${dayNumber}`).classList.add('active');
            closeTimer();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function toggleDot(element, seconds) {
            element.classList.toggle('completed');
            if (element.classList.contains('completed')) {
                launchTimer(seconds);
            }
        }

        function launchTimer(seconds) {
            clearInterval(timerInterval);
            document.getElementById('global-timer').classList.add('show');
            timeRemaining = seconds;
            timerInterval = setInterval(() => {
                timeRemaining--;
                const mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
                const secs = (timeRemaining % 60).toString().padStart(2, '0');
                document.getElementById('countdown-display').innerText = `${mins}:${secs}`;
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('countdown-display').innerText = "¡A ENTRENAR!";
                    setTimeout(closeTimer, 1500);
                }
            }, 1000);
        }

        function closeTimer() { clearInterval(timerInterval); document.getElementById('global-timer').classList.remove('show'); }

        // Arrancar al cargar la página
        window.onload = initApp;
    </script>
</body>
</html>
