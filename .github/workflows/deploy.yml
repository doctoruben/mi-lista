name: Deploy TEAyudo

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ver estructura
        run: find . -name "TEAyudo.html"

      - name: Inyectar API key
        run: |
          sed -i 's/__GROQ_API_KEY__/${{ secrets.GROQ_API_KEY }}/g' $(find . -name "TEAyudo.html")

      - name: Deploy a GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
