<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>HIIT Running Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<!-- Meta para iOS full screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f172a;
    --card:#1e293b;
    --card-2:#233047;
    --text:#e2e8f0;
    --muted:#7c8aa5;
    --warmup:#38bdf8;
    --intensity:#f43f5e;
    --recovery:#34d399;
    --cooldown:#38bdf8;
    --end:#facc15;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow: hidden; /* Evita scroll en iOS al bloquear */}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    /* Padding inferior para botones del sistema en standalone mode */
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none; /* Desactiva gestos globales del navegador */
  }
  .app{
    width:100%;
    max-width:420px;
    position: relative;
    transition: opacity 0.3s ease;
  }
  .app.blur-bg {
    opacity: 0.1; /* Difumina el fondo al bloquear para centrar la vista */
    filter: blur(5px);
  }
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin: 0;
  }
  .lock-toggle-btn {
    background: var(--card-2);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    width: auto;
    flex: none;
    font-weight: 500;
  }
  h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:38px;
    letter-spacing:.03em;
    text-align:center;
    margin:0 0 20px;
    color:var(--text);
  }
  .card{
    background:var(--card);
    border-radius:24px;
    padding:30px 24px 24px;
    box-shadow:0 25px 50px -12px rgba(0,0,0,0.7);
    border:1px solid rgba(255,255,255,.04);
  }
  .phase-label{
    text-align:center;
    font-size:16px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--phase-color, var(--muted));
    margin-bottom:4px;
    transition:color .3s ease;
  }
  .round-label{
    text-align:center;
    font-size:14px;
    color:var(--muted);
    min-height:20px;
    margin-bottom:8px;
  }
  .timer{
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:84px;
    text-align:center;
    line-height:1;
    letter-spacing:-.03em;
    color:var(--phase-color, var(--text));
    transition:color .3s ease;
    margin:10px 0 22px;
    font-variant-numeric:tabular-nums;
  }
  .segments{
    display:flex;
    gap:4px;
    margin-bottom:26px;
    height:10px;
  }
  .seg{
    flex:1;
    background:var(--card-2);
    border-radius:4px;
    overflow:hidden;
    position:relative;
  }
  .seg.warmup, .seg.cooldown{flex-grow:2.5;}
  .seg .fill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:0%;
    border-radius:4px;
  }
  .seg.warmup .fill, .seg.cooldown .fill{background:var(--warmup);}
  .seg.intensity .fill{background:var(--intensity);}
  .seg.recovery .fill{background:var(--recovery);}
  .seg.completed .fill{width:100% !important;}

  .controls{
    display:flex;
    gap:12px;
  }
  button.ctrl-btn{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:16px;
    border:none;
    border-radius:14px;
    padding:18px 0;
    flex:1;
    cursor:pointer;
    transition:transform .1s ease, opacity .2s ease, background-color 0.2s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }
  button.ctrl-btn:active{transform:scale(.96);}
  #startBtn{background:var(--recovery); color:#04231a;}
  #startBtn:hover{background:#45e0a8;}
  #pauseBtn{background:var(--card-2); color:var(--text); border: 1px solid rgba(255,255,255,0.05);}
  #pauseBtn:hover{background:#2a3a54;}
  #resetBtn{background:var(--card-2); color:var(--text); border: 1px solid rgba(255,255,255,0.05);}
  #resetBtn:hover{background:#2a3a54;}
  button:disabled{opacity:0.3 !important; cursor:default; pointer-events: none;}
  
  .testrow{
    text-align:center;
    margin-top:18px;
  }
  .testrow button{
    background:none;
    border: none;
    color:var(--muted);
    font-size:13px;
    padding:8px 12px;
    text-decoration:underline;
    flex:none;
    cursor: pointer;
  }
  
  /* Overlay de bloqueo de pantalla - MEJORADO */
  .lock-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg); /* Opaco para ocultar contenido */
    z-index: 99999; /* Máximo posible */
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    touch-action: none; /* Bloquea gestos del navegador en el overlay */
  }
  .lock-overlay.active {
    display: flex;
  }
  
  /* Gran temporizador visible en bloqueo */
  #lockTimerDisplay {
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:100px;
    color: var(--phase-color, var(--text));
    line-height: 1;
    margin-bottom: 10px;
    font-variant-numeric:tabular-nums;
  }
  #lockPhaseDisplay {
    font-size: 20px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--phase-color, var(--muted));
    letter-spacing: 0.1em;
    margin-bottom: auto; /* Empuja el botón hacia abajo */
  }

  .unlock-zone {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
  }

  .status-text {
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .unlock-btn {
    background: var(--card);
    border: 3px solid var(--muted);
    color: var(--text);
    width: 150px;
    height: 150px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    gap: 10px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: border-color 0.2s ease, transform 0.1s ease;
  }
  .unlock-btn:active {
    transform: scale(0.97);
  }
  .unlock-btn.pressing {
    border-color: var(--warmup);
  }
  .unlock-btn svg {
    width: 40px;
    height: 40px;
    fill: currentColor;
    transition: color 0.2s ease;
  }
  .unlock-btn.pressing svg {
    color: var(--warmup);
  }
  .unlock-progress {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--warmup);
    height: 0%;
    opacity: 0.25;
    transition: height 0.05s linear;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="app" id="appContent">
  <div class="header-bar">
    <div class="eyebrow">HIIT Running</div>
    <button class="lock-toggle-btn" id="lockBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        Bloquear Puntos
    </button>
  </div>
  
  <h1>8 series intensas</h1>

  <div class="card">
    <div class="phase-label" id="phaseLabel">Preparado</div>
    <div class="round-label" id="roundLabel">10' calentamiento · 8×(30"/90") · 10' trote</div>
    <div class="timer" id="timer">36:00</div>

    <div class="segments" id="segments"></div>

    <div class="controls">
      <button id="startBtn" class="ctrl-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Empezar
      </button>
      <button id="pauseBtn" class="ctrl-btn" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        Pausa
      </button>
      <button id="resetBtn" class="ctrl-btn" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        Reiniciar
      </button>
    </div>

    <div class="testrow">
      <button id="testBtn">Probar sonido y voz</button>
    </div>

    <div class="wake-warning" id="wakeWarning">
      ⚠️ Tu navegador no admite Wake Lock. Mantén la pantalla encendida manualmente.
    </div>
  </div>
</div>

<!-- CAPA DE BLOQUEO DE PANTALLA - MEJORADA -->
<div class="lock-overlay" id="lockOverlay">
  <div id="lockTimerDisplay">36:00</div>
  <div id="lockPhaseDisplay">Preparado</div>
  
  <div class="unlock-zone">
    <div class="status-text">PANTALLA BLOQUEADA ANTITOQUES</div>
    <div class="unlock-btn" id="unlockBtn">
        <svg viewBox="0 0 24 24"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM8.9 6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2H8.9V6zM18 20H6V10h12v10z"/></svg>
        <span>Mantén pulsado</span>
        <div class="unlock-progress" id="unlockProgress"></div>
    </div>
  </div>
</div>

<script>
// ---------- Registrar Service Worker ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/mi-lista/hiit/sw.js')
      .then(reg => console.log('SW OK'))
      .catch(err => console.log('SW Error', err));
  });
}

// ---------- Prevent accidental close ----------
window.addEventListener('beforeunload', (e) => {
  if (running && phaseIndex !== -1) {
    e.preventDefault();
    e.returnValue = ''; // Muestra diálogo de confirmación estándar
  }
});

// ---------- Silent keep-alive audio ----------
const silentAudio = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=");
silentAudio.loop = true;

// ---------- Build the workout plan ----------
function buildPhases(){
  const phases = [];
  phases.push({type:'warmup', duration:600, label:'Calentamiento', say:'Empezando calentamiento'});
  for(let i=1;i<=8;i++){
    phases.push({type:'intensity', duration:30, label:'Intensidad máx.', round:i, say:`Serie ${i}. ¡Rápido!`});
    phases.push({type:'recovery', duration:90, label:'Recuperación', round:i, say:'Recupera.'});
  }
  phases.push({type:'cooldown', duration:600, label:'Trote suave', say:'Trote suave final.'});
  phases.push({type:'end', duration:0, label:'Fin', say:'Entrenamiento completado.'});
  return phases;
}
const PHASES = buildPhases();
const TOTAL_SECONDS = PHASES.reduce((a,p)=>a+p.duration,0);

// ---------- DOM refs ----------
const appContent = document.getElementById('appContent');
const phaseLabelEl = document.getElementById('phaseLabel');
const roundLabelEl = document.getElementById('roundLabel');
const timerEl = document.getElementById('timer');
const segmentsEl = document.getElementById('segments');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const testBtn = document.getElementById('testBtn');
const wakeWarning = document.getElementById('wakeWarning');
const lockBtn = document.getElementById('lockBtn');
const lockOverlay = document.getElementById('lockOverlay');
const lockTimerDisplay = document.getElementById('lockTimerDisplay');
const lockPhaseDisplay = document.getElementById('lockPhaseDisplay');
const unlockBtn = document.getElementById('unlockBtn');
const unlockProgress = document.getElementById('unlockProgress');

// build segment bars
PHASES.filter(p=>p.type!=='end').forEach((p,idx)=>{
  const seg = document.createElement('div');
  seg.className = 'seg ' + p.type;
  seg.dataset.index = PHASES.indexOf(p);
  const fill = document.createElement('div');
  fill.className = 'fill';
  seg.appendChild(fill);
  segmentsEl.appendChild(seg);
});

// ---------- State ----------
let phaseIndex = -1;
let phaseEndsAt = 0;
let remainingAtPause = null;
let tickHandle = null;
let running = false;
let wakeLock = null;
let beepedSecond = null;
let isLocked = false;

function fmt(sec){
  sec = Math.max(0, Math.ceil(sec));
  const m = Math.floor(sec/60);
  const s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

// ---------- Speech ----------
let esVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  esVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('es')) || null;
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();
}
function say(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-ES';
  if(esVoice) u.voice = esVoice;
  u.rate = 1.1;
  speechSynthesis.speak(u);
}

// ---------- Beep ----------
let audioCtx = null;
function beep(freq=880, duration=0.12){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }catch(e){}
}

// ---------- Vibration ----------
function vibrate(pattern){
  if(navigator.vibrate) navigator.vibrate(pattern);
}

// ---------- Wake Lock ----------
async function requestWakeLock(){
  if('wakeLock' in navigator && running){
    try{
        wakeLock = await navigator.wakeLock.request('screen');
        wakeWarning.style.display = 'none';
    }catch(e){ wakeWarning.style.display = 'block'; }
  }
}
document.addEventListener('visibilitychange', () => {
  if(running && document.visibilityState === 'visible' && (!wakeLock || wakeLock.released)) requestWakeLock();
});

// ---------- Fullscreen Management ----------
function toggleFullscreen(activate) {
  if (!document.fullscreenEnabled) return;
  
  if (activate) {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(()=>{});
    }
  } else {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(()=>{});
    }
  }
}

// ---------- UI update ----------
function updateSegmentsUI(){
  const segEls = segmentsEl.querySelectorAll('.seg');
  const remain = (phaseEndsAt - Date.now())/1000;
  segEls.forEach(seg=>{
    const idx = parseInt(seg.dataset.index,10);
    const fill = seg.querySelector('.fill');
    if(idx < phaseIndex){
      fill.style.width = '100%';
    } else if(idx === phaseIndex){
      const p = PHASES[idx];
      const pct = p.duration ? Math.min(100, Math.max(0, (1 - remain/p.duration) * 100)) : 100;
      fill.style.width = pct + '%';
    } else { fill.style.width = '0%'; }
  });
}

function colorFor(type){
  return {warmup:'var(--warmup)', intensity:'var(--intensity)', recovery:'var(--recovery)',
          cooldown:'var(--cooldown)', end:'var(--end)'}[type] || 'var(--text)';
}

function renderPhase(){
  const p = PHASES[phaseIndex];
  const color = colorFor(p.type);
  document.documentElement.style.setProperty('--phase-color', color);
  
  phaseLabelEl.textContent = p.label;
  lockPhaseDisplay.textContent = p.label;
  
  roundLabelEl.textContent = p.round ? `Serie ${p.round} de 8` : (p.type==='end' ? 'Buen trabajo' : '');
}

// ---------- Phase transitions ----------
function startPhase(idx){
  phaseIndex = idx;
  const p = PHASES[phaseIndex];
  renderPhase();
  say(p.say);
  vibrate(p.type === 'intensity' ? [200,100,200] : p.type === 'recovery' ? [150] : [100]);
  beepedSecond = null;

  if(p.type === 'end'){
    timerEl.textContent = '00:00';
    lockTimerDisplay.textContent = '00:00';
    updateSegmentsUI();
    stop(true);
    return;
  }
  phaseEndsAt = Date.now() + p.duration*1000;
  if(!tickHandle) tickHandle = setInterval(tick, 250);
}

function tick(){
  const p = PHASES[phaseIndex];
  const remain = (phaseEndsAt - Date.now())/1000;
  const timeStr = fmt(remain);
  
  timerEl.textContent = timeStr;
  lockTimerDisplay.textContent = timeStr;
  
  updateSegmentsUI();

  const remainInt = Math.ceil(remain);
  if(remainInt <= 3 && remainInt >= 1 && remainInt !== beepedSecond){
    beepedSecond = remainInt;
    beep(remainInt === 1 ? 1200 : 800);
  }

  if(remain <= 0){
    if(phaseIndex + 1 < PHASES.length) startPhase(phaseIndex + 1);
    else stop(true);
  }
}

// ---------- Controls ----------
async function start(){
  if(phaseIndex === -1){
    running = true;
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    resetBtn.disabled = false;
    silentAudio.play().catch(()=>{});
    await requestWakeLock();
    // Intenta poner pantalla completa al empezar
    toggleFullscreen(true);
    startPhase(0);
  } else if(remainingAtPause !== null){
    running = true;
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    phaseEndsAt = Date.now() + remainingAtPause*1000;
    remainingAtPause = null;
    if(!tickHandle) tickHandle = setInterval(tick, 250);
    say('Reanudando');
    await requestWakeLock();
    toggleFullscreen(true);
  }
}

function pause(){
  if(!running || phaseIndex === -1) return;
  running = false;
  remainingAtPause = (phaseEndsAt - Date.now())/1000;
  clearInterval(tickHandle);
  tickHandle = null;
  speechSynthesis.cancel();
  startBtn.disabled = false;
  startBtn.textContent = 'Reanudar';
  pauseBtn.disabled = true;
  toggleFullscreen(false); // Sale de pantalla completa en pausa
}

function stop(finished){
  running = false;
  clearInterval(tickHandle);
  tickHandle = null;
  silentAudio.pause();
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
  toggleFullscreen(false);
  startBtn.disabled = finished ? true : false;
  pauseBtn.disabled = true;
  if(finished){
    phaseLabelEl.textContent = 'Fin de sesión';
    lockPhaseDisplay.textContent = 'Fin';
    roundLabelEl.textContent = '¡Sesión completada!';
  }
}

function reset(){
  clearInterval(tickHandle);
  tickHandle = null;
  speechSynthesis.cancel();
  silentAudio.pause();
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
  toggleFullscreen(false);
  
  phaseIndex = -1;
  remainingAtPause = null;
  running = false;
  startBtn.disabled = false;
  startBtn.textContent = 'Empezar';
  pauseBtn.disabled = true;
  resetBtn.disabled = true;
  document.documentElement.style.removeProperty('--phase-color');
  phaseLabelEl.textContent = 'Preparado';
  lockPhaseDisplay.textContent = 'Preparado';
  phaseLabelEl.style.color = '';
  roundLabelEl.textContent = "10' calentamiento · 8×(30\"/90\") · 10' trote";
  timerEl.textContent = fmt(TOTAL_SECONDS);
  lockTimerDisplay.textContent = fmt(TOTAL_SECONDS);
  timerEl.style.color = '';
  segmentsEl.querySelectorAll('.seg').forEach(seg=>{
    seg.querySelector('.fill').style.width = '0%';
  });
}

// ---------- Screen Lock Overlay Logic - MEJORADA ----------
let unlockTimer = null;
let unlockStartTime = 0;
const UNLOCK_HOLD_MS = 1600; // Un poco más largo para seguridad

function setLockState(locked) {
    isLocked = locked;
    if(locked) {
        lockOverlay.classList.add('active');
        appContent.classList.add('blur-bg');
        if(running) toggleFullscreen(true); // Asegura pantalla completa al bloquear corriendo
    } else {
        lockOverlay.classList.remove('active');
        appContent.classList.remove('blur-bg');
    }
}

lockBtn.addEventListener('click', () => setLockState(true));

// Intentar bloquear gestos de deslizamiento (swipes) en el overlay
lockOverlay.addEventListener('touchmove', (e) => {
    if(isLocked) {
        if(e.touches.length > 1) return; // Permitir zoom multi-touch si acaso
        e.preventDefault(); // Bloquea el scroll y gestos de un dedo
    }
}, {passive: false});

function startUnlockProgress(e) {
  e.preventDefault(); // Crucial para evitar toques fantasmas
  if(!isLocked) return;
  
  vibrate(40); // Feedback táctil inicial
  unlockStartTime = Date.now();
  unlockBtn.classList.add('pressing');
  unlockProgress.style.height = '0%';
  
  if(unlockTimer) clearInterval(unlockTimer);
  unlockTimer = setInterval(() => {
    const elapsed = Date.now() - unlockStartTime;
    const pct = Math.min(100, (elapsed / UNLOCK_HOLD_MS) * 100);
    unlockProgress.style.height = pct + '%';
    
    if (elapsed >= UNLOCK_HOLD_MS) {
      clearInterval(unlockTimer);
      unlockTimer = null;
      endUnlockPress();
      setLockState(false);
      vibrate([80, 60, 80]);
    }
  }, 40);
}

function endUnlockPress() {
  if (unlockTimer) {
    clearInterval(unlockTimer);
    unlockTimer = null;
  }
  unlockBtn.classList.remove('pressing');
  unlockProgress.style.height = '0%';
}

unlockBtn.addEventListener('touchstart', startUnlockProgress, {passive: false});
unlockBtn.addEventListener('touchend', endUnlockPress);
unlockBtn.addEventListener('touchcancel', endUnlockPress);
// Soporte para ratón (pruebas en PC)
unlockBtn.addEventListener('mousedown', startUnlockProgress);
unlockBtn.addEventListener('mouseup', endUnlockPress);
unlockBtn.addEventListener('mouseleave', endUnlockPress);

// Botones principales
startBtn.addEventListener('click', start);
pauseBtn.addEventListener('click', pause);
resetBtn.addEventListener('click', reset);
testBtn.addEventListener('click', ()=>{
  say('Sonido funcionando.');
  beep(880);
  vibrate(150);
});

// Inicializar tiempos
timerEl.textContent = fmt(TOTAL_SECONDS);
lockTimerDisplay.textContent = fmt(TOTAL_SECONDS);
</script>
</body>
