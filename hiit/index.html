<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>HIIT Running Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f172a;
    --card:#1e293b;
    --card-2:#233047;
    --text:#e2e8f0;
    --muted:#7c8aa5;
    --warmup:#38bdf8;
    --intensity:#f43f5e;
    --recovery:#34d399;
    --cooldown:#38bdf8;
    --end:#facc15;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow: hidden;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .app{
    width:100%;
    max-width:420px;
    position: relative;
    transition: opacity 0.3s ease, filter 0.3s ease;
  }
  .app.blur-bg {
    opacity: 0.1;
    filter: blur(5px);
  }
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .header-actions {
    display: flex;
    gap: 8px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin: 0;
  }
  .icon-btn {
    background: var(--card-2);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    width: auto;
    flex: none;
    font-weight: 500;
  }
  h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:38px;
    letter-spacing:.03em;
    text-align:center;
    margin:0 0 16px;
    color:var(--text);
  }
  .card{
    background:var(--card);
    border-radius:24px;
    padding:24px 20px 20px;
    box-shadow:0 25px 50px -12px rgba(0,0,0,0.7);
    border:1px solid rgba(255,255,255,.04);
  }
  .phase-label{
    text-align:center;
    font-size:16px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--phase-color, var(--muted));
    margin-bottom:2px;
    transition:color .3s ease;
  }
  .round-label{
    text-align:center;
    font-size:13px;
    color:var(--muted);
    min-height:18px;
    margin-bottom:4px;
  }
  .timer{
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:76px;
    text-align:center;
    line-height:1;
    letter-spacing:-.03em;
    color:var(--phase-color, var(--text));
    transition:color .3s ease;
    margin:6px 0 12px;
    font-variant-numeric:tabular-nums;
  }
  
  /* Widget de Calorías */
  .calories-widget {
    background: var(--card-2);
    border-radius: 12px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
    border: 1px solid rgba(255,255,255,0.03);
  }
  .calories-widget .cal-val {
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: #f97316;
  }
  .calories-widget .cal-unit {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    font-weight: 600;
  }

  .segments{
    display:flex;
    gap:4px;
    margin-bottom:22px;
    height:10px;
  }
  .seg{
    flex:1;
    background:var(--card-2);
    border-radius:4px;
    overflow:hidden;
    position:relative;
  }
  .seg.warmup, .seg.cooldown{flex-grow:2.5;}
  .seg .fill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:0%;
    border-radius:4px;
  }
  .seg.warmup .fill, .seg.cooldown .fill{background:var(--warmup);}
  .seg.intensity .fill{background:var(--intensity);}
  .seg.recovery .fill{background:var(--recovery);}
  .seg.completed .fill{width:100% !important;}

  .controls{
    display:flex;
    gap:10px;
  }
  button.ctrl-btn{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:14px;
    padding:16px 0;
    flex:1;
    cursor:pointer;
    transition:transform .1s ease, opacity .2s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }
  button.ctrl-btn:active{transform:scale(.96);}
  #startBtn{background:var(--recovery); color:#04231a;}
  #pauseBtn{background:var(--card-2); color:var(--text); border: 1px solid rgba(255,255,255,0.05);}
  #resetBtn{background:var(--card-2); color:var(--text); border: 1px solid rgba(255,255,255,0.05);}
  button:disabled{opacity:0.3 !important; cursor:default; pointer-events: none;}
  
  .testrow{
    text-align:center;
    margin-top:14px;
  }
  .testrow button{
    background:none;
    border: none;
    color:var(--muted);
    font-size:12px;
    padding:6px 10px;
    text-decoration:underline;
    cursor: pointer;
  }
  
  /* MODAL DE CONFIGURACIÓN */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    max-width: 380px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  }
  .modal h2 {
    margin: 0 0 18px;
    font-size: 20px;
    text-align: center;
  }
  .cfg-group {
    margin-bottom: 14px;
  }
  .cfg-group label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .cfg-row {
    display: flex;
    gap: 10px;
  }
  .cfg-input-wrap {
    flex: 1;
    position: relative;
  }
  .cfg-input-wrap input {
    width: 100%;
    background: var(--card-2);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 10px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    outline: none;
  }
  .cfg-input-wrap span {
    position: absolute;
    right: 10px;
    top: 12px;
    font-size: 11px;
    color: var(--muted);
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }
  .save-cfg-btn {
    background: var(--recovery);
    color: #04231a;
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-weight: 700;
    flex: 1;
    cursor: pointer;
  }
  .cancel-cfg-btn {
    background: var(--card-2);
    color: var(--text);
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-weight: 600;
    flex: 1;
    cursor: pointer;
  }

  /* Overlay de bloqueo de pantalla */
  .lock-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    z-index: 99999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    touch-action: none;
  }
  .lock-overlay.active { display: flex; }
  
  #lockTimerDisplay {
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:88px;
    color: var(--phase-color, var(--text));
    line-height: 1;
    margin-bottom: 6px;
    font-variant-numeric:tabular-nums;
  }
  #lockPhaseDisplay {
    font-size: 18px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--phase-color, var(--muted));
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  #lockCalDisplay {
    font-size: 16px;
    color: #f97316;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    margin-bottom: auto;
  }

  .unlock-zone {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
  }
  .status-text {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .unlock-btn {
    background: var(--card);
    border: 3px solid var(--muted);
    color: var(--text);
    width: 140px;
    height: 140px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    gap: 8px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .unlock-btn.pressing { border-color: var(--warmup); }
  .unlock-btn svg { width: 36px; height: 36px; fill: currentColor; }
  .unlock-btn.pressing svg { color: var(--warmup); }
  .unlock-progress {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--warmup);
    height: 0%;
    opacity: 0.25;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="app" id="appContent">
  <div class="header-bar">
    <div class="eyebrow">HIIT Running</div>
    <div class="header-actions">
      <button class="icon-btn" id="configBtn" title="Configurar">⚙️ Config</button>
      <button class="icon-btn" id="lockBtn">🔒 Bloquear</button>
    </div>
  </div>
  
  <h1 id="workoutTitle">8 series intensas</h1>

  <div class="card">
    <div class="phase-label" id="phaseLabel">Preparado</div>
    <div class="round-label" id="roundLabel">---</div>
    <div class="timer" id="timer">00:00</div>

    <!-- Widget de Calorías -->
    <div class="calories-widget">
      <span>🔥</span>
      <span class="cal-val" id="calDisplay">0</span>
      <span class="cal-unit">kcal quemadas</span>
    </div>

    <div class="segments" id="segments"></div>

    <div class="controls">
      <button id="startBtn" class="ctrl-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Empezar
      </button>
      <button id="pauseBtn" class="ctrl-btn" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        Pausa
      </button>
      <button id="resetBtn" class="ctrl-btn" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        Reiniciar
      </button>
    </div>

    <div class="testrow">
      <button id="testBtn">Probar sonido y voz</button>
    </div>
  </div>
</div>

<!-- MODAL DE CONFIGURACIÓN -->
<div class="modal-overlay" id="configModal">
  <div class="modal">
    <h2>Ajustes de Sesión</h2>
    <div class="cfg-group">
      <label>Tu Peso (Para cálculo de Kcal)</label>
      <div class="cfg-input-wrap">
        <input type="number" id="cfgWeight" step="0.5" value="70">
        <span>kg</span>
      </div>
    </div>
    <div class="cfg-group">
      <label>Series Totales</label>
      <div class="cfg-input-wrap">
        <input type="number" id="cfgRounds" value="8">
        <span>series</span>
      </div>
    </div>
    <div class="cfg-group">
      <label>Tiempos del Entrenamiento (Segundos)</label>
      <div class="cfg-row">
        <div class="cfg-input-wrap">
          <input type="number" id="cfgWarmup" placeholder="Calent." value="600">
          <span>cal. (s)</span>
        </div>
        <div class="cfg-input-wrap">
          <input type="number" id="cfgIntensity" placeholder="HIIT" value="30">
          <span>hiit (s)</span>
        </div>
      </div>
      <div class="cfg-row" style="margin-top: 8px;">
        <div class="cfg-input-wrap">
          <input type="number" id="cfgRecovery" placeholder="Recup." value="90">
          <span>rec. (s)</span>
        </div>
        <div class="cfg-input-wrap">
          <input type="number" id="cfgCooldown" placeholder="Enfriam." value="600">
          <span>enfr. (s)</span>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="cancel-cfg-btn" id="cancelCfgBtn">Cancelar</button>
      <button class="save-cfg-btn" id="saveCfgBtn">Guardar</button>
    </div>
  </div>
</div>

<!-- CAPA DE BLOQUEO DE PANTALLA -->
<div class="lock-overlay" id="lockOverlay">
  <div id="lockTimerDisplay">00:00</div>
  <div id="lockPhaseDisplay">Preparado</div>
  <div id="lockCalDisplay">🔥 0 kcal</div>
  
  <div class="unlock-zone">
    <div class="status-text">PANTALLA BLOQUEADA</div>
    <div class="unlock-btn" id="unlockBtn">
        <svg viewBox="0 0 24 24"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM8.9 6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2H8.9V6zM18 20H6V10h12v10z"/></svg>
        <span>Mantén pulsado</span>
        <div class="unlock-progress" id="unlockProgress"></div>
    </div>
  </div>
</div>

<script>
// ---------- Registrar Service Worker ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/mi-lista/hiit/sw.js');
  });
}

// ---------- Configuración por defecto / LocalStorage ----------
const DEFAULT_CONFIG = {
  weight: 75,
  rounds: 8,
  warmup: 600,
  intensity: 30,
  recovery: 90,
  cooldown: 600
};

let userConfig = JSON.parse(localStorage.getItem('hiit_config')) || DEFAULT_CONFIG;

// METs según la fase para cálculo de calorías
const METS = {
  warmup: 7.0,
  intensity: 12.5,
  recovery: 4.0,
  cooldown: 6.0
};

// ---------- Audio / Keep-Alive ----------
const silentAudio = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=");
silentAudio.loop = true;

// ---------- Build Workout Plan ----------
let PHASES = [];
let TOTAL_SECONDS = 0;

function buildPhases(){
  const phases = [];
  if(userConfig.warmup > 0) {
    phases.push({type:'warmup', duration:userConfig.warmup, label:'Calentamiento', say:'Empezando calentamiento'});
  }
  for(let i=1; i<=userConfig.rounds; i++){
    phases.push({type:'intensity', duration:userConfig.intensity, label:'Intensidad máx.', round:i, say:`Serie ${i}. ¡Rápido!`});
    phases.push({type:'recovery', duration:userConfig.recovery, label:'Recuperación', round:i, say:'Recupera.'});
  }
  if(userConfig.cooldown > 0) {
    phases.push({type:'cooldown', duration:userConfig.cooldown, label:'Trote suave', say:'Trote suave final.'});
  }
  phases.push({type:'end', duration:0, label:'Fin', say:'Entrenamiento completado.'});
  return phases;
}

function initWorkoutPlan() {
  PHASES = buildPhases();
  TOTAL_SECONDS = PHASES.reduce((a,p)=>a+p.duration,0);
  document.getElementById('workoutTitle').textContent = `${userConfig.rounds} series intensas`;
  
  // Reconstruir segmentos visuales
  segmentsEl.innerHTML = '';
  PHASES.filter(p=>p.type!=='end').forEach((p)=>{
    const seg = document.createElement('div');
    seg.className = 'seg ' + p.type;
    seg.dataset.index = PHASES.indexOf(p);
    const fill = document.createElement('div');
    fill.className = 'fill';
    seg.appendChild(fill);
    segmentsEl.appendChild(seg);
  });
  
  roundLabelEl.textContent = `${Math.round(userConfig.warmup/60)}' cal. · ${userConfig.rounds}×(${userConfig.intensity}"/${userConfig.recovery}") · ${Math.round(userConfig.cooldown/60)}' trote`;
  timerEl.textContent = fmt(TOTAL_SECONDS);
  lockTimerDisplay.textContent = fmt(TOTAL_SECONDS);
}

// ---------- DOM refs ----------
const appContent = document.getElementById('appContent');
const phaseLabelEl = document.getElementById('phaseLabel');
const roundLabelEl = document.getElementById('roundLabel');
const timerEl = document.getElementById('timer');
const calDisplay = document.getElementById('calDisplay');
const segmentsEl = document.getElementById('segments');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const testBtn = document.getElementById('testBtn');
const configBtn = document.getElementById('configBtn');
const configModal = document.getElementById('configModal');
const saveCfgBtn = document.getElementById('saveCfgBtn');
const cancelCfgBtn = document.getElementById('cancelCfgBtn');
const lockBtn = document.getElementById('lockBtn');
const lockOverlay = document.getElementById('lockOverlay');
const lockTimerDisplay = document.getElementById('lockTimerDisplay');
const lockPhaseDisplay = document.getElementById('lockPhaseDisplay');
const lockCalDisplay = document.getElementById('lockCalDisplay');
const unlockBtn = document.getElementById('unlockBtn');
const unlockProgress = document.getElementById('unlockProgress');

// ---------- State ----------
let phaseIndex = -1;
let phaseEndsAt = 0;
let remainingAtPause = null;
let tickHandle = null;
let running = false;
let wakeLock = null;
let beepedSecond = null;
let isLocked = false;
let totalCaloriesBurned = 0;
let lastTickTime = 0;

function fmt(sec){
  sec = Math.max(0, Math.ceil(sec));
  const m = Math.floor(sec/60);
  const s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

// ---------- Speech ----------
let esVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  esVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('es')) || null;
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();
}
function say(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-ES';
  if(esVoice) u.voice = esVoice;
  u.rate = 1.1;
  speechSynthesis.speak(u);
}

// ---------- Beep & Vibration ----------
let audioCtx = null;
function beep(freq=880, duration=0.12){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }catch(e){}
}
function vibrate(pattern){ if(navigator.vibrate) navigator.vibrate(pattern); }

// ---------- Wake Lock & Fullscreen ----------
async function requestWakeLock(){
  if('wakeLock' in navigator && running){
    try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
  }
}
function toggleFullscreen(activate) {
  if (!document.fullscreenEnabled) return;
  if (activate && !document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  } else if (!activate && document.fullscreenElement) {
    document.exitFullscreen().catch(()=>{});
  }
}

// ---------- UI Update ----------
function updateSegmentsUI(){
  const segEls = segmentsEl.querySelectorAll('.seg');
  const remain = (phaseEndsAt - Date.now())/1000;
  segEls.forEach(seg=>{
    const idx = parseInt(seg.dataset.index,10);
    const fill = seg.querySelector('.fill');
    if(idx < phaseIndex){
      fill.style.width = '100%';
    } else if(idx === phaseIndex){
      const p = PHASES[idx];
      const pct = p.duration ? Math.min(100, Math.max(0, (1 - remain/p.duration) * 100)) : 100;
      fill.style.width = pct + '%';
    } else { fill.style.width = '0%'; }
  });
}

function colorFor(type){
  return {warmup:'var(--warmup)', intensity:'var(--intensity)', recovery:'var(--recovery)',
          cooldown:'var(--cooldown)', end:'var(--end)'}[type] || 'var(--text)';
}

function renderPhase(){
  const p = PHASES[phaseIndex];
  const color = colorFor(p.type);
  document.documentElement.style.setProperty('--phase-color', color);
  
  phaseLabelEl.textContent = p.label;
  lockPhaseDisplay.textContent = p.label;
  roundLabelEl.textContent = p.round ? `Serie ${p.round} de ${userConfig.rounds}` : (p.type==='end' ? 'Buen trabajo' : '');
}

// ---------- Phase Transitions & Tick ----------
function startPhase(idx){
  phaseIndex = idx;
  const p = PHASES[phaseIndex];
  renderPhase();
  say(p.say);
  vibrate(p.type === 'intensity' ? [200,100,200] : p.type === 'recovery' ? [150] : [100]);
  beepedSecond = null;

  if(p.type === 'end'){
    timerEl.textContent = '00:00';
    lockTimerDisplay.textContent = '00:00';
    updateSegmentsUI();
    stop(true);
    return;
  }
  phaseEndsAt = Date.now() + p.duration*1000;
  lastTickTime = Date.now();
  if(!tickHandle) tickHandle = setInterval(tick, 200);
}

function tick(){
  const p = PHASES[phaseIndex];
  const now = Date.now();
  const deltaSec = (now - lastTickTime) / 1000;
  lastTickTime = now;

  // Cálculo en tiempo real de calorías
  if(p.type !== 'end' && METS[p.type]) {
    const met = METS[p.type];
    const calPerSec = (met * 3.5 * userConfig.weight) / (200 * 60);
    totalCaloriesBurned += calPerSec * deltaSec;
    const roundedCal = Math.floor(totalCaloriesBurned);
    calDisplay.textContent = roundedCal;
    lockCalDisplay.textContent = `🔥 ${roundedCal} kcal`;
  }

  const remain = (phaseEndsAt - now)/1000;
  const timeStr = fmt(remain);
  timerEl.textContent = timeStr;
  lockTimerDisplay.textContent = timeStr;
  
  updateSegmentsUI();

  const remainInt = Math.ceil(remain);
  if(remainInt <= 3 && remainInt >= 1 && remainInt !== beepedSecond){
    beepedSecond = remainInt;
    beep(remainInt === 1 ? 1200 : 800);
  }

  if(remain <= 0){
    if(phaseIndex + 1 < PHASES.length) startPhase(phaseIndex + 1);
    else stop(true);
  }
}

// ---------- Controls ----------
async function start(){
  configBtn.disabled = true; // Desactivar config durante sesión
  if(phaseIndex === -1){
    running = true;
    totalCaloriesBurned = 0;
    calDisplay.textContent = '0';
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    resetBtn.disabled = false;
    silentAudio.play().catch(()=>{});
    await requestWakeLock();
    toggleFullscreen(true);
    startPhase(0);
  } else if(remainingAtPause !== null){
    running = true;
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    phaseEndsAt = Date.now() + remainingAtPause*1000;
    remainingAtPause = null;
    lastTickTime = Date.now();
    if(!tickHandle) tickHandle = setInterval(tick, 200);
    say('Reanudando');
    await requestWakeLock();
    toggleFullscreen(true);
  }
}

function pause(){
  if(!running || phaseIndex === -1) return;
  running = false;
  remainingAtPause = (phaseEndsAt - Date.now())/1000;
  clearInterval(tickHandle);
  tickHandle = null;
  speechSynthesis.cancel();
  startBtn.disabled = false;
  startBtn.textContent = 'Reanudar';
  pauseBtn.disabled = true;
  toggleFullscreen(false);
}

function stop(finished){
  running = false;
  clearInterval(tickHandle);
  tickHandle = null;
  silentAudio.pause();
  configBtn.disabled = false;
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
  toggleFullscreen(false);
  startBtn.disabled = finished ? true : false;
  pauseBtn.disabled = true;
  if(finished){
    phaseLabelEl.textContent = 'Fin de sesión';
    lockPhaseDisplay.textContent = 'Fin';
    roundLabelEl.textContent = '¡Sesión completada!';
  }
}

function reset(){
  clearInterval(tickHandle);
  tickHandle = null;
  speechSynthesis.cancel();
  silentAudio.pause();
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
  toggleFullscreen(false);
  
  phaseIndex = -1;
  remainingAtPause = null;
  running = false;
  totalCaloriesBurned = 0;
  calDisplay.textContent = '0';
  lockCalDisplay.textContent = '🔥 0 kcal';
  configBtn.disabled = false;
  
  startBtn.disabled = false;
  startBtn.textContent = 'Empezar';
  pauseBtn.disabled = true;
  resetBtn.disabled = true;
  document.documentElement.style.removeProperty('--phase-color');
  
  phaseLabelEl.textContent = 'Preparado';
  lockPhaseDisplay.textContent = 'Preparado';
  phaseLabelEl.style.color = '';
  
  initWorkoutPlan();
}

// ---------- Config Modal Logic ----------
configBtn.addEventListener('click', () => {
  document.getElementById('cfgWeight').value = userConfig.weight;
  document.getElementById('cfgRounds').value = userConfig.rounds;
  document.getElementById('cfgWarmup').value = userConfig.warmup;
  document.getElementById('cfgIntensity').value = userConfig.intensity;
  document.getElementById('cfgRecovery').value = userConfig.recovery;
  document.getElementById('cfgCooldown').value = userConfig.cooldown;
  configModal.classList.add('active');
});

cancelCfgBtn.addEventListener('click', () => {
  configModal.classList.remove('active');
});

saveCfgBtn.addEventListener('click', () => {
  userConfig = {
    weight: parseFloat(document.getElementById('cfgWeight').value) || 70,
    rounds: parseInt(document.getElementById('cfgRounds').value, 10) || 8,
    warmup: parseInt(document.getElementById('cfgWarmup').value, 10) || 0,
    intensity: parseInt(document.getElementById('cfgIntensity').value, 10) || 30,
    recovery: parseInt(document.getElementById('cfgRecovery').value, 10) || 90,
    cooldown: parseInt(document.getElementById('cfgCooldown').value, 10) || 0
  };
  
  localStorage.setItem('hiit_config', JSON.stringify(userConfig));
  configModal.classList.remove('active');
  reset();
});

// ---------- Screen Lock Overlay Logic ----------
let unlockTimer = null;
let unlockStartTime = 0;
const UNLOCK_HOLD_MS = 1600;

function setLockState(locked) {
    isLocked = locked;
    if(locked) {
        lockOverlay.classList.add('active');
        appContent.classList.add('blur-bg');
        if(running) toggleFullscreen(true);
    } else {
        lockOverlay.classList.remove('active');
        appContent.classList.remove('blur-bg');
    }
}

lockBtn.addEventListener('click', () => setLockState(true));
lockOverlay.addEventListener('touchmove', (e) => {
    if(isLocked && e.touches.length === 1) e.preventDefault();
}, {passive: false});

function startUnlockProgress(e) {
  e.preventDefault();
  if(!isLocked) return;
  vibrate(40);
  unlockStartTime = Date.now();
  unlockBtn.classList.add('pressing');
  unlockProgress.style.height = '0%';
  
  if(unlockTimer) clearInterval(unlockTimer);
  unlockTimer = setInterval(() => {
    const elapsed = Date.now() - unlockStartTime;
    const pct = Math.min(100, (elapsed / UNLOCK_HOLD_MS) * 100);
    unlockProgress.style.height = pct + '%';
    
    if (elapsed >= UNLOCK_HOLD_MS) {
      clearInterval(unlockTimer);
      unlockTimer = null;
      endUnlockPress();
      setLockState(false);
      vibrate([80, 60, 80]);
    }
  }, 40);
}

function endUnlockPress() {
  if (unlockTimer) {
    clearInterval(unlockTimer);
    unlockTimer = null;
  }
  unlockBtn.classList.remove('pressing');
  unlockProgress.style.height = '0%';
}

unlockBtn.addEventListener('touchstart', startUnlockProgress, {passive: false});
unlockBtn.addEventListener('touchend', endUnlockPress);
unlockBtn.addEventListener('touchcancel', endUnlockPress);
unlockBtn.addEventListener('mousedown', startUnlockProgress);
unlockBtn.addEventListener('mouseup', endUnlockPress);
unlockBtn.addEventListener('mouseleave', endUnlockPress);

startBtn.addEventListener('click', start);
pauseBtn.addEventListener('click', pause);
resetBtn.addEventListener('click', reset);
testBtn.addEventListener('click', ()=>{
  say('Sonido funcionando.');
  beep(880);
  vibrate(150);
});

// Inicialización
initWorkoutPlan();
</script>
