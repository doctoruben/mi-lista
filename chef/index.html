<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chef AI | Smart Cooking</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root{
            --primary:#10b981;
            --bg:#f8fafc;
            --card:#fff;
            --text:#1e293b;
            --muted:#64748b;
            --border:#e2e8f0;
            --radius:16px;
        }
        body{
            margin:0;
            font-family:DM Sans,sans-serif;
            background:var(--bg);
            color:var(--text);
        }
        .container{max-width:720px;margin:20px auto;padding:16px;}

        .top{
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .badge{
            padding:6px 12px;
            border-radius:999px;
            background:var(--card);
            border:1px solid var(--border);
            cursor:pointer;
            font-size:12px;
        }
        .badge.active{
            background:var(--primary);
            color:#fff;
            border:none;
        }

        .card{
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius);
            padding:16px;
            margin-top:16px;
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:10px;
        }

        .chip{
            padding:6px 10px;
            border-radius:999px;
            border:1px solid var(--border);
            cursor:pointer;
            font-size:13px;
            background:#fff;
        }
        .chip.active{
            background:var(--primary);
            color:#fff;
            border:none;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:12px;
            background:var(--primary);
            color:#fff;
            font-weight:600;
            cursor:pointer;
            margin-top:10px;
        }

        .mode-switch{
            display:flex;
            gap:8px;
        }

        .result{
            white-space:pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="top">
        <h2>🍳 Chef AI</h2>
        <div class="mode-switch">
            <div id="normalBtn" class="badge active" onclick="setMode('normal')">Normal</div>
            <div id="ketoBtn" class="badge" onclick="setMode('keto')">Keto</div>
        </div>
    </div>

    <div class="card">
        <h3>Tipo de comida</h3>
        <div class="grid">
            <div class="chip" onclick="setMeal('desayuno')">🍳 Desayuno</div>
            <div class="chip" onclick="setMeal('almuerzo')">🥗 Almuerzo</div>
            <div class="chip" onclick="setMeal('cena')">🌙 Cena</div>
        </div>

        <h3 style="margin-top:16px">Ingredientes</h3>
        <div id="chips" class="grid"></div>

        <button onclick="generate()">Generar receta</button>
    </div>

    <div class="card result" id="result"></div>

</div>

<script>

let mode = 'normal';
let meal = 'desayuno';
let selected = new Set();

const INGREDIENTS = {
  proteinas:['Pollo','Ternera','Pescado','Huevos'],
  verduras:['Tomate','Lechuga','Cebolla','Zanahoria'],
  carbs:['Arroz','Pasta','Patata','Pan'],
  extras:['Aceite oliva','Ajo','Queso','Especias']
};

function render(){
    const c=document.getElementById('chips');
    c.innerHTML='';
    Object.values(INGREDIENTS).flat().forEach(i=>{
        const el=document.createElement('div');
        el.className='chip'+(selected.has(i)?' active':'');
        el.textContent=i;
        el.onclick=()=>{
            selected.has(i)?selected.delete(i):selected.add(i);
            render();
        };
        c.appendChild(el);
    });
}

function setMode(m){
    mode=m;
    document.getElementById('normalBtn').classList.toggle('active',m==='normal');
    document.getElementById('ketoBtn').classList.toggle('active',m==='keto');
}

function setMeal(m){meal=m;}

function generate(){

    const ing=[...selected].join(', ');

    const prompt = mode==='keto'
    ? `Actúa como chef keto.
Crea receta keto para ${meal}.
Ingredientes: ${ing}.
Sin exceder carbohidratos.
Formato HTML.`
    : `Actúa como chef profesional.
Crea receta para ${meal}.
Ingredientes: ${ing}.
Puede incluir arroz, pasta, pan, etc.
Formato HTML.`;

    document.getElementById('result').innerText = prompt;
}

render();

</script>

</body>
</html>
