<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>MyChef | AI Cooking Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #10b981;
            --primary-light: #d1fae5;
            --primary-dark: #059669;
            --dark: #0f172a;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
            --radius: 1.2rem;
            --chip-bg: #f1f5f9;
            --chip-selected: #d1fae5;
            --chip-selected-border: #10b981;
            --modal-bg: rgba(15,23,42,0.65);
            --input-bg: #f8fafc;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --chip-bg: #334155;
            --chip-selected: #064e3b;
            --chip-selected-border: #10b981;
            --modal-bg: rgba(0,0,0,0.8);
            --input-bg: #1e293b;
        }

        * { box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); margin: 0; color: var(--text); transition: background 0.3s, color 0.3s; min-height: 100vh; }

        .navbar {
            background: var(--card); padding: 0.9rem 1.2rem; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(8px);
        }
        .navbar-brand h2 { margin: 0; font-family: 'DM Serif Display', serif; font-size: 1.3rem; color: var(--text); }
        .nav-btns { display: flex; gap: 8px; align-items: center; }
        
        .mode-toggle {
            display: flex; align-items: center; background: var(--chip-bg); padding: 4px; border-radius: 50px; cursor: pointer;
            border: 1px solid var(--border); margin-right: 8px;
        }
        .mode-btn { padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; transition: all 0.2s; }
        .mode-btn.active { background: var(--primary); color: white; box-shadow: 0 2px 8px rgba(16,185,129,0.3); }
        .mode-btn:not(.active) { color: var(--text-muted); }

        .container { max-width: 680px; margin: 1.5rem auto; padding: 0 1rem; }
        .section-label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.8rem; }
        .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; }
        .btn-card { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 1.4rem 0.5rem; cursor: pointer; text-align: center; transition: all 0.2s; box-shadow: var(--shadow); }
        .btn-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .btn-card.selected { border-color: var(--primary); background: var(--chip-selected); }
        .btn-card span { display: block; font-size: 2rem; margin-bottom: 0.4rem; }
        .btn-card h3 { margin: 0; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); }
        .btn-full { width: 100%; margin-top: 1rem; padding: 1rem 1.2rem; background: var(--dark); color: white; border-radius: var(--radius); border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
        [data-theme="dark"] .btn-full { background: var(--primary); }
        .ing-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
        .chips-wrap { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .chip { background: var(--chip-bg); border: 1.5px solid transparent; border-radius: 2rem; padding: 0.35rem 0.85rem; font-size: 0.82rem; cursor: pointer; color: var(--text); }
        .chip.active { background: var(--chip-selected); border-color: var(--chip-selected-border); color: var(--primary-dark); font-weight: 600; }
        .custom-ing-wrap { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
        .custom-ing-input { flex: 1; padding: 0.6rem 1rem; border: 1.5px solid var(--border); border-radius: 2rem; font-family: 'DM Sans', sans-serif; background: var(--input-bg); color: var(--text); outline: none; }
        .custom-ing-btn { padding: 0.6rem 1rem; background: var(--primary); color: white; border: none; border-radius: 2rem; cursor: pointer; }
        .step-nav { display: flex; gap: 0.8rem; margin-top: 1rem; }
        .btn-back { flex: 0 0 auto; padding: 1rem 1.2rem; background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); cursor: pointer; color: var(--text-muted); }
        .btn-generate { flex: 1; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: var(--radius); font-weight: 700; cursor: pointer; }
        .loader-wrap { text-align: center; padding: 3rem 1rem; }
        .loader { border: 3px solid var(--border); border-top: 3px solid var(--primary); border-radius: 50%; width: 36px; height: 36px; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .recipe-box { background: var(--card); padding: 1.5rem; border-radius: 1.5rem; border: 1px solid var(--border); box-shadow: var(--shadow); }
        #recipeContent h2 { font-family: 'DM Serif Display', serif; }
        #recipeContent table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        #recipeContent th { background: var(--chip-bg); padding: 10px; text-align: left; }
        #recipeContent td { padding: 10px; border-bottom: 1px solid var(--border); }
        .result-actions { margin-top: 1.2rem; display: grid; grid-template-columns: 1fr auto auto; gap: 0.7rem; }
        .btn-pdf { padding: 0.9rem 1.2rem; background: var(--primary); color: white; border: none; border-radius: var(--radius); font-weight: 700; cursor: pointer; }
        .btn-icon { padding: 0.9rem 1rem; background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); cursor: pointer; }
        .modal { position: fixed; inset: 0; background: var(--modal-bg); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 15px; backdrop-filter: blur(4px); }
        .modal-content { background: var(--card); padding: 1.5rem; border-radius: 1.5rem; width: 100%; max-width: 360px; max-height: 85vh; overflow-y: auto; }
        .hidden { display: none !important; }
        .nav-btn { background: var(--chip-bg); border: none; border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: 13px; }
        .ing-tag { display: flex; align-items: center; gap: 4px; background: var(--primary-light); color: var(--primary-dark); border-radius: 2rem; padding: 0.25rem 0.7rem; font-size: 0.8rem; margin-top: 5px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <h2>MyChef 👨‍🍳</h2>
        </div>
        <div class="nav-btns">
            <!-- Selector de modo -->
            <div class="mode-toggle" onclick="toggleKetoMode()">
                <div id="modeKeto" class="mode-btn active">Keto</div>
                <div id="modeConv" class="mode-btn">Conv.</div>
            </div>
            <button class="nav-btn" onclick="openRecientes()">🕒</button>
            <button class="nav-btn" onclick="toggleDark()" id="darkBtn">🌙</button>
            <button class="nav-btn" onclick="toggleModal(true)">⚙️</button>
        </div>
    </nav>

    <div class="container">
        <div id="selectionArea">
            <p class="section-label">¿Qué comida necesitas?</p>
            <div class="menu-grid">
                <button class="btn-card" onclick="selectMeal('desayuno', this)"><span>🍳</span><h3>Desayuno</h3></button>
                <button class="btn-card" onclick="selectMeal('almuerzo', this)"><span>🥗</span><h3>Almuerzo</h3></button>
                <button class="btn-card" onclick="selectMeal('cena', this)"><span>🌙</span><h3>Cena</h3></button>
            </div>
            <button class="btn-full" onclick="selectMeal('menú completo del día', null)">📅 Menú Diario Completo</button>
        </div>

        <div id="ingredientStep" class="hidden">
            <p class="section-label">Personaliza tu receta</p>
            <div class="ing-card">
                <p class="ing-card-title">🥩 Proteínas</p>
                <div class="chips-wrap" id="chips-proteinas"></div>
            </div>
            <!-- Carbohidratos: Solo visibles en modo Convencional -->
            <div class="ing-card" id="card-carbohidratos">
                <p class="ing-card-title">🍚 Carbohidratos</p>
                <div class="chips-wrap" id="chips-carbohidratos"></div>
            </div>
            <div class="ing-card">
                <p class="ing-card-title">🥦 Verduras</p>
                <div class="chips-wrap" id="chips-verduras"></div>
            </div>
            <div class="ing-card">
                <p class="ing-card-title">➕ Añadir ingrediente libre</p>
                <div class="custom-ing-wrap">
                    <input class="custom-ing-input" type="text" id="customIngInput" placeholder="ej. jengibre..." onkeydown="if(event.key==='Enter') addCustomIng()">
                    <button class="custom-ing-btn" onclick="addCustomIng()">+</button>
                </div>
                <div class="selected-ings-wrap" id="customIngTags"></div>
            </div>
            <div class="step-nav">
                <button class="btn-back" onclick="goBackToSelection()">← Volver</button>
                <button class="btn-generate" onclick="generateRecipe()">✨ Generar Receta</button>
            </div>
        </div>

        <div id="loading" class="hidden">
            <div class="loader-wrap">
                <div class="loader"></div>
                <p class="loader-text" id="loaderText">Cocinando...</p>
            </div>
        </div>

        <div id="recipeResult" class="hidden">
            <div class="recipe-box" id="printArea">
                <div id="recipeContent"></div>
            </div>
            <div class="result-actions">
                <button class="btn-pdf" onclick="exportToPDF()">⬇ PDF</button>
                <button class="btn-icon" onclick="copyRecipe()">📋</button>
                <button class="btn-icon" onclick="resetUI()">↩</button>
            </div>
        </div>
    </div>

    <!-- Modales -->
    <div id="configModal" class="modal hidden">
        <div class="modal-content">
            <h3>Ajustes de API</h3>
            <input type="password" id="gemKey" placeholder="Gemini API Key" style="width:100%; margin-bottom:10px; padding:10px;">
            <button class="btn-generate" style="width:100%" onclick="saveKeys()">Guardar</button>
            <button class="btn-back" style="width:100%; margin-top:10px;" onclick="toggleModal(false)">Cerrar</button>
        </div>
    </div>

    <div id="recientesModal" class="modal hidden">
        <div class="modal-content">
            <h3>Historial MyChef</h3>
            <div id="listaRecientes"></div>
            <button class="btn-back" style="width:100%; margin-top:10px;" onclick="closeRecientes()">Cerrar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBnmTgJYFsFAFWnGyaDZRUxOZGnL5SE1QA",
            authDomain: "lista-compra-9d6f5.firebaseapp.com",
            databaseURL: "https://lista-compra-9d6f5-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lista-compra-9d6f5",
            storageBucket: "lista-compra-9d6f5.firebasestorage.app",
            messagingSenderId: "241322134457",
            appId: "1:241322134457:web:1b765857911f94d69cc468"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let ketoMode = true;
        let selectedMeal = null;
        let selectedChips = new Set();
        let customIngredients = [];

        const INGREDIENTS = {
            proteinas: ['Pollo','Salmón','Ternera','Cerdo','Huevos','Gambas','Pavo','Lomo'],
            verduras: ['Espinacas','Brócoli','Aguacate','Calabacín','Pimiento','Espárragos','Setas'],
            carbohidratos: ['Arroz','Pasta','Patatas','Legumbres','Pan','Cuscús','Quinoa']
        };

        function toggleKetoMode() {
            ketoMode = !ketoMode;
            document.getElementById('modeKeto').classList.toggle('active', ketoMode);
            document.getElementById('modeConv').classList.toggle('active', !ketoMode);
            if(!document.getElementById('ingredientStep').classList.contains('hidden')) renderChips();
        }

        function renderChips() {
            renderCat('proteinas', INGREDIENTS.proteinas);
            renderCat('verduras', INGREDIENTS.verduras);
            const carbCard = document.getElementById('card-carbohidratos');
            if (ketoMode) carbCard.classList.add('hidden');
            else { carbCard.classList.remove('hidden'); renderCat('carbohidratos', INGREDIENTS.carbohidratos); }
        }

        function renderCat(id, items) {
            const wrap = document.getElementById(`chips-${id}`);
            wrap.innerHTML = '';
            items.forEach(item => {
                const chip = document.createElement('button');
                chip.className = 'chip' + (selectedChips.has(item) ? ' active' : '');
                chip.textContent = item;
                chip.onclick = () => {
                    if(selectedChips.has(item)) selectedChips.delete(item);
                    else selectedChips.add(item);
                    chip.classList.toggle('active');
                };
                wrap.appendChild(chip);
            });
        }

        window.selectMeal = (tipo, card) => {
            selectedMeal = tipo;
            document.querySelectorAll('.btn-card').forEach(c => c.classList.remove('selected'));
            if(card) card.classList.add('selected');
            document.getElementById('selectionArea').classList.add('hidden');
            document.getElementById('ingredientStep').classList.remove('hidden');
            renderChips();
        };

        window.generateRecipe = async function() {
            const gKey = localStorage.getItem('G_KEY');
            if (!gKey) return toggleModal(true);

            document.getElementById('ingredientStep').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            const allIngs = [...selectedChips, ...customIngredients].join(', ');
            
            // Prompt mejorado para versión 2.5
            const prompt = `Actúa como Chef ${ketoMode ? 'Keto' : 'Profesional'}. 
            Genera una receta de ${selectedMeal} que sea ${ketoMode ? 'estrictamente Keto (sin carbos)' : 'convencional (amplía ingredientes y técnica)'}.
            Ingredientes disponibles: ${allIngs}.
            Responde ÚNICAMENTE con formato HTML válido (h2 para título, h3 para secciones, ul para lista, table para macros).`;

            try {
                // LLAMADA ESPECÍFICA A VERSIÓN 2.5
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${gKey}`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                
                const data = await res.json();
                if(data.error) throw new Error(data.error.message);

                let htmlResult = data.candidates[0].content.parts[0].text.replace(/```html|
```/g, '').trim();

                // Guardado en árbol "chef"
                db.ref('chef/recetas').push({
                    titulo: (ketoMode ? "[KETO] " : "[CONV] ") + selectedMeal,
                    contenido: htmlResult,
                    timestamp: Date.now()
                });

                document.getElementById('recipeContent').innerHTML = htmlResult;
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('recipeResult').classList.remove('hidden');
            } catch (e) {
                alert("Error de API 2.5: " + e.message);
                goBackToSelection();
                document.getElementById('loading').classList.add('hidden');
            }
        };

        window.addCustomIng = () => {
            const i = document.getElementById('customIngInput');
            if(i.value) { customIngredients.push(i.value); renderCustomTags(); i.value = ''; }
        };

        function renderCustomTags() {
            const w = document.getElementById('customIngTags');
            w.innerHTML = '';
            customIngredients.forEach(i => {
                const s = document.createElement('span');
                s.className = 'ing-tag'; s.textContent = i; w.appendChild(s);
            });
        }

        window.openRecientes = async () => {
            document.getElementById('recientesModal').classList.remove('hidden');
            const list = document.getElementById('listaRecientes');
            list.innerHTML = 'Buscando recetas...';
            // Lectura desde árbol "chef"
            const snap = await db.ref('chef/recetas').limitToLast(15).once('value');
            list.innerHTML = '';
            snap.forEach(child => {
                const r = child.val();
                const d = document.createElement('div');
                d.style = "padding: 12px; border-bottom: 1px solid var(--border); cursor:pointer;";
                d.innerHTML = `<strong>${r.titulo}</strong> <br> <small>${new Date(r.timestamp).toLocaleDateString()}</small>`;
                d.onclick = () => {
                    document.getElementById('recipeContent').innerHTML = r.contenido;
                    document.getElementById('selectionArea').classList.add('hidden');
                    document.getElementById('recipeResult').classList.remove('hidden');
                    document.getElementById('recientesModal').classList.add('hidden');
                };
                list.appendChild(d);
            });
        };

        window.resetUI = () => location.reload();
        window.goBackToSelection = () => { document.getElementById('ingredientStep').classList.add('hidden'); document.getElementById('selectionArea').classList.remove('hidden'); };
        window.toggleModal = (s) => document.getElementById('configModal').classList.toggle('hidden', !s);
        window.saveKeys = () => { localStorage.setItem('G_KEY', document.getElementById('gemKey').value); toggleModal(false); };
        window.closeRecientes = () => document.getElementById('recientesModal').classList.add('hidden');
        function toggleDark() { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); }
        
        document.getElementById('gemKey').value = localStorage.getItem('G_KEY') || '';
    </script>
</body>
</html>
