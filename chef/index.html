<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyChef | AI Cooking</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #10b981; --dark: #0f172a; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --border: #334155; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 50px; transition: 0.3s; }
        .navbar { background: var(--card); padding: 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); sticky: top; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .btn-card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 20px 10px; cursor: pointer; text-align: center; color: var(--text); }
        .btn-card.selected { border-color: var(--primary); background: #d1fae5; color: #064e3b; }
        .ing-card { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 15px; }
        .chips-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .chip { background: #f1f5f9; border: none; padding: 8px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
        .chip.active { background: var(--primary); color: white; }
        .btn-generate { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 15px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 20px; }
        .hidden { display: none !important; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 20px; width: 90%; max-width: 400px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); }
    </style>
</head>
<body>

    <nav class="navbar">
        <h2 style="font-family:'DM Serif Display'; margin:0;">MyChef 👨‍🍳</h2>
        <div>
            <button onclick="toggleDark()" style="background:none; border:none; cursor:pointer; font-size:1.2rem;">🌙</button>
            <button onclick="openConfig()" style="background:none; border:none; cursor:pointer; font-size:1.2rem; margin-left:10px;">⚙️</button>
        </div>
    </nav>

    <div class="container">
        <!-- Paso 1: Selección de comida -->
        <div id="step1">
            <p style="font-weight:600; font-size:0.8rem; color:#64748b; text-transform:uppercase;">¿Qué cocinamos hoy?</p>
            <div class="menu-grid">
                <button class="btn-card" onclick="setMeal('desayuno', this)"><span>🍳</span><br>Desayuno</button>
                <button class="btn-card" onclick="setMeal('almuerzo', this)"><span>🥗</span><br>Almuerzo</button>
                <button class="btn-card" onclick="setMeal('cena', this)"><span>🌙</span><br>Cena</button>
            </div>
        </div>

        <!-- Paso 2: Ingredientes -->
        <div id="step2" class="hidden" style="margin-top:20px;">
            <div class="ing-card">
                <p style="margin:0 0 10px 0; font-weight:600;">🥩 Proteínas</p>
                <div class="chips-wrap" id="list-proteinas"></div>
            </div>
            <div class="ing-card">
                <p style="margin:0 0 10px 0; font-weight:600;">🥦 Verduras</p>
                <div class="chips-wrap" id="list-verduras"></div>
            </div>
            <button class="btn-generate" onclick="generateRecipe()">✨ Generar Receta</button>
            <button onclick="location.reload()" style="width:100%; background:none; border:none; color:#64748b; margin-top:10px; cursor:pointer;">← Volver</button>
        </div>

        <!-- Cargando -->
        <div id="loading" class="hidden" style="text-align:center; padding:40px;">
            <div class="loader"></div>
            <p id="loading-text">Consultando al Chef...</p>
        </div>

        <!-- Resultado -->
        <div id="result" class="hidden">
            <div id="recipe-content" style="background:white; color:#1e293b; padding:20px; border-radius:20px; border:1px solid #e2e8f0; line-height:1.6;"></div>
            <button class="btn-generate" onclick="location.reload()">Nueva Receta</button>
        </div>
    </div>

    <!-- Modal Config -->
    <div id="modalConfig" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-top:0;">Configuración API</h3>
            <label style="font-size:0.8rem;">Gemini API Key:</label>
            <input type="password" id="apiKey" placeholder="Pega tu clave aquí...">
            <button class="btn-generate" onclick="saveConfig()">Guardar y Cerrar</button>
        </div>
    </div>

    <script>
        // Inicializar Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBnmTgJYFsFAFWnGyaDZRUxOZGnL5SE1QA",
            authDomain: "lista-compra-9d6f5.firebaseapp.com",
            databaseURL: "https://lista-compra-9d6f5-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lista-compra-9d6f5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let selectedMeal = '';
        let selectedIngs = new Set();
        const INGS = {
            proteinas: ['Pollo', 'Ternera', 'Huevos', 'Salmón', 'Pavo', 'Atún'],
            verduras: ['Brócoli', 'Espinacas', 'Aguacate', 'Tomate', 'Calabacín', 'Setas']
        };

        function setMeal(meal, el) {
            selectedMeal = meal;
            document.querySelectorAll('.btn-card').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            renderChips();
        }

        function renderChips() {
            ['proteinas', 'verduras'].forEach(cat => {
                const container = document.getElementById('list-' + cat);
                container.innerHTML = '';
                INGS[cat].forEach(ing => {
                    const btn = document.createElement('button');
                    btn.className = 'chip';
                    btn.textContent = ing;
                    btn.onclick = () => {
                        btn.classList.toggle('active');
                        if(selectedIngs.has(ing)) selectedIngs.delete(ing);
                        else selectedIngs.add(ing);
                    };
                    container.appendChild(btn);
                });
            });
        }

        async function generateRecipe() {
            const key = localStorage.getItem('MYCHEF_KEY');
            if(!key) return openConfig();

            document.getElementById('step2').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            const ingsText = Array.from(selectedIngs).join(', ');
            const prompt = `Genera una receta de ${selectedMeal} usando estos ingredientes: ${ingsText}. Responde solo en HTML (usa h2 para título, ul para ingredientes, p para pasos y una tabla para macros).`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                let html = data.candidates[0].content.parts[0].text;
                
                // Limpieza segura del markdown
                html = html.replace(/```html/g, '').replace(/```/g, '').trim();

                // Guardar en Firebase
                db.ref('chef/recetas').push({
                    titulo: selectedMeal.toUpperCase(),
                    receta: html,
                    fecha: Date.now()
                });

                document.getElementById('recipe-content').innerHTML = html;
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('result').classList.remove('hidden');

            } catch (err) {
                alert("Error al conectar con la IA. Revisa tu API Key.");
                location.reload();
            }
        }

        function openConfig() { document.getElementById('modalConfig').classList.remove('hidden'); }
        function saveConfig() {
            localStorage.setItem('MYCHEF_KEY', document.getElementById('apiKey').value);
            document.getElementById('modalConfig').classList.add('hidden');
        }
        function toggleDark() {
            const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        }

        // Cargar clave si existe
        if(localStorage.getItem('MYCHEF_KEY')) {
            document.getElementById('apiKey').value = localStorage.getItem('MYCHEF_KEY');
        }
    </script>
</body>
</html>
