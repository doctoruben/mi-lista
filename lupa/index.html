<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<title>Lupa Digital</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#1e293b;
    --bg-panel:#0f172a;
    --accent:#38bdf8;
    --accent-warn:#facc15;
    --text:#f1f5f9;
    --text-dim:#94a3b8;
    --danger:#f87171;
    --radius:16px;
    --extra-filter: ;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    user-select:none;
  }
  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
  }

  /* ---- Zona de cámara ---- */
  #viewport{
    position:relative;
    flex:1;
    overflow:hidden;
    background:#000;
    touch-action:none;
  }
  video{
    position:absolute; top:50%; left:50%;
    min-width:100%; min-height:100%;
    transform-origin:center center;
    transform:translate(-50%,-50%) scale(var(--zoom,1));
    filter:brightness(var(--bright,1)) contrast(var(--contrast,1)) var(--extra-filter);
    transition:filter .15s ease;
  }
  canvas#frozenCanvas{
    position:absolute; top:0; left:0; width:100%; height:100%;
    object-fit:cover;
    display:none;
    transform-origin:center center;
    transform:scale(var(--zoom,1));
    filter:brightness(var(--bright,1)) contrast(var(--contrast,1)) var(--extra-filter);
  }
  #startOverlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:24px; padding:32px; text-align:center; background:var(--bg);
    z-index:20;
  }
  #startOverlay h1{ font-size:clamp(24px,7vw,34px); margin:0; }
  #startOverlay p{ font-size:clamp(16px,4.5vw,20px); color:var(--text-dim); margin:0; max-width:420px; line-height:1.4;}
  #errorBox{
    position:absolute; inset:0; display:none; z-index:30;
    align-items:center; justify-content:center; padding:32px; text-align:center;
    background:var(--bg);
  }
  #errorBox p{ font-size:clamp(16px,4.5vw,20px); color:var(--text); max-width:420px; line-height:1.5; }

  .bigBtn{
    background:var(--accent); color:#0f172a; border:none;
    font-size:clamp(18px,5vw,22px); font-weight:700;
    padding:18px 32px; border-radius:999px;
    display:flex; align-items:center; gap:10px;
    cursor:pointer;
  }
  .bigBtn:active{ filter:brightness(.9); }

  /* ---- Indicador de zoom flotante ---- */
  #zoomBadge{
    position:absolute; top:16px; right:16px;
    background:rgba(15,23,42,.75);
    padding:8px 16px; border-radius:999px;
    font-size:20px; font-weight:700;
    z-index:10; pointer-events:none;
  }

  /* ---- Barra inferior de controles ---- */
  #controls{
    background:var(--bg-panel);
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:14px;
    z-index:15;
  }
  .sliderRow{
    display:flex; align-items:center; gap:12px;
  }
  .sliderRow label{
    width:34px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .sliderRow input[type=range]{
    flex:1; height:44px;
    -webkit-appearance:none; appearance:none;
    background:transparent;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:8px; border-radius:4px; background:#334155;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:30px; height:30px; margin-top:-11px;
    border-radius:50%; background:var(--accent); border:3px solid var(--bg-panel);
  }

  #actionRow{
    display:flex; gap:10px; justify-content:space-between;
  }
  .actionBtn{
    flex:1;
    background:#1e293b; color:var(--text); border:2px solid #334155;
    border-radius:14px; padding:8px 6px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:13px; font-weight:600;
    cursor:pointer;
  }
  .actionBtn.active{ background:var(--accent); color:#0f172a; border-color:var(--accent); }
  .actionBtn.freeze.active{ background:var(--danger); border-color:var(--danger); color:#fff; }
  .actionBtn:disabled{ opacity:.35; }
  .actionBtn svg{ width:26px; height:26px; }

  .actionBtn.freeze{
    flex:2;
    padding:12px 10px;
    font-size:16px;
    border-width:3px;
  }
  .actionBtn.freeze svg{ width:32px; height:32px; }

  .hidden{ display:none !important; }

  /* ---- Modal de ajustes ---- */
  #settingsModal{
    position:fixed; inset:0; z-index:40;
    background:rgba(0,0,0,.55);
    display:flex; align-items:flex-end;
  }
  #settingsSheet{
    width:100%;
    background:var(--bg-panel);
    border-radius:24px 24px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:18px;
  }
  #settingsHeader{
    display:flex; align-items:center; justify-content:space-between;
  }
  #settingsHeader h2{
    margin:0; font-size:20px;
  }
  #closeSettingsBtn{
    background:#334155; color:var(--text); border:none;
    width:36px; height:36px; border-radius:50%;
    font-size:18px; cursor:pointer;
  }
</style>
</head>
<body>
<div id="app">

  <div id="viewport">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="frozenCanvas"></canvas>
    <div id="zoomBadge">1.0×</div>

    <div id="startOverlay">
      <h1>🔍 Lupa Digital</h1>
      <p id="startText">Iniciando cámara…</p>
    </div>

    <div id="errorBox">
      <p id="errorText">No se ha podido acceder a la cámara.</p>
      <button class="bigBtn" id="retryBtn">Reintentar</button>
    </div>
  </div>

  <div id="controls" class="hidden">
    <div class="sliderRow">
      <label>➖</label>
      <input type="range" id="zoomSlider" min="1" max="6" step="0.1" value="1">
      <label>➕</label>
    </div>

    <div id="actionRow">
      <button class="actionBtn" id="settingsBtn" title="Ajustes de brillo y contraste">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        Ajustes
      </button>
      <button class="actionBtn freeze" id="freezeBtn" title="Congelar imagen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M12 2l-2.5 2M12 2l2.5 2M12 22l-2.5-2M12 22l2.5-2M3 7l18 10M3 7l3 .3M3 7l1 3M21 17l-3-.3M21 17l-1-3M21 7L3 17M21 7l-3 .3M21 7l-1 3M3 17l3-.3M3 17l1-3"/></svg>
        <span id="freezeLabel">Congelar</span>
      </button>
      <button class="actionBtn" id="contrastModeBtn" title="Alto contraste (blanco/negro)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18Z" fill="currentColor"/></svg>
        B/N
      </button>
    </div>
  </div>

  <div id="settingsModal" class="hidden">
    <div id="settingsSheet">
      <div id="settingsHeader">
        <h2>Ajustes de imagen</h2>
        <button id="closeSettingsBtn" aria-label="Cerrar">✕</button>
      </div>
      <div class="sliderRow">
        <label>☀️</label>
        <input type="range" id="brightSlider" min="0.6" max="2" step="0.05" value="1">
      </div>
      <div class="sliderRow">
        <label>◐</label>
        <input type="range" id="contrastSlider" min="0.6" max="2.5" step="0.05" value="1">
      </div>
      <button class="actionBtn" id="resetBtn" title="Restablecer" style="width:100%; flex-direction:row; gap:8px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
        Restablecer todo
      </button>
    </div>
  </div>

</div>

<script>
(function(){
  const video = document.getElementById('video');
  const canvas = document.getElementById('frozenCanvas');
  const ctx = canvas.getContext('2d');
  const startOverlay = document.getElementById('startOverlay');
  const errorBox = document.getElementById('errorBox');
  const errorText = document.getElementById('errorText');
  const retryBtn = document.getElementById('retryBtn');
  const controls = document.getElementById('controls');
  const zoomSlider = document.getElementById('zoomSlider');
  const brightSlider = document.getElementById('brightSlider');
  const contrastSlider = document.getElementById('contrastSlider');
  const zoomBadge = document.getElementById('zoomBadge');
  const freezeBtn = document.getElementById('freezeBtn');
  const freezeLabel = document.getElementById('freezeLabel');
  const contrastModeBtn = document.getElementById('contrastModeBtn');
  const resetBtn = document.getElementById('resetBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsModal = document.getElementById('settingsModal');
  const closeSettingsBtn = document.getElementById('closeSettingsBtn');
  const viewport = document.getElementById('viewport');

  let stream = null;
  let track = null;
  let frozen = false;
  let bwMode = false;

  function setVar(name, value){
    document.documentElement.style.setProperty(name, value);
  }

  async function startCamera(){
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } },
        audio:false
      });
      video.srcObject = stream;
      track = stream.getVideoTracks()[0];

      startOverlay.classList.add('hidden');
      errorBox.style.display = 'none';
      controls.classList.remove('hidden');
    }catch(err){
      startOverlay.classList.add('hidden');
      errorBox.style.display = 'flex';
      if(err.name === 'NotAllowedError'){
        errorText.textContent = 'Permiso de cámara denegado. Actívalo en los ajustes del navegador para usar la lupa.';
      }else if(err.name === 'NotFoundError'){
        errorText.textContent = 'No se ha encontrado ninguna cámara en este dispositivo.';
      }else{
        errorText.textContent = 'No se ha podido acceder a la cámara: ' + err.message;
      }
    }
  }

  retryBtn.addEventListener('click', startCamera);
  // Arranca la cámara automáticamente al abrir la app (solo pedirá
  // permiso la primera vez; las siguientes veces entra directo).
  startCamera();

  // Zoom
  zoomSlider.addEventListener('input', ()=>{
    const z = parseFloat(zoomSlider.value);
    setVar('--zoom', z);
    zoomBadge.textContent = z.toFixed(1) + '×';
  });

  // Pellizcar para zoom (pinch)
  let startDist = null, startZoom = 1;
  function dist(t){
    const dx = t[0].clientX - t[1].clientX;
    const dy = t[0].clientY - t[1].clientY;
    return Math.hypot(dx, dy);
  }
  viewport.addEventListener('touchstart', e=>{
    if(e.touches.length === 2){
      startDist = dist(e.touches);
      startZoom = parseFloat(zoomSlider.value);
    }
  }, {passive:true});
  viewport.addEventListener('touchmove', e=>{
    if(e.touches.length === 2 && startDist){
      const scale = dist(e.touches) / startDist;
      let z = Math.min(6, Math.max(1, startZoom * scale));
      zoomSlider.value = z.toFixed(1);
      setVar('--zoom', z);
      zoomBadge.textContent = z.toFixed(1) + '×';
    }
  }, {passive:true});
  viewport.addEventListener('touchend', ()=>{ startDist = null; });

  // Doble toque para enfocar (best effort)
  viewport.addEventListener('dblclick', async ()=>{
    if(!track) return;
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if(caps.focusMode && caps.focusMode.includes('single-shot')){
      try{ await track.applyConstraints({ advanced:[{ focusMode:'single-shot' }] }); }catch(e){}
    }
  });

  // Brillo / Contraste
  brightSlider.addEventListener('input', ()=> setVar('--bright', brightSlider.value));
  contrastSlider.addEventListener('input', ()=> setVar('--contrast', contrastSlider.value));

  // Congelar imagen
  freezeBtn.addEventListener('click', ()=>{
    frozen = !frozen;
    freezeBtn.classList.toggle('active', frozen);
    if(frozen){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      canvas.style.display = 'block';
      video.style.visibility = 'hidden';
      freezeLabel.textContent = 'Reanudar';
    }else{
      canvas.style.display = 'none';
      video.style.visibility = 'visible';
      freezeLabel.textContent = 'Congelar';
    }
  });

  // Modal de ajustes
  settingsBtn.addEventListener('click', ()=> settingsModal.classList.remove('hidden'));
  closeSettingsBtn.addEventListener('click', ()=> settingsModal.classList.add('hidden'));
  settingsModal.addEventListener('click', e=>{
    if(e.target === settingsModal) settingsModal.classList.add('hidden');
  });

  // Modo alto contraste blanco/negro
  contrastModeBtn.addEventListener('click', ()=>{
    bwMode = !bwMode;
    contrastModeBtn.classList.toggle('active', bwMode);
    setVar('--extra-filter', bwMode ? 'grayscale(1) contrast(1.6)' : '');
  });

  // Reset
  resetBtn.addEventListener('click', ()=>{
    zoomSlider.value = 1; brightSlider.value = 1; contrastSlider.value = 1;
    setVar('--zoom',1); setVar('--bright',1); setVar('--contrast',1); setVar('--extra-filter','');
    zoomBadge.textContent = '1.0×';
    if(bwMode){ bwMode=false; contrastModeBtn.classList.remove('active'); }
    if(frozen){ freezeBtn.click(); }
    settingsModal.classList.add('hidden');
  });

  // Registrar service worker (uso offline como PWA)
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
