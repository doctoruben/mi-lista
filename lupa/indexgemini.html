<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lupa Digital Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .camera-container {
            flex: 1;
            position: relative;
            width: 100%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        canvas {
            display: none;
            z-index: 2;
        }
        .controls {
            background: rgba(20, 20, 20, 0.95);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            border-top: 1px solid #333;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .slider-container label {
            min-width: 60px;
            font-size: 14px;
            font-weight: bold;
        }
        input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 4px;
            background: #444;
            outline: none;
        }
        .btn-container {
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #007bff;
            color: white;
            transition: background 0.2s;
        }
        button:active {
            background: #0056b3;
        }
        button.active {
            background: #dc3545;
        }
        #infoLog {
            font-size: 11px;
            color: #aaa;
            text-align: center;
            max-height: 40px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
        <div class="slider-container">
            <label id="zoomLabel">Zoom: 1x</label>
            <input type="range" id="zoomSlider" min="1" max="4" step="0.1" value="1">
        </div>

        <div class="btn-container">
            <button id="freezeBtn">Congelar Imagen</button>
            <button id="resetBtn" style="display: none; background: #6c757d;">Reanudar</button>
        </div>
        
        <div id="infoLog">Iniciando cámara...</div>
    </div>

    <script>
       const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const zoomSlider = document.getElementById('zoomSlider');
const zoomLabel = document.getElementById('zoomLabel');
const freezeBtn = document.getElementById('freezeBtn');
const resetBtn = document.getElementById('resetBtn');
const infoLog = document.getElementById('infoLog');

let videoTrack = null;
let hasHardwareZoom = false;
let isFrozen = false;

function log(msg) {
    infoLog.innerText = msg;
    console.log(msg);
}

// 1. Inicializar Cámara buscando la lente trasera CORRECTA (Evitando Ultra-Wide)
async function startCamera() {
    try {
        log("Buscando lentes traseras...");
        
        // Primero pedimos un permiso genérico rápido para poder listar los nombres reales de las cámaras
        const tempStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        tempStream.getTracks().forEach(track => track.stop()); // Apagamos la cámara temporal inmediatamente

        // Listamos todos los dispositivos de entrada multimedia
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');

        let targetDeviceId = null;

        // Filtramos las cámaras traseras
        // En muchos Android, la lente principal se llama "cámara trasera 0", "main", o simplemente "back" sin "wide"
        const backCameras = videoDevices.filter(d => {
            const label = d.label.toLowerCase();
            return label.includes('back') || label.includes('trasera') || label.includes('environment');
        });

        if (backCameras.length > 0) {
            // Intentamos descartar las que digan "wide", "ultra", "panoramica" o "macro" secundaria
            const mainCamera = backCameras.find(d => {
                const label = d.label.toLowerCase();
                return !label.includes('wide') && !label.includes('ultra') && !label.includes('0, facing back'); 
            });

            // Si encontramos la lente principal limpia, la usamos. Si no, cogemos la primera trasera de la lista.
            targetDeviceId = mainCamera ? mainCamera.deviceId : backCameras[0].deviceId;
            log(`Lente seleccionada: ${mainCamera ? mainCamera.label : backCameras[0].label}`);
        }

        // Configuración de arranque estricta con el dispositivo elegido
        const constraints = {
            audio: false,
            video: {
                deviceId: targetDeviceId ? { exact: targetDeviceId } : undefined,
                facingMode: targetDeviceId ? undefined : { ideal: "environment" },
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            }
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        
        // Esperamos un segundo a que el hardware de la lente se estabilice para aplicar los enfoques
        setTimeout(applyHardwareCapabilities, 1000);

    } catch (err) {
        log("Error al acceder a la cámara: " + err.message);
        // Si falla el filtro estricto por ID, intentamos un último método de emergencia genérico
        fallbackGenericCamera();
    }
}

// Último recurso por si el filtrado por ID falla en algún navegador antiguo
async function fallbackGenericCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
        });
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        setTimeout(applyHardwareCapabilities, 1000);
    } catch(e) {
        log("Fallo absoluto al abrir cualquier cámara: " + e.message);
    }
}

async function applyHardwareCapabilities() {
    if (!videoTrack || typeof videoTrack.getCapabilities !== 'function') {
        log("El navegador no lee capacidades. Usando software.");
        return;
    }

    const caps = videoTrack.getCapabilities();
    const constraints = { advanced: [] };
    const advancedConstraints = {};

    // Forzar Enfoque Continuo (Crucial para que enfoque de cerca al mover el móvil)
    if (caps.focusMode && caps.focusMode.includes('continuous')) {
        advancedConstraints.focusMode = 'continuous';
        log("Enfoque continuo activo.");
    }

    // Comprobar Soporte de Zoom Nativo
    if (caps.zoom) {
        hasHardwareZoom = true;
        zoomSlider.min = caps.zoom.min || 1;
        zoomSlider.max = caps.zoom.max || 4;
        zoomSlider.step = caps.zoom.step || 0.1;
    } else {
        hasHardwareZoom = false;
    }

    if (Object.keys(advancedConstraints).length > 0) {
        try {
            constraints.advanced.push(advancedConstraints);
            await videoTrack.applyConstraints(constraints);
        } catch (e) {
            console.error("Error aplicando focusMode:", e);
        }
    }
}

// 2. Controlar cambios en el Slider de Zoom
zoomSlider.addEventListener('input', async (e) => {
    const value = parseFloat(e.target.value);
    zoomLabel.innerText = `Zoom: ${value.toFixed(1)}x`;

    if (hasHardwareZoom && videoTrack) {
        try {
            await videoTrack.applyConstraints({
                advanced: [{ zoom: value }]
            });
        } catch (err) {
            console.error("Error aplicando zoom de hardware:", err);
        }
    } else {
        video.style.transform = `scale(${value})`;
    }
});

// 3. Función de Congelar Imagen Corregida
freezeBtn.addEventListener('click', () => {
    if (isFrozen) return;

    const ctx = canvas.getContext('2d');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const currentZoom = parseFloat(zoomSlider.value);

    if (hasHardwareZoom) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    } else {
        const sw = video.videoWidth / currentZoom;
        const sh = video.videoHeight / currentZoom;
        const sx = (video.videoWidth - sw) / 2;
        const sy = (video.videoHeight - sh) / 2;

        video.style.transform = "scale(1)"; 

        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    }

    canvas.style.display = 'block';
    video.style.display = 'none';
    freezeBtn.style.display = 'none';
    resetBtn.style.display = 'inline-block';
    isFrozen = true;
});

// 4. Reanudar el flujo de vídeo
resetBtn.addEventListener('click', () => {
    canvas.style.display = 'none';
    video.style.display = 'block';
    freezeBtn.style.display = 'inline-block';
    resetBtn.style.display = 'none';
    isFrozen = false;

    if (!hasHardwareZoom) {
        video.style.transform = `scale(${zoomSlider.value})`;
    }
});

window.addEventListener('DOMContentLoaded', startCamera);
    </script>
</body>
</html>
