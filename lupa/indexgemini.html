<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lupa Digital Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .camera-container {
            flex: 1;
            position: relative;
            width: 100%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        canvas {
            display: none;
            z-index: 2;
        }
        .controls {
            background: rgba(20, 20, 20, 0.95);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            border-top: 1px solid #333;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .slider-container label {
            min-width: 60px;
            font-size: 14px;
            font-weight: bold;
        }
        input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 4px;
            background: #444;
            outline: none;
        }
        .btn-container {
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #007bff;
            color: white;
            transition: background 0.2s;
        }
        button:active {
            background: #0056b3;
        }
        button.active {
            background: #dc3545;
        }
        #infoLog {
            font-size: 11px;
            color: #aaa;
            text-align: center;
            max-height: 40px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
        <div class="slider-container">
            <label id="zoomLabel">Zoom: 1x</label>
            <input type="range" id="zoomSlider" min="1" max="4" step="0.1" value="1">
        </div>

        <div class="btn-container">
            <button id="freezeBtn">Congelar Imagen</button>
            <button id="resetBtn" style="display: none; background: #6c757d;">Reanudar</button>
        </div>
        
        <div id="infoLog">Iniciando cámara...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const zoomSlider = document.getElementById('zoomSlider');
        const zoomLabel = document.getElementById('zoomLabel');
        const freezeBtn = document.getElementById('freezeBtn');
        const resetBtn = document.getElementById('resetBtn');
        const infoLog = document.getElementById('infoLog');

        let videoTrack = null;
        let hasHardwareZoom = false;
        let isFrozen = false;

        function log(msg) {
            infoLog.innerText = msg;
            console.log(msg);
        }

        // 1. Inicializar Cámara y aplicar configuraciones de Hardware
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                });

                video.srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];
                
                // Esperar a que el track esté activo para leer capacidades
                videoTrack.onended = () => log("Cámara desconectada");
                
                setTimeout(applyHardwareCapabilities, 1000);

            } catch (err) {
                log("Error al acceder a la cámara: " + err.message);
            }
        }

        async function applyHardwareCapabilities() {
            if (!videoTrack || typeof videoTrack.getCapabilities !== 'function') {
                log("El navegador no soporta lectura de capacidades de hardware.");
                return;
            }

            const caps = videoTrack.getCapabilities();
            const constraints = { advanced: [] };
            const advancedConstraints = {};

            // Forzar Enfoque Continuo por Hardware
            if (caps.focusMode && caps.focusMode.includes('continuous')) {
                advancedConstraints.focusMode = 'continuous';
                log("Enfoque continuo activado por hardware.");
            } else {
                log("Enfoque continuo no soportado. Usando modo automático del sistema.");
            }

            // Comprobar Soporte de Zoom Nativo
            if (caps.zoom) {
                hasHardwareZoom = true;
                zoomSlider.min = caps.zoom.min || 1;
                zoomSlider.max = caps.zoom.max || 4;
                zoomSlider.step = caps.zoom.step || 0.1;
                log(`Zoom nativo detectado (Rango: ${zoomSlider.min}x - ${zoomSlider.max}x)`);
            } else {
                hasHardwareZoom = false;
                log("Zoom nativo no soportado. Se usará zoom digital por software.");
            }

            // Aplicar las restricciones iniciales al track
            if (Object.keys(advancedConstraints).length > 0) {
                try {
                    constraints.advanced.push(advancedConstraints);
                    await videoTrack.applyConstraints(constraints);
                } catch (e) {
                    console.error("Error aplicando constraints iniciales:", e);
                }
            }
        }

        // 2. Controlar cambios en el Slider de Zoom
        zoomSlider.addEventListener('input', async (e) => {
            const value = parseFloat(e.target.value);
            zoomLabel.innerText = `Zoom: ${value.toFixed(1)}x`;

            if (hasHardwareZoom && videoTrack) {
                try {
                    await videoTrack.applyConstraints({
                        advanced: [{ zoom: value }]
                    });
                } catch (err) {
                    console.error("Error aplicando zoom de hardware:", err);
                }
            } else {
                // Fallback por CSS para la vista previa si el móvil no tiene zoom nativo
                video.style.transform = `scale(${value})`;
            }
        });

        // 3. Función de Congelar Imagen Corregida (Dibuja la región exacta)
        freezeBtn.addEventListener('click', () => {
            if (isFrozen) return;

            const ctx = canvas.getContext('2d');
            
            // Forzamos al canvas a tener la resolución real del flujo de vídeo
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            const currentZoom = parseFloat(zoomSlider.value);

            if (hasHardwareZoom) {
                // Si hay zoom por hardware, el elemento <video> ya está recibiendo la imagen ampliada.
                // Capturamos el lienzo completo.
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            } else {
                // Fallback matemático: Si hacíamos zoom por CSS, calculamos el recorte central exacto
                const sw = video.videoWidth / currentZoom;
                const sh = video.videoHeight / currentZoom;
                const sx = (video.videoWidth - sw) / 2;
                const sy = (video.videoHeight - sh) / 2;

                // Limpiamos transformaciones previas en el canvas si las hubiera
                video.style.transform = "scale(1)"; 

                ctx.drawImage(
                    video,
                    sx, sy, sw, sh,        // Origen: Recorte proporcional del centro del vídeo
                    0, 0, canvas.width, canvas.height // Destino: Estirado perfecto en el lienzo
                );
            }

            // Cambiar estados visuales
            canvas.style.display = 'block';
            video.style.display = 'none';
            freezeBtn.style.display = 'none';
            resetBtn.style.display = 'inline-block';
            isFrozen = true;
        });

        // 4. Reanudar el flujo de vídeo
        resetBtn.addEventListener('click', () => {
            canvas.style.display = 'none';
            video.style.display = 'block';
            freezeBtn.style.display = 'inline-block';
            resetBtn.style.display = 'none';
            isFrozen = false;

            // Si estábamos usando el fallback por software, restauramos el comportamiento visual en el vídeo
            if (!hasHardwareZoom) {
                video.style.transform = `scale(${zoomSlider.value})`;
            }
        });

        // Iniciar al cargar la página
        window.addEventListener('DOMContentLoaded', startCamera);
    </script>
</body>
</html>
