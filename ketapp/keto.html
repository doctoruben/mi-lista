<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keto AI Tracker Pro</title>
    <style>
        :root { --keto: #27ae60; --dark: #1a1a1a; --danger: #e74c3c; --calories: #f39c12; --gray: #f4f4f9; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--gray); display: flex; justify-content: center; padding: 20px; margin: 0; }
        
        .container { background: white; padding: 25px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 100%; max-width: 400px; position: relative; }
        
        /* Botón de Configuración (Engranaje) */
        .settings-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 1.4rem; cursor: pointer; z-index: 10; padding: 5px; transition: transform 0.3s; }
        .settings-btn:hover { transform: rotate(45deg); }

        .dashboard { background: var(--dark); color: white; padding: 20px; border-radius: 18px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .stat-box { background: rgba(255,255,255,0.08); padding: 10px; border-radius: 12px; }
        
        .progress-bar { background: #333; border-radius: 10px; height: 10px; margin: 10px 0; overflow: hidden; }
        #barFill { background: var(--keto); height: 100%; width: 0%; transition: 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        textarea { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 14px; box-sizing: border-box; font-size: 1rem; resize: none; outline: none; transition: border 0.3s; }
        textarea:focus { border-color: var(--keto); }
        
        .btn-ia { background: var(--dark); color: white; border: none; padding: 15px; width: 100%; border-radius: 14px; cursor: pointer; margin-top: 10px; font-weight: bold; font-size: 1rem; }
        
        .result-card { display: none; margin-top: 20px; padding: 15px; border-radius: 14px; background: #f0fff4; border: 1px solid #c6f6d5; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .btn-add { background: var(--keto); color: white; border: none; padding: 12px; width: 100%; border-radius: 12px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        
        .food-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        #status { font-size: 0.75rem; color: #999; text-align: center; margin-top: 12px; min-height: 1.2rem; }

        /* Estilos del Modal de Configuración */
        #settingsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; position: relative; }
        .modal-title { margin-top: 0; font-size: 1.2rem; margin-bottom: 15px; }
        .modal-btn { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <button class="settings-btn" onclick="toggleModal()">⚙️</button>

    <div class="dashboard">
        <h2 style="margin:0">Día Keto</h2>
        <div class="progress-bar"><div id="barFill"></div></div>
        <div class="stats-grid">
            <div class="stat-box"><small>Carbs Netos</small><div><b id="totalCarbs">0</b> / 30g</div></div>
            <div class="stat-box"><small>Calorías</small><div><b id="totalKcal">0</b> kcal</div></div>
        </div>
    </div>

    <textarea id="foodInput" rows="3" placeholder="Ej: 2 huevos fritos y 100g de tocino..."></textarea>
    <button class="btn-ia" onclick="askGemini()">Analizar Nutrición ✨</button>
    <div id="status">Esperando entrada...</div>

    <div id="resultCard" class="result-card">
        <h4 id="resName" style="margin:0; color:var(--dark)"></h4>
        <div style="margin:10px 0; display:grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.85rem;">
            <span>Carbs: <b id="resCarbs"></b>g</span>
            <span>Kcal: <b id="resKcal"></b></span>
            <span>Grasas: <b id="resFat"></b>g</span>
            <span>Prot: <b id="resProt"></b>g</span>
        </div>
        <button class="btn-add" onclick="addFood()">Confirmar y Añadir</button>
    </div>

    <div id="dailyList" style="margin-top:20px;"></div>
</div>

<div id="settingsModal">
    <div class="modal-content">
        <h3 class="modal-title">Configuración</h3>
        <button class="modal-btn" style="background: var(--dark); color: white;" onclick="setNewKey()">🔑 Cambiar API Key</button>
        <button class="modal-btn" style="background: #eee;" onclick="reiniciarDia()">🔄 Reiniciar Día</button>
        <button class="modal-btn" style="background: var(--danger); color: white; margin-top: 15px;" onclick="resetTodo()">🗑️ Borrar todo</button>
        <button class="modal-btn" style="background: none; text-decoration: underline;" onclick="toggleModal()">Cerrar</button>
    </div>
</div>

<script>
    const MODELS = ["models/gemini-2.5-flash", "models/gemini-1.5-flash", "models/gemini-1.5-pro"]; 
    const LIMIT_CARBS = 30;
    let dailyCarbs = 0;
    let dailyKcal = 0;
    let lastFoundFood = null;

    window.onload = () => {
        if (!localStorage.getItem('KETO_KEY_FINAL')) setNewKey();
        loadDailyData();
    };

    function toggleModal() {
        const modal = document.getElementById('settingsModal');
        modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
    }

    function setNewKey() {
        const key = prompt("Introduce tu API Key de Gemini:");
        if (key && key.trim().length > 10) {
            localStorage.setItem('KETO_KEY_FINAL', key.trim());
            alert("API Key actualizada.");
            if(document.getElementById('settingsModal').style.display === 'flex') toggleModal();
        }
    }

    async function askGemini() {
        const apiKey = localStorage.getItem('KETO_KEY_FINAL');
        const text = document.getElementById('foodInput').value.trim();
        const status = document.getElementById('status');
        
        if (!apiKey) { setNewKey(); return; }
        if (!text) return;

        document.getElementById('resultCard').style.display = 'none';

        for (let modelPath of MODELS) {
            status.innerText = `Consultando ${modelPath.split('/')[1]}...`;
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/${modelPath}:generateContent?key=${apiKey}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Analiza nutricionalmente: "${text}". Responde solo JSON: {"nombre": "...", "carbs": 0, "kcal": 0, "grasa": 0, "proteina": 0}` }] }]
                    })
                });

                const data = await response.json();
                if (data.error) continue; 

                const rawText = data.candidates[0].content.parts[0].text;
                const res = JSON.parse(rawText.match(/\{.*\}/s)[0]);

                lastFoundFood = { ...res };
                document.getElementById('resName').innerText = res.nombre;
                document.getElementById('resCarbs').innerText = res.carbs;
                document.getElementById('resKcal').innerText = res.kcal;
                document.getElementById('resFat').innerText = res.grasa;
                document.getElementById('resProt').innerText = res.proteina;
                document.getElementById('resultCard').style.display = 'block';
                status.innerText = "¡Listo!";
                return;
            } catch (e) { console.error(e); }
        }
        status.innerText = "Error de conexión o modelos saturados.";
    }

    function addFood() {
        if (!lastFoundFood) return;
        const history = JSON.parse(localStorage.getItem('keto_history_v3') || "[]");
        history.push(lastFoundFood);
        localStorage.setItem('keto_history_v3', JSON.stringify(history));
        loadDailyData();
        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('foodInput').value = '';
        lastFoundFood = null;
    }

    function renderItem(item) {
        const div = document.createElement('div');
        div.className = 'food-item';
        div.innerHTML = `
            <div class="food-info">
                <span><b>${item.nombre}</b></span>
                <span style="font-size:0.75rem; color:#888">G: ${item.grasa}g | P: ${item.proteina}g</span>
            </div>
            <div style="text-align:right">
                <b>${item.kcal} kcal</b><br>
                <small style="color:var(--keto)">${item.carbs}g carbs</small>
            </div>
        `;
        document.getElementById('dailyList').prepend(div);
        dailyCarbs += parseFloat(item.carbs);
        dailyKcal += parseFloat(item.kcal);
    }

    function loadDailyData() {
        const history = JSON.parse(localStorage.getItem('keto_history_v3') || "[]");
        dailyCarbs = 0; dailyKcal = 0;
        document.getElementById('dailyList').innerHTML = '';
        history.forEach(renderItem);
        updateProgress();
    }

    function updateProgress() {
        const percent = Math.min((dailyCarbs / LIMIT_CARBS) * 100, 100);
        document.getElementById('barFill').style.width = percent + '%';
        document.getElementById('totalCarbs').innerText = dailyCarbs.toFixed(1);
        document.getElementById('totalKcal').innerText = Math.round(dailyKcal);
        document.getElementById('barFill').style.background = dailyCarbs > LIMIT_CARBS ? 'var(--danger)' : 'var(--keto)';
    }

    function reiniciarDia() {
        if (confirm("¿Borrar comidas de hoy?")) {
            localStorage.removeItem('keto_history_v3');
            loadDailyData();
            toggleModal();
        }
    }

    function resetTodo() {
        if (confirm("¿BORRAR TODO? (API Key y comidas)")) {
            localStorage.clear();
            location.reload();
        }
    }
</script>

</body>
</html>
