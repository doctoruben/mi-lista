<!DOCTYPE html>
<html lang="es">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keto Pro - Multiusuario</title>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root { --keto: #27ae60; --dark: #1a1a1a; --gray: #f4f4f9; }
  body { font-family: sans-serif; background: var(--gray); margin: 0; display: flex; justify-content: center; }
  #loginModal { position: fixed; inset: 0; background: var(--dark); z-index: 10000; display: flex; align-items: center; justify-content: center; }
  .login-card { background: white; width: 90%; max-width: 320px; padding: 30px; border-radius: 24px; text-align: center; }
  .user-badge { background: #eee; padding: 15px; margin-bottom: 10px; border-radius: 12px; cursor: pointer; font-weight: bold; }
  .pin-dots { font-size: 2rem; color: var(--keto); margin: 15px 0; height: 30px; }
  .grid-pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .btn-n { padding: 15px; border: none; border-radius: 10px; background: #f0f0f0; font-size: 1.2rem; cursor: pointer; }
</style>
</head>
<body>

<div id="loginModal">
    <div class="login-card">
        <h2 id="titleL">Acceso Keto</h2>
        <div id="listaU">Cargando perfiles...</div>
        
        <div id="pinArea" style="display:none;">
            <div class="pin-dots" id="dots"></div>
            <div class="grid-pin">
                <button class="btn-n" onclick="inP('1')">1</button>
                <button class="btn-n" onclick="inP('2')">2</button>
                <button class="btn-n" onclick="inP('3')">3</button>
                <button class="btn-n" onclick="inP('4')">4</button>
                <button class="btn-n" onclick="inP('5')">5</button>
                <button class="btn-n" onclick="inP('6')">6</button>
                <button class="btn-n" onclick="inP('7')">7</button>
                <button class="btn-n" onclick="inP('8')">8</button>
                <button class="btn-n" onclick="inP('9')">9</button>
                <button class="btn-n" onclick="clrP()" style="color:red">C</button>
                <button class="btn-n" onclick="inP('0')">0</button>
                <button class="btn-n" onclick="valP()" style="color:green">OK</button>
            </div>
        </div>
    </div>
</div>

<div id="mainApp" style="display:none; padding:20px; width:100%; max-width:400px;">
    <h1>Keto Pro</h1>
    <p>Bienvenido, <span id="uName" style="color:var(--keto)"></span></p>
    <button onclick="logout()" style="padding:10px; background:#e74c3c; color:white; border:none; border-radius:8px;">Cerrar Sesión</button>
    <hr>
    <div id="statusData">Cargando tus datos...</div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCH9H-O7N7v7u9V9E7W-Y7m8y8E-Y7m8y8",
    authDomain: "doctoruben-65365.firebaseapp.com",
    databaseURL: "https://doctoruben-65365-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "doctoruben-65365",
    storageBucket: "doctoruben-65365.appspot.com",
    messagingSenderId: "305101234567",
    appId: "1:305101234567:web:a1b2c3d4e5f6g7h8i9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentUser = localStorage.getItem('keto_user_id');
let userList = {};
let selectedId = "";
let pinIngresado = "";

window.onload = () => {
    if (currentUser) {
        initApp();
    } else {
        loadUsers();
    }
};

async function loadUsers() {
    try {
        const snap = await db.ref('config/usuarios_lista').once('value');
        userList = snap.val() || {};
        const container = document.getElementById('listaU');
        container.innerHTML = "";
        
        if (Object.keys(userList).length === 0) {
            container.innerHTML = "No hay usuarios. Usa el migrador.";
            return;
        }

        Object.keys(userList).forEach(id => {
            const btn = document.createElement('div');
            btn.className = 'user-badge';
            btn.innerText = userList[id].nombre;
            btn.onclick = () => {
                selectedId = id;
                document.getElementById('listaU').style.display = 'none';
                document.getElementById('pinArea').style.display = 'block';
                document.getElementById('titleL').innerText = "Introduce PIN";
            };
            container.appendChild(btn);
        });
    } catch (e) {
        document.getElementById('listaU').innerText = "Error de permisos: Revisa las Reglas de Firebase.";
    }
}

function inP(n) {
    if (pinIngresado.length < 4) {
        pinIngresado += n;
        document.getElementById('dots').innerText = "•".repeat(pinIngresado.length);
    }
}

function clrP() {
    pinIngresado = "";
    document.getElementById('dots').innerText = "";
}

function valP() {
    if (pinIngresado === userList[selectedId].pin) {
        currentUser = selectedId;
        localStorage.setItem('keto_user_id', currentUser);
        initApp();
    } else {
        alert("PIN Incorrecto");
        clrP();
    }
}

function initApp() {
    document.getElementById('loginModal').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    
    // Aquí es donde todas tus funciones antiguas deben llamar a la nueva ruta:
    // Ejemplo: db.ref('usuarios/' + currentUser + '/logs')
    document.getElementById('uName').innerText = currentUser;
    document.getElementById('statusData').innerText = "Accediendo a los datos de: " + currentUser;
    
    // Cargar tus gráficas y datos aquí...
}

function logout() {
    localStorage.removeItem('keto_user_id');
    location.reload();
}
</script>
</body>
</html>
