<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keto Tracker Pro v2</title>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
<!-- Chart.js para las gráficas -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c24;
    --surface2: #1e2330;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.12);
    --red: #ef4444;
    --red-dim: rgba(239,68,68,0.12);
    --text: #f1f5f9;
    --muted: #64748b;
    --accent: #3b82f6;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  .app { width: 100%; max-width: 390px; }

  /* HEADER */
  .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 0 20px; }
  .header-title { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0.03em; text-transform: uppercase; }
  .icon-btn {
    width: 38px; height: 38px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    transition: border-color 0.15s, color 0.15s;
    text-decoration: none;
    font-size: 16px;
  }
  .icon-btn:hover { border-color: var(--border2); color: var(--text); }

  /* DASHBOARD */
  .dashboard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .dash-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .stat-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .stat-value { font-size: 24px; font-weight: 600; color: var(--text); line-height: 1; }
  .stat-value span { font-size: 13px; font-weight: 400; color: var(--muted); }
  .progress-track { background: rgba(255,255,255,0.06); border-radius: 6px; height: 6px; overflow: hidden; }
  #barFill { height: 100%; border-radius: 6px; background: var(--green); width: 0%; transition: width 0.6s ease; }
  .progress-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--muted); }

  /* ACTION BUTTONS */
  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .btn-secondary {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }

  /* INPUT AREA */
  textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; color: var(--text); font-size: 14px; font-family: inherit; resize: none; outline: none;
  }
  .btn-analyze {
    width: 100%; margin-top: 10px; padding: 14px; background: var(--accent); color: white; border: none;
    border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }

  /* RESULT CARD */
  .result-card { display: none; background: var(--green-dim); border: 1px solid rgba(34,197,94,0.2); border-radius: var(--radius); padding: 16px; margin-top: 12px; }
  .result-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .result-macros { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .btn-group { display: flex; gap: 8px; }
  .btn-add { flex: 2; background: var(--green); color: #0a1a0f; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; }
  .btn-cancel { flex: 1; background: var(--surface2); color: var(--text); border: 1px solid var(--border); padding: 12px; border-radius: 10px; cursor: pointer; }

  /* LOG */
  .log-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .log-data { font-size: 14px; }
  .log-sub { font-size: 12px; color: var(--muted); }

  /* MODALS */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
  .modal.open { display: flex; }
  .modal-box { background: var(--surface); border: 1px solid var(--border2); border-radius: 20px; padding: 20px; width: 100%; max-width: 390px; max-height: 90vh; overflow-y: auto; }

  /* CALENDAR */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 15px; }
  .cal-day {
    aspect-ratio: 0.8; background: var(--surface2); border-radius: 8px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 11px; cursor: pointer; border: 1px solid transparent;
  }
  .cal-day.today { border-color: var(--accent); }
  .cal-status { font-size: 10px; font-weight: bold; margin: 2px 0; }
  .cal-info { font-size: 8px; color: var(--muted); text-align: center; }

  .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <button class="icon-btn" onclick="openModal('histModal')">📅</button>
    <span class="header-title" id="displayDate"></span>
    <button class="icon-btn" onclick="openModal('cfgModal')">⚙️</button>
  </div>

  <div class="dashboard">
    <div class="dash-stats">
      <div class="stat-card">
        <div class="stat-label">Netas (In - Out)</div>
        <div class="stat-value" id="totalNetKcal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Carbos</div>
        <div class="stat-value"><span id="totalCarbs">0</span><span>/30g</span></div>
      </div>
    </div>
    <div class="progress-track"><div id="barFill"></div></div>
    <div class="progress-labels"><span>Hoy</span><span id="totalConsumidas">0 kcal consumidas</span></div>
  </div>

  <div class="action-grid">
    <button class="btn-secondary" onclick="registrarPeso()">⚖️ Peso</button>
    <button class="btn-secondary" onclick="registrarEjercicio()">🔥 Ejercicio</button>
  </div>

  <textarea id="foodInput" rows="2" placeholder="¿Qué has comido?"></textarea>
  <button class="btn-analyze" id="btnAnalyze" onclick="analizarIA()">
    <span id="btnContent">Analizar ✨</span>
  </button>
  <div id="status" style="text-align:center; font-size:12px; color:var(--muted); margin-top:8px;"></div>

  <div id="resultCard" class="result-card">
    <div class="result-name" id="resName"></div>
    <div class="result-macros" id="resNutri"></div>
    <div class="btn-group">
      <button class="btn-add" onclick="guardar()">Añadir</button>
      <button class="btn-cancel" onclick="cancelarAnalisis()">Cancelar</button>
    </div>
  </div>

  <div style="margin-top:20px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <span class="header-title">Registros de hoy</span>
      <button class="btn-secondary" style="padding:4px 8px; font-size:11px;" onclick="openModal('chartModal')">📈 Gráficas</button>
    </div>
    <div id="dailyList"></div>
  </div>
</div>

<!-- MODAL HISTORIAL -->
<div id="histModal" class="modal" onclick="closeModal('histModal')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <button onclick="cambiarMes(-1)" class="icon-btn">‹</button>
      <b id="calTitle"></b>
      <button onclick="cambiarMes(1)" class="icon-btn">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <button class="btn-analyze" style="background:var(--surface2); margin-top:20px;" onclick="closeModal('histModal')">Cerrar</button>
  </div>
</div>

<!-- MODAL DETALLE DÍA -->
<div id="dayDetailModal" class="modal" onclick="closeModal('dayDetailModal')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3 id="detailDateTitle" style="margin-bottom:15px;"></h3>
    <div id="dayDetailContent"></div>
    <button class="btn-analyze" style="margin-top:20px;" onclick="closeModal('dayDetailModal')">Cerrar</button>
  </div>
</div>

<!-- MODAL GRÁFICAS -->
<div id="chartModal" class="modal" onclick="closeModal('chartModal')">
  <div class="modal-box" onclick="event.stopPropagation()" style="max-width:500px;">
    <h3 style="margin-bottom:15px;">Evolución Mensual</h3>
    <canvas id="weightChart" style="margin-bottom:20px;"></canvas>
    <canvas id="carbChart"></canvas>
    <button class="btn-analyze" style="margin-top:20px;" onclick="closeModal('chartModal')">Cerrar</button>
  </div>
</div>

<!-- MODAL CONFIG -->
<div id="cfgModal" class="modal" onclick="closeModal('cfgModal')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3>Ajustes</h3>
    <button class="btn-analyze" onclick="cambiarKey()" style="margin-top:15px;">🔑 Configurar API Key</button>
    <button class="btn-analyze" style="background:none; border:1px solid var(--border); margin-top:10px;" onclick="closeModal('cfgModal')">Cerrar</button>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBnmTgJYFsFAFWnGyaDZRUxOZGnL5SE1QA",
    authDomain: "lista-compra-9d6f5.firebaseapp.com",
    databaseURL: "https://lista-compra-9d6f5-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "lista-compra-9d6f5",
    storageBucket: "lista-compra-9d6f5.firebasestorage.app",
    messagingSenderId: "241322134457",
    appId: "1:241322134457:web:1b765857911f94d69cc468"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  
  let calView = new Date();
  let tempFood = null;
  const getHoyISO = () => new Date().toISOString().split('T')[0];

  window.onload = () => {
    document.getElementById('displayDate').innerText = new Date().toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'short' });
    escucharFirebase();
  };

  function openModal(id) { 
    document.getElementById(id).classList.add('open'); 
    if(id === 'histModal') generarCalendario();
    if(id === 'chartModal') cargarGraficas();
  }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  function cambiarMes(d) { calView.setMonth(calView.getMonth() + d); generarCalendario(); }

  function cambiarKey() {
    const k = prompt("Pega tu API Key de Gemini:");
    if(k) localStorage.setItem('GEMINI_KEY', k.trim());
  }

  async function analizarIA() {
    const key = localStorage.getItem('GEMINI_KEY');
    const text = document.getElementById('foodInput').value.trim();
    if(!key || !text) return;

    const btn = document.getElementById('btnAnalyze');
    const btnContent = document.getElementById('btnContent');
    btn.disabled = true;
    btnContent.innerHTML = '<div class="spinner"></div>';

    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: `Analiza: "${text}". Devuelve SOLO JSON: {"n": "nombre", "c": carbs_num, "k": kcal_num}` }] }] })
      });
      const data = await res.json();
      let txt = data.candidates[0].content.parts[0].text.replace(/```json/g, "").replace(/```/g, "").trim();
      tempFood = JSON.parse(txt);
      
      document.getElementById('resName').innerText = tempFood.n;
      document.getElementById('resNutri').innerText = `${tempFood.c}g carbs · ${tempFood.k} kcal`;
      document.getElementById('resultCard').style.display = 'block';
    } catch (e) { alert("Error en la IA"); }
    btn.disabled = false;
    btnContent.innerHTML = 'Analizar ✨';
  }

  function cancelarAnalisis() {
    document.getElementById('resultCard').style.display = 'none';
    tempFood = null;
    document.getElementById('foodInput').value = "";
  }

  function guardar() {
    if(tempFood) {
      db.ref(`keto_logs/${getHoyISO()}/comidas`).push(tempFood);
      cancelarAnalisis();
    }
  }

  function registrarPeso() {
    const p = prompt("Peso de hoy (kg):");
    if(p && !isNaN(p)) db.ref(`keto_logs/${getHoyISO()}/peso`).set(parseFloat(p));
  }

  function registrarEjercicio() {
    const k = prompt("Calorías quemadas:");
    if(k && !isNaN(k)) db.ref(`keto_logs/${getHoyISO()}/ejercicio`).push({ k: parseInt(k), t: new Date().toLocaleTimeString() });
  }

  function escucharFirebase() {
    db.ref(`keto_logs/${getHoyISO()}`).on('value', snap => {
      const data = snap.val() || {};
      const list = document.getElementById('dailyList');
      list.innerHTML = "";
      
      let tc = 0, tkCons = 0, tkEjer = 0;
      
      if(data.comidas) {
        Object.keys(data.comidas).reverse().forEach(id => {
          const item = data.comidas[id];
          tc += parseFloat(item.c); tkCons += parseInt(item.k);
          list.innerHTML += `<div class="log-item">
            <div><div class="log-data">${item.n}</div><div class="log-sub">${item.c}g carbs · ${item.k} kcal</div></div>
            <button class="btn-cancel" style="padding:5px 10px;" onclick="db.ref('keto_logs/${getHoyISO()}/comidas/${id}').remove()">✕</button>
          </div>`;
        });
      }

      if(data.ejercicio) {
        Object.values(data.ejercicio).forEach(e => tkEjer += parseInt(e.k));
      }

      const neto = tkCons - tkEjer;
      document.getElementById('totalCarbs').innerText = tc.toFixed(1);
      document.getElementById('totalNetKcal').innerText = neto;
      document.getElementById('totalConsumidas').innerText = `${tkCons} kcal consumidas / -${tkEjer} quemadas`;
      
      const p = Math.min((tc / 30) * 100, 100);
      document.getElementById('barFill').style.width = p + '%';
      document.getElementById('barFill').style.background = tc > 30 ? 'var(--red)' : 'var(--green)';
    });
  }

  async function generarCalendario() {
    const grid = document.getElementById('calGrid');
    const title = document.getElementById('calTitle');
    const y = calView.getFullYear(), m = calView.getMonth();
    title.innerText = new Intl.DateTimeFormat('es-ES', { month:'long', year:'numeric' }).format(calView);
    
    const snap = await db.ref('keto_logs').once('value');
    const all = snap.val() || {};
    
    grid.innerHTML = "LMaMiJuViSaDo".split(/(?=[A-Z])/).map(d => `<div style="font-size:10px; color:var(--muted); text-align:center;">${d}</div>`).join('');
    
    const first = new Date(y, m, 1).getDay();
    const offset = (first === 0) ? 6 : first - 1;
    for(let i=0; i<offset; i++) grid.innerHTML += '<div></div>';

    const days = new Date(y, m+1, 0).getDate();
    for(let d=1; d<=days; d++) {
      const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      let status = '', info = '', cls = (ds === getHoyISO()) ? 'today' : '';
      
      if(all[ds]) {
        let tc = 0, tkc = 0, tke = 0;
        if(all[ds].comidas) Object.values(all[ds].comidas).forEach(c => { tc += parseFloat(c.c); tkc += parseInt(c.k); });
        if(all[ds].ejercicio) Object.values(all[ds].ejercicio).forEach(e => tke += parseInt(e.k));
        
        status = tc > 30 ? '<span style="color:var(--red)">X</span>' : '<span style="color:var(--green)">V</span>';
        info = `<div class="cal-info">${tkc-tke} kcal<br>${all[ds].peso || '--'}kg</div>`;
      }
      grid.innerHTML += `<div class="cal-day ${cls}" onclick="verDetalleDia('${ds}')"><b>${d}</b>${status}${info}</div>`;
    }
  }

  async function verDetalleDia(fecha) {
    const snap = await db.ref(`keto_logs/${fecha}`).once('value');
    const data = snap.val();
    if(!data) return;

    document.getElementById('detailDateTitle').innerText = fecha;
    let html = `<b>Peso:</b> ${data.peso || '--'} kg<br><hr style="margin:10px 0; opacity:0.1;">`;
    
    if(data.comidas) {
      html += `<b>Comidas:</b><br>`;
      Object.values(data.comidas).forEach(c => html += `• ${c.n} (${c.c}g C / ${c.k} Kcal)<br>`);
    }
    
    if(data.ejercicio) {
      html += `<br><b>Ejercicio:</b><br>`;
      Object.values(data.ejercicio).forEach(e => html += `• ${e.k} Kcal quemadas<br>`);
    }

    document.getElementById('dayDetailContent').innerHTML = html;
    openModal('dayDetailModal');
  }

  async function cargarGraficas() {
    const snap = await db.ref('keto_logs').once('value');
    const data = snap.val() || {};
    const labels = [], pesos = [], carbos = [];
    
    Object.keys(data).sort().slice(-7).forEach(date => {
      labels.push(date.split('-')[2]);
      pesos.push(data[date].peso || null);
      let c = 0;
      if(data[date].comidas) Object.values(data[date].comidas).forEach(f => c += parseFloat(f.c));
      carbos.push(c);
    });

    new Chart(document.getElementById('weightChart'), {
      type: 'line',
      data: { labels, datasets: [{ label: 'Peso (kg)', data: pesos, borderColor: '#3b82f6', tension: 0.3 }] },
      options: { plugins: { legend: { labels: { color: '#fff' } } } }
    });

    new Chart(document.getElementById('carbChart'), {
      type: 'bar',
      data: { labels, datasets: [{ label: 'Carbohidratos', data: carbos, backgroundColor: '#22c55e' }] },
      options: { plugins: { legend: { labels: { color: '#fff' } } } }
    });
  }
</script>
</body>
</html>
