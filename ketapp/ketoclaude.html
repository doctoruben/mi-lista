<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keto Tracker Pro v2.1</title>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c24;
    --surface2: #1e2330;
    --border: rgba(255,255,255,0.08);
    --green: #22c55e;
    --red: #ef4444;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex; justify-content: center; padding: 16px;
  }
  .app { width: 100%; max-width: 400px; }

  /* HEADER */
  .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 25px; }
  .header b { font-size: 18px; font-weight: 600; }
  .icon-btn {
    width: 42px; height: 42px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px;
    cursor: pointer; color: var(--text); display: flex; align-items: center; justify-content: center;
  }

  /* DASHBOARD REFINADO */
  .dashboard {
    background: linear-gradient(145deg, var(--surface), var(--bg));
    border: 1px solid var(--border); border-radius: 24px;
    padding: 24px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }
  .dash-stats { display: flex; justify-content: space-between; margin-bottom: 20px; }
  .stat-card { text-align: center; }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .stat-value { font-size: 26px; font-weight: 700; }
  .stat-value small { font-size: 14px; color: var(--muted); font-weight: 400; }

  .progress-track { background: #2d3748; border-radius: 10px; height: 8px; overflow: hidden; }
  #barFill { height: 100%; background: var(--green); width: 0%; transition: width 0.8s ease; }

  /* ACCIONES */
  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .btn-sec {
    background: var(--surface); border: 1px solid var(--border);
    padding: 14px; border-radius: 14px; color: var(--text); font-weight: 500; cursor: pointer;
  }

  textarea {
    width: 100%; background: var(--surface); border: 2px solid var(--border);
    border-radius: 18px; padding: 16px; color: var(--text); font-size: 15px; outline: none;
  }
  .btn-main {
    width: 100%; margin-top: 12px; padding: 16px; background: var(--accent);
    color: white; border: none; border-radius: 16px; font-size: 15px; font-weight: 600; cursor: pointer;
  }

  /* RESULTADOS */
  .result-card {
    display: none; background: #1e293b; border: 1px solid var(--accent);
    border-radius: 20px; padding: 20px; margin-top: 15px;
  }
  .btn-group { display: flex; gap: 10px; margin-top: 15px; }
  .btn-confirm { flex: 2; background: var(--green); color: #000; border: none; padding: 12px; border-radius: 12px; font-weight: 700; }
  .btn-cancel { flex: 1; background: transparent; color: var(--text); border: 1px solid var(--border); padding: 12px; border-radius: 12px; }

  /* LISTADO */
  .log-item {
    background: var(--surface); margin-bottom: 10px; padding: 16px;
    border-radius: 16px; display: flex; justify-content: space-between; align-items: center;
  }

  /* MODALES */
  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px); z-index: 100; align-items: center; justify-content: center; padding: 20px;
  }
  .modal.open { display: flex; }
  .modal-box { background: var(--surface); border-radius: 28px; padding: 25px; width: 100%; max-width: 400px; }

  /* CALENDARIO ESTILO ANTERIOR */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 20px; }
  .cal-day {
    aspect-ratio: 1; background: var(--surface2); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 12px; cursor: pointer; border: 1px solid transparent; position: relative;
  }
  .cal-day.today { border-color: var(--accent); background: #252b3b; }
  .cal-mark { font-size: 10px; font-weight: bold; margin-top: 2px; }
  .cal-kcal { font-size: 8px; color: var(--muted); margin-top: 1px; }

  .spinner { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <button class="icon-btn" onclick="openModal('histModal')">📅</button>
    <b id="displayDate">Cargando...</b>
    <button class="icon-btn" onclick="openModal('cfgModal')">⚙️</button>
  </div>

  <div class="dashboard">
    <div class="dash-stats">
      <div class="stat-card">
        <div class="stat-label">Calorías Netas</div>
        <div class="stat-value" id="totalNetKcal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Carbohidratos</div>
        <div class="stat-value"><span id="totalCarbs">0</span><small>/30g</small></div>
      </div>
    </div>
    <div class="progress-track"><div id="barFill"></div></div>
  </div>

  <div class="action-grid">
    <button class="btn-sec" onclick="registrarPeso()">⚖️ Peso</button>
    <button class="btn-sec" onclick="registrarEjercicio()">🔥 Ejercicio</button>
  </div>

  <textarea id="foodInput" rows="2" placeholder="Describe tu comida..."></textarea>
  <button class="btn-main" id="btnAnalyze" onclick="analizarIA()">
    <span id="btnContent">Analizar con IA ✨</span>
  </button>

  <div id="resultCard" class="result-card">
    <h3 id="resName"></h3>
    <p id="resNutri" style="color: var(--muted); margin: 5px 0 15px;"></p>
    <div class="btn-group">
      <button class="btn-confirm" onclick="guardar()">Añadir</button>
      <button class="btn-cancel" onclick="cancelarAnalisis()">Cancelar</button>
    </div>
  </div>

  <div style="margin-top: 30px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <span style="font-size:12px; color:var(--muted); text-transform:uppercase;">Hoy</span>
      <button class="btn-sec" style="padding:6px 12px; font-size:11px;" onclick="openModal('chartModal')">Ver Gráficas 📈</button>
    </div>
    <div id="dailyList"></div>
  </div>
</div>

<div id="histModal" class="modal" onclick="closeModal('histModal')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <button onclick="cambiarMes(-1)" class="icon-btn">‹</button>
      <b id="calTitle" style="text-transform: capitalize;"></b>
      <button onclick="cambiarMes(1)" class="icon-btn">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <button class="btn-main" style="background:var(--surface2);" onclick="closeModal('histModal')">Cerrar</button>
  </div>
</div>

<div id="dayDetailModal" class="modal" onclick="closeModal('dayDetailModal')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3 id="detailDateTitle" style="margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:10px;"></h3>
    <div id="dayDetailContent" style="line-height:1.6; font-size:14px;"></div>
    <button class="btn-main" onclick="closeModal('dayDetailModal')">Cerrar</button>
  </div>
</div>

<div id="chartModal" class="modal" onclick="closeModal('chartModal')">
  <div class="modal-box" onclick="event.stopPropagation()" style="max-width:500px;">
    <h3 style="margin-bottom:20px;">Tu Evolución</h3>
    <canvas id="weightChart" style="margin-bottom:30px;"></canvas>
    <canvas id="carbChart"></canvas>
    <button class="btn-main" onclick="closeModal('chartModal')">Cerrar</button>
  </div>
</div>

<div id="cfgModal" class="modal" onclick="closeModal('cfgModal')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3>Ajustes</h3>
    <p style="color:var(--muted); font-size:13px; margin: 10px 0 20px;">Configura tu clave de acceso a la IA.</p>
    <button class="btn-main" onclick="cambiarKey()">🔑 Cambiar API Key</button>
    <button class="btn-main" style="background:none;" onclick="closeModal('cfgModal')">Cerrar</button>
  </div>
</div>

<script>
  // CONFIGURACIÓN FIREBASE (Mantén la tuya)
  const firebaseConfig = {
    apiKey: "AIzaSyBnmTgJYFsFAFWnGyaDZRUxOZGnL5SE1QA",
    authDomain: "lista-compra-9d6f5.firebaseapp.com",
    databaseURL: "https://lista-compra-9d6f5-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "lista-compra-9d6f5",
    storageBucket: "lista-compra-9d6f5.firebasestorage.app",
    messagingSenderId: "241322134457",
    appId: "1:241322134457:web:1b765857911f94d69cc468"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  
  let calView = new Date();
  let tempFood = null;
  const getHoyISO = () => new Date().toISOString().split('T')[0];

  window.onload = () => {
    document.getElementById('displayDate').innerText = new Date().toLocaleDateString('es-ES', { day:'numeric', month:'long' });
    escucharFirebase();
  };

  function openModal(id) { 
    document.getElementById(id).classList.add('open'); 
    if(id === 'histModal') generarCalendario();
    if(id === 'chartModal') setTimeout(cargarGraficas, 100);
  }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  function cambiarMes(d) { calView.setMonth(calView.getMonth() + d); generarCalendario(); }

  function cambiarKey() {
    const k = prompt("Pega tu API Key de Gemini:");
    if(k) localStorage.setItem('GEMINI_KEY', k.trim());
  }

  async function analizarIA() {
    const key = localStorage.getItem('GEMINI_KEY');
    const text = document.getElementById('foodInput').value.trim();
    if(!key || !text) { alert("Configura la API Key primero."); return; }

    const btn = document.getElementById('btnAnalyze');
    const btnContent = document.getElementById('btnContent');
    btn.disabled = true;
    btnContent.innerHTML = '<div class="spinner" style="margin:auto"></div>';

    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: `Analiza: "${text}". Devuelve SOLO JSON: {"n": "nombre", "c": carbs_num, "k": kcal_num}` }] }] })
      });
      const data = await res.json();
      let txt = data.candidates[0].content.parts[0].text.replace(/```json/g, "").replace(/```/g, "").trim();
      tempFood = JSON.parse(txt);
      
      document.getElementById('resName').innerText = tempFood.n;
      document.getElementById('resNutri').innerText = `${tempFood.c}g de Carbohidratos · ${tempFood.k} Kcal`;
      document.getElementById('resultCard').style.display = 'block';
    } catch (e) { alert("Error al analizar. Revisa tu conexión o API Key."); }
    btn.disabled = false;
    btnContent.innerText = 'Analizar con IA ✨';
  }

  function cancelarAnalisis() {
    document.getElementById('resultCard').style.display = 'none';
    tempFood = null;
    document.getElementById('foodInput').value = "";
  }

  function guardar() {
    if(tempFood) {
      db.ref(`keto_logs/${getHoyISO()}/comidas`).push(tempFood);
      cancelarAnalisis();
    }
  }

  function registrarPeso() {
    const p = prompt("Peso hoy (kg):");
    if(p && !isNaN(p)) db.ref(`keto_logs/${getHoyISO()}/peso`).set(parseFloat(p));
  }

  function registrarEjercicio() {
    const k = prompt("Calorías quemadas:");
    if(k && !isNaN(k)) db.ref(`keto_logs/${getHoyISO()}/ejercicio`).push({ k: parseInt(k) });
  }

  function escucharFirebase() {
    db.ref(`keto_logs/${getHoyISO()}`).on('value', snap => {
      const data = snap.val() || {};
      const list = document.getElementById('dailyList');
      list.innerHTML = "";
      
      let tc = 0, tkCons = 0, tkEjer = 0;
      
      // Compatibilidad y lectura de comidas
      const registros = data.comidas || {};
      Object.keys(registros).reverse().forEach(id => {
        const item = registros[id];
        tc += parseFloat(item.c); tkCons += parseInt(item.k);
        list.innerHTML += `<div class="log-item">
          <div><div style="font-weight:600">${item.n}</div><div style="font-size:12px;color:var(--muted)">${item.c}g carbs · ${item.k} kcal</div></div>
          <button style="background:none; border:none; color:var(--red); cursor:pointer;" onclick="db.ref('keto_logs/${getHoyISO()}/comidas/${id}').remove()">✕</button>
        </div>`;
      });

      if(data.ejercicio) Object.values(data.ejercicio).forEach(e => tkEjer += parseInt(e.k));

      document.getElementById('totalCarbs').innerText = tc.toFixed(1);
      document.getElementById('totalNetKcal').innerText = (tkCons - tkEjer);
      
      const p = Math.min((tc / 30) * 100, 100);
      document.getElementById('barFill').style.width = p + '%';
      document.getElementById('barFill').style.background = tc > 30 ? 'var(--red)' : 'var(--green)';
    });
  }

  async function generarCalendario() {
    const grid = document.getElementById('calGrid');
    const title = document.getElementById('calTitle');
    const y = calView.getFullYear(), m = calView.getMonth();
    title.innerText = new Intl.DateTimeFormat('es-ES', { month:'long', year:'numeric' }).format(calView);
    
    const snap = await db.ref('keto_logs').once('value');
    const all = snap.val() || {};
    
    grid.innerHTML = "LMaMiJuViSaDo".split(/(?=[A-Z])/).map(d => `<div style="font-size:10px; color:var(--muted); text-align:center; padding-bottom:10px;">${d}</div>`).join('');
    
    const first = new Date(y, m, 1).getDay();
    const offset = (first === 0) ? 6 : first - 1;
    for(let i=0; i<offset; i++) grid.innerHTML += '<div></div>';

    const days = new Date(y, m+1, 0).getDate();
    for(let d=1; d<=days; d++) {
      const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      let status = '', info = '', cls = (ds === getHoyISO()) ? 'today' : '';
      
      if(all[ds]) {
        let tc = 0, tkc = 0, tke = 0;
        if(all[ds].comidas) Object.values(all[ds].comidas).forEach(c => { tc += parseFloat(c.c); tkc += parseInt(c.k); });
        if(all[ds].ejercicio) Object.values(all[ds].ejercicio).forEach(e => tke += parseInt(e.k));
        
        status = `<span class="cal-mark" style="color:${tc > 30 ? 'var(--red)' : 'var(--green)'}">${tc > 30 ? 'X' : 'V'}</span>`;
        // Cambio clave: Si no hay peso, no se pone dato de peso
        const pesoInfo = all[ds].peso ? `${all[ds].peso}kg` : '';
        info = `<div class="cal-kcal">${tkc-tke} kcal<br>${pesoInfo}</div>`;
      }
      grid.innerHTML += `<div class="cal-day ${cls}" onclick="verDetalleDia('${ds}')"><b>${d}</b>${status}${info}</div>`;
    }
  }

  async function verDetalleDia(fecha) {
    const snap = await db.ref(`keto_logs/${fecha}`).once('value');
    const data = snap.val();
    if(!data) return;

    document.getElementById('detailDateTitle').innerText = new Date(fecha).toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
    let html = `<strong>⚖️ Peso:</strong> ${data.peso ? data.peso + ' kg' : 'No registrado'}<br><br>`;
    
    if(data.comidas) {
      html += `<strong>🍴 Comidas:</strong><br>`;
      Object.values(data.comidas).forEach(c => html += `• ${c.n} (${c.c}g C / ${c.k} Kcal)<br>`);
    }
    
    if(data.ejercicio) {
      let tke = 0;
      Object.values(data.ejercicio).forEach(e => tke += e.k);
      html += `<br><strong>🔥 Ejercicio:</strong> ${tke} Kcal quemadas<br>`;
    }

    document.getElementById('dayDetailContent').innerHTML = html;
    openModal('dayDetailModal');
  }

  async function cargarGraficas() {
    const snap = await db.ref('keto_logs').once('value');
    const data = snap.val() || {};
    const labels = [], pesos = [], carbos = [];
    
    const ultimos7Dias = [...Array(7).keys()].map(i => {
      const d = new Date(); d.setDate(d.getDate() - i);
      return d.toISOString().split('T')[0];
    }).reverse();

    ultimos7Dias.forEach(date => {
      labels.push(date.split('-')[2]);
      pesos.push(data[date]?.peso || null);
      let c = 0;
      if(data[date]?.comidas) Object.values(data[date].comidas).forEach(f => c += parseFloat(f.c));
      carbos.push(c);
    });

    const ctxW = document.getElementById('weightChart').getContext('2d');
    new Chart(ctxW, {
      type: 'line',
      data: { labels, datasets: [{ label: 'Peso (kg)', data: pesos, borderColor: '#3b82f6', tension: 0.3, fill: false }] },
      options: { scales: { y: { beginAtZero: false }, x: { ticks: { color: '#94a3b8' } } }, plugins: { legend: { labels: { color: '#fff' } } } }
    });

    const ctxC = document.getElementById('carbChart').getContext('2d');
    new Chart(ctxC, {
      type: 'bar',
      data: { labels, datasets: [{ label: 'Carbohidratos (g)', data: carbos, backgroundColor: '#22c55e' }] },
      options: { scales: { y: { beginAtZero: true }, x: { ticks: { color: '#94a3b8' } } }, plugins: { legend: { labels: { color: '#fff' } } } }
    });
  }
</script>
</body>
</html>
