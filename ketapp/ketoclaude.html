<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keto Tracker Pro - Original Style</title>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root { 
    --keto: #27ae60; 
    --dark: #1a1a1a; 
    --danger: #e74c3c; 
    --gray: #f4f4f9; 
    --text: #333;
  }
  body { 
    font-family: system-ui, -apple-system, sans-serif; 
    background: var(--gray); 
    display: flex; justify-content: center; padding: 15px; margin: 0; 
    color: var(--text);
  }
  .container { 
    background: white; padding: 25px; border-radius: 28px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
    width: 100%; max-width: 400px; min-height: 85vh; 
  }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .btn-icon { background: #eee; border: none; padding: 12px; border-radius: 14px; cursor: pointer; font-size: 1.2rem; }
  
  .dashboard { 
    background: var(--dark); color: white; padding: 20px; 
    border-radius: 22px; text-align: center; margin-bottom: 20px; 
  }
  .progress-bar { background: #333; border-radius: 10px; height: 10px; margin: 15px 0; overflow: hidden; }
  #barFill { background: var(--keto); height: 100%; width: 0%; transition: 1s ease; }
  
  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
  .btn-sec { background: #eee; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; color: var(--dark); font-size: 0.9rem; }

  textarea { 
    width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 15px; 
    box-sizing: border-box; font-size: 1rem; outline: none; resize: none; font-family: inherit;
  }
  .btn-main { 
    background: var(--dark); color: white; border: none; padding: 15px; 
    width: 100%; border-radius: 15px; cursor: pointer; margin-top: 10px; font-weight: bold; 
  }
  
  .result-card { display: none; margin-top: 20px; padding: 15px; border-radius: 15px; background: #f0fff4; border: 1px solid #c6f6d5; }
  .food-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }

  /* MODALES */
  .modal { 
    display: none; position: fixed; top:0; left:0; width:100%; height:100%; 
    background:rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; backdrop-filter: blur(4px); 
  }
  .modal.open { display: flex; }
  .modal-content { background:white; padding:20px; border-radius:24px; width:90%; max-width:380px; }

  /* CALENDARIO ORIGINAL MEJORADO */
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
  .calendar-day { 
    aspect-ratio: 0.9; display: flex; flex-direction: column; align-items: center; 
    justify-content: center; border-radius: 12px; font-size: 0.75rem; 
    border: 1px solid transparent; background: #f9f9f9; cursor: pointer;
  }
  .calendar-day.today { border-color: var(--keto); background: #f0fff4; }
  .status-icon { font-size: 0.7rem; font-weight: bold; margin: 2px 0; }
  .cal-label { font-size: 0.6rem; color: #777; line-height: 1; }

  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <button class="btn-icon" onclick="openModal('historyModal')">📅</button>
    <b id="displayDate"></b>
    <button class="btn-icon" onclick="openModal('configModal')">⚙️</button>
  </div>

  <div class="dashboard">
    <div class="progress-bar"><div id="barFill"></div></div>
    <div style="display:flex; justify-content: space-around; font-size: 0.9rem;">
      <div>Carbs: <b id="totalCarbs">0</b>/30g</div>
      <div>Netas: <b id="totalNetKcal">0</b> kcal</div>
    </div>
  </div>

  <div class="action-grid">
    <button class="btn-sec" onclick="registrarPeso()">⚖️ Peso</button>
    <button class="btn-sec" onclick="registrarEjercicio()">🔥 Ejercicio</button>
  </div>

  <textarea id="foodInput" rows="2" placeholder="Ej: Tortilla de 2 huevos..."></textarea>
  <button class="btn-main" id="btnAnalyze" onclick="analizarIA()">
    <span id="btnText">Analizar ✨</span>
  </button>

  <div id="resultCard" class="result-card">
    <h4 id="resName" style="margin:0"></h4>
    <p id="resNutri" style="margin:10px 0; font-size:0.9rem;"></p>
    <div style="display:flex; gap:10px;">
        <button onclick="guardar()" style="flex:2; background:var(--keto); color:white; border:none; padding:12px; border-radius:12px; cursor:pointer; font-weight:bold;">Añadir</button>
        <button onclick="cancelarAnalisis()" style="flex:1; background:#eee; color:#333; border:none; padding:12px; border-radius:12px; cursor:pointer;">X</button>
    </div>
  </div>

  <div id="dailyList" style="margin-top:20px;"></div>
  
  <button class="btn-sec" style="width:100%; margin-top:20px;" onclick="openModal('chartModal')">Ver Gráficas 📈</button>
</div>

<div id="historyModal" class="modal">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <button class="btn-icon" style="padding:5px 10px;" onclick="cambiarMes(-1)">‹</button>
      <b id="calendarMonthName" style="text-transform: capitalize;"></b>
      <button class="btn-icon" style="padding:5px 10px;" onclick="cambiarMes(1)">›</button>
    </div>
    <div class="calendar-grid" id="calendarDays"></div>
    <button onclick="closeModal('historyModal')" class="btn-main">Cerrar</button>
  </div>
</div>

<div id="dayDetailModal" class="modal">
    <div class="modal-content">
      <h3 id="detailDateTitle"></h3>
      <div id="dayDetailContent" style="max-height:300px; overflow-y:auto; margin:15px 0;"></div>
      <button onclick="closeModal('dayDetailModal')" class="btn-main">Volver</button>
    </div>
</div>

<div id="chartModal" class="modal">
    <div class="modal-content">
      <h3>Mi Progreso</h3>
      <canvas id="weightChart" style="margin-bottom:20px;"></canvas>
      <canvas id="carbChart"></canvas>
      <button onclick="closeModal('chartModal')" class="btn-main">Cerrar</button>
    </div>
</div>

<div id="configModal" class="modal">
  <div class="modal-content">
    <h3>Ajustes</h3>
    <button class="btn-main" onclick="cambiarKey()">🔑 Configurar API Key</button>
    <button onclick="closeModal('configModal')" class="btn-main" style="background:#eee; color:#333;">Cerrar</button>
  </div>
</div>

<script>
  // CONFIGURACIÓN FIREBASE (Mantén la tuya)
  const firebaseConfig = {
    apiKey: "AIzaSyBnmTgJYFsFAFWnGyaDZRUxOZGnL5SE1QA",
    authDomain: "lista-compra-9d6f5.firebaseapp.com",
    databaseURL: "https://lista-compra-9d6f5-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "lista-compra-9d6f5",
    storageBucket: "lista-compra-9d6f5.firebasestorage.app",
    messagingSenderId: "241322134457",
    appId: "1:241322134457:web:1b765857911f94d69cc468"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  
  let fechaVistaCalendario = new Date();
  const hoyISO = new Date().toISOString().split('T')[0];
  let tempFood = null;

  window.onload = () => {
    document.getElementById('displayDate').innerText = new Date().toLocaleDateString('es-ES', {day:'numeric', month:'long'});
    escucharFirebase();
  };

  function openModal(id) { 
    document.getElementById(id).classList.add('open'); 
    if(id === 'historyModal') generarCalendario();
    if(id === 'chartModal') setTimeout(cargarGraficas, 200);
  }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  function cambiarMes(delta) { fechaVistaCalendario.setMonth(fechaVistaCalendario.getMonth() + delta); generarCalendario(); }

  function cambiarKey() {
    const k = prompt("Pega tu API Key:");
    if(k) localStorage.setItem('GEMINI_KEY', k.trim());
  }

  async function analizarIA() {
    const key = localStorage.getItem('GEMINI_KEY');
    const text = document.getElementById('foodInput').value.trim();
    if(!key || !text) return;
    
    const btn = document.getElementById('btnAnalyze');
    const btnText = document.getElementById('btnText');
    btn.disabled = true;
    btnText.innerHTML = '<div class="spinner" style="margin:auto"></div>';

    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: `Analiza: "${text}". Devuelve SOLO JSON: {"n": "nombre", "c": carbs_num, "k": kcal_num}` }] }] })
      });
      const data = await response.json();
      let txt = data.candidates[0].content.parts[0].text.replace(/```json/g, "").replace(/```/g, "").trim();
      tempFood = JSON.parse(txt);
      document.getElementById('resName').innerText = tempFood.n;
      document.getElementById('resNutri').innerText = `${tempFood.c}g Carbs | ${tempFood.k} Kcal`;
      document.getElementById('resultCard').style.display = 'block';
    } catch (err) { alert("Error de IA"); }
    btn.disabled = false;
    btnText.innerText = "Analizar ✨";
  }

  function cancelarAnalisis() {
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('foodInput').value = "";
    tempFood = null;
  }

  function guardar() {
    if(tempFood) {
      db.ref(`keto_logs/${hoyISO}/comidas`).push(tempFood);
      cancelarAnalisis();
    }
  }

  function registrarPeso() {
    const p = prompt("Peso hoy (kg):");
    if(p) db.ref(`keto_logs/${hoyISO}/peso`).set(parseFloat(p));
  }

  function registrarEjercicio() {
    const k = prompt("Kcal quemadas:");
    if(k) db.ref(`keto_logs/${hoyISO}/ejercicio`).push({ k: parseInt(k) });
  }

  function escucharFirebase() {
    db.ref(`keto_logs/${hoyISO}`).on('value', snap => {
      const data = snap.val() || {};
      const list = document.getElementById('dailyList');
      list.innerHTML = "";
      
      let tc = 0, tkCons = 0, tkEjer = 0;
      
      // CARGAR COMIDAS (Compatibilidad con formato viejo y nuevo)
      let registros = data.comidas || {};
      if (Object.keys(registros).length === 0) {
          Object.keys(data).forEach(key => {
              if (key !== 'peso' && key !== 'ejercicio' && typeof data[key] === 'object') registros[key] = data[key];
          });
      }

      Object.keys(registros).reverse().forEach(id => {
          const item = registros[id];
          tc += parseFloat(item.c || 0); tkCons += parseInt(item.k || 0);
          list.innerHTML += `<div class="food-item">
            <div><b>${item.n}</b><br><small>${item.c}g | ${item.k} kcal</small></div>
            <div style="color:#ccc; cursor:pointer;" onclick="db.ref('keto_logs/${hoyISO}/comidas/${id}').remove(); db.ref('keto_logs/${hoyISO}/${id}').remove();">✕</div>
          </div>`;
      });

      if(data.ejercicio) Object.values(data.ejercicio).forEach(e => tkEjer += e.k);

      document.getElementById('totalCarbs').innerText = tc.toFixed(1);
      document.getElementById('totalNetKcal').innerText = (tkCons - tkEjer);
      const p = Math.min((tc / 30) * 100, 100);
      document.getElementById('barFill').style.width = p + '%';
      document.getElementById('barFill').style.background = tc > 30 ? 'var(--danger)' : 'var(--keto)';
    });
  }

  async function generarCalendario() {
    const grid = document.getElementById('calendarDays');
    const title = document.getElementById('calendarMonthName');
    const y = fechaVistaCalendario.getFullYear(), m = fechaVistaCalendario.getMonth();
    title.innerText = new Intl.DateTimeFormat('es-ES', { month: 'long', year: 'numeric' }).format(fechaVistaCalendario);
    
    const snap = await db.ref('keto_logs').once('value');
    const all = snap.val() || {};
    
    grid.innerHTML = "LMaMiJuViSaDo".split(/(?=[A-Z])/).map(d => `<div style="font-size:0.7rem;font-weight:bold;color:#999;margin-bottom:8px">${d}</div>`).join('');
    
    const first = new Date(y, m, 1).getDay();
    const offset = (first === 0) ? 6 : first - 1;
    for(let i=0; i<offset; i++) grid.innerHTML += '<div></div>';

    const days = new Date(y, m + 1, 0).getDate();
    for(let d=1; d<=days; d++){
      const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      let status = '', info = '', cls = (ds === hoyISO) ? 'today' : '';
      if(all[ds]){
        let tc = 0, tkc = 0, tke = 0;
        let regs = all[ds].comidas || all[ds];
        Object.values(regs).forEach(v => { if(v.c){ tc += parseFloat(v.c); tkc += parseInt(v.k); } });
        if(all[ds].ejercicio) Object.values(all[ds].ejercicio).forEach(e => tke += e.k);
        
        status = `<span class="status-icon" style="color:${tc > 30 ? 'var(--danger)' : 'var(--keto)'}">${tc > 30 ? 'X' : 'V'}</span>`;
        // Solo mostrar peso si existe
        const pesoInfo = all[ds].peso ? `${all[ds].peso}kg` : '';
        info = `<div class="cal-label">${tkc-tke} kcal<br>${pesoInfo}</div>`;
      }
      grid.innerHTML += `<div class="calendar-day ${cls}" onclick="verDetalleDia('${ds}')"><b>${d}</b>${status}${info}</div>`;
    }
  }

  async function verDetalleDia(fecha) {
    const snap = await db.ref(`keto_logs/${fecha}`).once('value');
    const data = snap.val();
    if(!data) return;

    document.getElementById('detailDateTitle').innerText = fecha;
    let html = `<b>⚖️ Peso:</b> ${data.peso ? data.peso + ' kg' : 'Sin registro'}<br><hr>`;
    
    let regs = data.comidas || data;
    html += `<b>🍴 Comidas:</b><br>`;
    Object.values(regs).forEach(v => {
        if(v.n) html += `• ${v.n} (${v.c}g C | ${v.k} Kcal)<br>`;
    });
    
    if(data.ejercicio) {
        let tke = 0; Object.values(data.ejercicio).forEach(e => tke += e.k);
        html += `<br><b>🔥 Ejercicio:</b> ${tke} Kcal quemadas`;
    }

    document.getElementById('dayDetailContent').innerHTML = html;
    openModal('dayDetailModal');
  }

  function cargarGraficas() {
    db.ref('keto_logs').once('value', snap => {
        const all = snap.val() || {};
        const labels = [], pesos = [], carbos = [];
        const ultimos7 = [...Array(7).keys()].map(i => {
            const d = new Date(); d.setDate(d.getDate() - i);
            return d.toISOString().split('T')[0];
        }).reverse();

        ultimos7.forEach(d => {
            labels.push(d.split('-')[2]);
            pesos.push(all[d]?.peso || null);
            let c = 0;
            let regs = all[d]?.comidas || all[d] || {};
            Object.values(regs).forEach(v => { if(v.c) c += parseFloat(v.c); });
            carbos.push(c);
        });

        new Chart(document.getElementById('weightChart'), {
            type: 'line',
            data: { labels, datasets: [{ label: 'Peso (kg)', data: pesos, borderColor: '#27ae60', tension: 0.3 }] }
        });
        new Chart(document.getElementById('carbChart'), {
            type: 'bar',
            data: { labels, datasets: [{ label: 'Carbos (g)', data: carbos, backgroundColor: '#333' }] }
        });
    });
  }
</script>
</body>
</html>
