<!DOCTYPE html>
<html lang="es">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keto Tracker Pro - Premium</title>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root { 
    --keto: #27ae60; --dark: #1a1a1a; --danger: #e74c3c; --gray: #f4f4f9; --text: #333; --muted: #888;
  }
  body { 
    font-family: system-ui, -apple-system, sans-serif; background: var(--gray); 
    display: flex; justify-content: center; padding: 10px; margin: 0; color: var(--text);
  }
  .container { 
    background: white; padding: 20px; border-radius: 28px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px; min-height: 85vh; 
  }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .btn-icon { background: #eee; border: none; padding: 10px; border-radius: 12px; cursor: pointer; font-size: 1.1rem; }
  
  .dashboard { 
    background: var(--dark); color: white; padding: 22px; border-radius: 24px; margin-bottom: 20px; 
    box-shadow: 0 8px 16px rgba(0,0,0,0.15);
  }
  .dash-main { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; }
  .dash-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 4px; }
  .dash-value { font-size: 1.8rem; font-weight: 800; line-height: 1; }
  .dash-value small { font-size: 0.9rem; font-weight: 400; color: var(--muted); }

  .dash-stats-row { 
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; 
    padding-top: 15px; border-top: 1px solid #333; margin-top: 15px;
  }
  .stat-item { text-align: center; }
  .stat-item div:first-child { font-size: 0.65rem; color: var(--muted); margin-bottom: 3px; }
  .stat-item div:last-child { font-size: 0.95rem; font-weight: 600; }

  .progress-bar { background: #333; border-radius: 10px; height: 6px; overflow: hidden; }
  #barFill { background: var(--keto); height: 100%; width: 0%; transition: 1s ease; }
  
  .action-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 15px; }
  .btn-sec { background: #eee; border: none; padding: 10px 4px; border-radius: 12px; font-weight: bold; cursor: pointer; color: var(--dark); font-size: 0.75rem; }

  textarea { 
    width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 15px; 
    box-sizing: border-box; font-size: 1rem; outline: none; resize: none; font-family: inherit;
  }
  .btn-main { background: var(--dark); color: white; border: none; padding: 14px; width: 100%; border-radius: 15px; cursor: pointer; margin-top: 10px; font-weight: bold; }
  
  .result-card { display: none; margin-top: 15px; padding: 15px; border-radius: 15px; background: #f0fff4; border: 1px solid #c6f6d5; }
  .food-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }

  .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; backdrop-filter: blur(4px); }
  .modal.open { display: flex; }
  .modal-content { background:white; padding:20px; border-radius:24px; width:95%; max-width:380px; }

  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
  .calendar-day { aspect-ratio: 0.8; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; font-size: 0.65rem; border: 1px solid transparent; background: #f9f9f9; cursor: pointer; padding: 2px; }
  .calendar-day.today { border-color: var(--keto); background: #f0fff4; }

  .chart-container { 
    margin-bottom: 25px; 
    height: 180px !important; 
    width: 100%;
    position: relative;
  }
  .chart-title { font-size: 0.85rem; font-weight: bold; color: #555; margin-bottom: 8px; border-left: 3px solid var(--keto); padding-left: 8px; }

  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <button class="btn-icon" onclick="openModal('historyModal')">📅</button>
    <b id="displayDate" style="font-size: 0.9rem;"></b>
    <button class="btn-icon" onclick="openModal('configModal')">⚙️</button>
  </div>

  <div class="dashboard">
    <div class="dash-main">
      <div>
        <div class="dash-label">Carbohidratos</div>
        <div class="dash-value"><span id="totalCarbs">0</span><small>/30g</small></div>
      </div>
      <div style="text-align: right;">
        <div class="dash-label">Netas</div>
        <div class="dash-value"><span id="totalNetKcal">0</span> <small>kcal</small></div>
      </div>
    </div>
    
    <div class="progress-bar"><div id="barFill"></div></div>

    <div class="dash-stats-row">
      <div class="stat-item">
        <div>Consumidas</div>
        <div><span id="kcalConsumidas">0</span><small> kcal</small></div>
      </div>
      <div class="stat-item">
        <div>Quemadas</div>
        <div><span id="kcalQuemadas">0</span><small> kcal</small></div>
      </div>
      <div class="stat-item">
        <div>Peso</div>
        <div id="currentWeight">--</div>
      </div>
    </div>
  </div>

  <div class="action-grid">
    <button class="btn-sec" onclick="registrarPeso()">⚖️ Peso</button>
    <button class="btn-sec" onclick="registrarEjercicio()">🔥 Ejercicio</button>
    <button class="btn-sec" onclick="openModal('chartModal')">📈 Gráficas</button>
  </div>

  <textarea id="foodInput" rows="2" placeholder="Describe tu comida..."></textarea>
  <button class="btn-main" id="btnAnalyze" onclick="analizarIA()">
    <span id="btnText">Analizar con Gemini ✨</span>
  </button>

  <div id="resultCard" class="result-card">
    <h4 id="resName" style="margin:0; font-size:0.95rem;"></h4>
    <p id="resNutri" style="margin:8px 0; font-size:0.85rem;"></p>
    <div style="display:flex; gap:10px;">
        <button onclick="guardar()" style="flex:2; background:var(--keto); color:white; border:none; padding:10px; border-radius:10px; cursor:pointer; font-weight:bold;">Añadir</button>
        <button onclick="cancelarAnalisis()" style="flex:1; background:#eee; color:#333; border:none; padding:10px; border-radius:10px; cursor:pointer;">X</button>
    </div>
  </div>

  <div id="dailyList" style="margin-top:15px;"></div>
</div>

<div id="chartModal" class="modal"><div class="modal-content" style="max-width: 95%; height: 85vh; overflow-y: auto;">
    <h3 style="margin-bottom:20px;">Mes Actual</h3>
    <div class="chart-container"><div class="chart-title">Peso (kg)</div><canvas id="weightChart"></canvas></div>
    <div class="chart-container"><div class="chart-title">Calorías Netas (kcal)</div><canvas id="kcalChart"></canvas></div>
    <div class="chart-container"><div class="chart-title">Carbohidratos (g)</div><canvas id="carbChart"></canvas></div>
    <button onclick="closeModal('chartModal')" class="btn-main">Cerrar</button>
</div></div>

<div id="historyModal" class="modal"><div class="modal-content">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <button class="btn-icon" onclick="cambiarMes(-1)">‹</button>
    <b id="calendarMonthName" style="text-transform: capitalize;"></b>
    <button class="btn-icon" onclick="cambiarMes(1)">›</button>
  </div>
  <div class="calendar-grid" id="calendarDays"></div>
  <button onclick="closeModal('historyModal')" class="btn-main">Cerrar</button>
</div></div>

<div id="configModal" class="modal"><div class="modal-content">
  <h3>Ajustes</h3>
  <button class="btn-main" onclick="cambiarKey()">🔑 Configurar API Key</button>
  <button onclick="closeModal('configModal')" class="btn-main" style="background:#eee; color:#333;">Cerrar</button>
</div></div>

<script>
  // CONFIGURACIÓN FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyBnmTgJYFsFAFWnGyaDZRUxOZGnL5SE1QA",
    authDomain: "lista-compra-9d6f5.firebaseapp.com",
    databaseURL: "https://lista-compra-9d6f5-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "lista-compra-9d6f5",
    storageBucket: "lista-compra-9d6f5.firebasestorage.app",
    messagingSenderId: "241322134457",
    appId: "1:241322134457:web:1b765857911f94d69cc468"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  
  // VARIABLES DE ESTADO
  let fechaSeleccionada = new Date(); // La fecha que se muestra en el dashboard
  let fechaVistaCalendario = new Date(); // La fecha que se usa para navegar por el calendario
  let tempFood = null;

  // Formato YYYY-MM-DD local seguro
  const formatISO = (date) => {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  };

  window.onload = () => {
    escucharFirebase();
  };

  // NAVEGACIÓN
  function escucharFirebase() {
  const iso = formatISO(fechaSeleccionada);
  document.getElementById('displayDate').innerText = fechaSeleccionada.toLocaleDateString('es-ES', {day:'numeric', month:'long'});

  db.ref('keto_logs').off();

  db.ref(`keto_logs/${iso}`).on('value', snap => {
    const data = snap.val() || {};
    const list = document.getElementById('dailyList');
    list.innerHTML = "";
    
    let tc = 0, tkCons = 0, tkEjer = 0;

    // --- LÓGICA DE EXTRACCIÓN DE COMIDAS ---
    let objetosComida = {};

    // 1. Miramos si existe la carpeta 'comidas' (Estructura nueva)
    if (data.comidas) {
        objetosComida = data.comidas;
    } 
    
    // 2. Buscamos registros sueltos que NO sean peso ni ejercicio (Estructura antigua)
    // Esto evita que al añadir algo nuevo, lo viejo "desaparezca" de la vista
    Object.keys(data).forEach(key => {
        if (key !== 'peso' && key !== 'ejercicio' && key !== 'comidas') {
            if (typeof data[key] === 'object' && data[key].n) {
                objetosComida[key] = data[key];
            }
        }
    });

    // Dibujamos la lista unificada
    const keys = Object.keys(objetosComida);
    if (keys.length === 0) {
        list.innerHTML = "<p style='text-align:center;color:#ccc;font-size:0.8rem;'>Sin registros</p>";
    } else {
        keys.reverse().forEach(id => {
            const item = objetosComida[id];
            tc += parseFloat(item.c || 0); 
            tkCons += parseInt(item.k || 0);
            list.innerHTML += `
                <div class="food-item">
                    <div><b>${item.n}</b><br><small>${item.c}g | ${item.k} kcal</small></div>
                    <div style="color:#ccc; cursor:pointer; padding:5px;" onclick="eliminarRegistro('${id}')">✕</div>
                </div>`;
        });
    }

    // --- PESO Y EJERCICIO ---
    if(data.ejercicio) {
        Object.values(data.ejercicio).forEach(e => {
            if (typeof e === 'object') tkEjer += (e.k || 0);
            else tkEjer += parseInt(e || 0); // Por si acaso hay datos simples
        });
    }
    
    document.getElementById('totalCarbs').innerText = tc.toFixed(1);
    document.getElementById('kcalConsumidas').innerText = tkCons;
    document.getElementById('kcalQuemadas').innerText = tkEjer;
    document.getElementById('totalNetKcal').innerText = (tkCons - tkEjer);
    document.getElementById('currentWeight').innerText = data.peso ? data.peso + " kg" : "--";
    
    const p = Math.min((tc / 30) * 100, 100);
    document.getElementById('barFill').style.width = p + '%';
    document.getElementById('barFill').style.background = tc > 30 ? 'var(--danger)' : 'var(--keto)';
  });
}

  function verDetalleDia(isoString) {
    // Al hacer clic en un día del calendario, cambiamos la fecha seleccionada y refrescamos dashboard
    fechaSeleccionada = new Date(isoString + 'T12:00:00');
    closeModal('historyModal');
    escucharFirebase();
  }

  // MODALES
  function openModal(id) { 
    document.getElementById(id).classList.add('open'); 
    if(id === 'historyModal') generarCalendario();
    if(id === 'chartModal') setTimeout(cargarGraficas, 400);
  }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  function cambiarMes(delta) { fechaVistaCalendario.setMonth(fechaVistaCalendario.getMonth() + delta); generarCalendario(); }

  // IA GEMINI
  function cambiarKey() {
    const k = prompt("Pega tu API Key de Gemini:");
    if(k) localStorage.setItem('GEMINI_KEY', k.trim());
  }

  async function analizarIA() {
  const key = localStorage.getItem('GEMINI_KEY');
  const text = document.getElementById('foodInput').value.trim();
  
  if(!key) { alert("Falta la API Key. Configúrala en ajustes."); return; }
  if(!text) return;

  const btn = document.getElementById('btnAnalyze');
  const btnText = document.getElementById('btnText');
  
  btn.disabled = true; 
  btnText.innerHTML = '<div class="spinner" style="margin:auto"></div>';

  try {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;
    const response = await fetch(url, {
      method: 'POST', 
      headers: { 'Content-Type': 'application/json' },
     // ... dentro de tu JSON.stringify
body: JSON.stringify({ 
  contents: [{ 
    parts: [{ 
      text: `Actúa como si fueras nutricionista Keto experto y esfuerzate en dar datos lo mas reables posibles. 
             Analiza: "${text}". 
             Si no hay cantidades, usa raciones estándar.
             Devuelve SOLO el objeto JSON, sin texto adicional: 
             {"n": "nombre", "c": carbs_num, "k": kcal_num}` 
    }] 
  }] 
})
// ...
    });
// ....................................................
// --- GESTIÓN DE ERRORES HTTP ---
    if (!response.ok) {
        if (response.status === 503) {
            throw new Error("Servidor ocupado. Reintente en unos segundos.");
        } else if (response.status === 429) {
            throw new Error("Demasiadas peticiones. Espere un poco.");
        } else if (response.status === 400) {
            throw new Error("API Key inválida o error en el texto.");
        } else {
            throw new Error(`Error ${response.status}: Inténtalo de nuevo.`);
        }
    }


// ....................................................  
  const data = await response.json();

    if (!data.candidates || !data.candidates[0].content) {
        throw new Error("La IA no pudo procesar esta descripción.");
    }

    let rawText = data.candidates[0].content.parts[0].text;
    let cleanJson = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
    
    tempFood = JSON.parse(cleanJson);
    
    document.getElementById('resName').innerText = tempFood.n;
    document.getElementById('resNutri').innerText = `${tempFood.c}g Carbs | ${tempFood.k} Kcal`;
    document.getElementById('resultCard').style.display = 'block';

  } catch (err) {
    console.error("Error IA:", err);
    // Mostramos el mensaje amigable en un alert o podrías ponerlo en un div de error
    alert("✨ NOTA DE IA:\n" + err.message);
  } finally {
    btn.disabled = false; 
    btnText.innerText = "Analizar ✨";
  }
}


  function cancelarAnalisis() { document.getElementById('resultCard').style.display = 'none'; document.getElementById('foodInput').value = ""; tempFood = null; }

  // ESCRITURA EN DB (Siempre usa fechaSeleccionada)
 function guardar() { 
  if(tempFood) { 
    // Forzamos que siempre se guarde dentro de la subcarpeta 'comidas'
    const ref = db.ref(`keto_logs/${formatISO(fechaSeleccionada)}/comidas`);
    ref.push(tempFood).then(() => {
        cancelarAnalisis(); 
    }).catch(err => alert("Error al guardar: " + err.message));
  } 
}

  function registrarPeso() { 
    const p = prompt("Peso (kg):"); 
    if(p) db.ref(`keto_logs/${formatISO(fechaSeleccionada)}/peso`).set(parseFloat(p)); 
  }
  function registrarEjercicio() { 
    const k = prompt("Kcal quemadas:"); 
    if(k) db.ref(`keto_logs/${formatISO(fechaSeleccionada)}/ejercicio`).push({ k: parseInt(k) }); 
  }
function eliminarRegistro(id) {
    const iso = formatISO(fechaSeleccionada);
    // Borramos en ambas rutas posibles para estar seguros
    db.ref(`keto_logs/${iso}/comidas/${id}`).remove();
    db.ref(`keto_logs/${iso}/${id}`).remove();
}

  // CALENDARIO
  async function generarCalendario() {
    const grid = document.getElementById('calendarDays');
    const title = document.getElementById('calendarMonthName');
    const y = fechaVistaCalendario.getFullYear(), m = fechaVistaCalendario.getMonth();
    title.innerText = new Intl.DateTimeFormat('es-ES', { month: 'long', year: 'numeric' }).format(fechaVistaCalendario);
    
    const snap = await db.ref('keto_logs').once('value');
    const all = snap.val() || {};
    grid.innerHTML = "LuMaMiJuViSaDo".split(/(?=[A-Z])/).map(d => `<div style="font-size:0.55rem;font-weight:bold;color:#999;margin-bottom:2px">${d}</div>`).join('');
    
    const first = new Date(y, m, 1).getDay();
    const offset = (first === 0) ? 6 : first - 1;
    for(let i=0; i<offset; i++) grid.innerHTML += '<div></div>';

    const days = new Date(y, m + 1, 0).getDate();
    const hoyStr = formatISO(new Date());

    for(let d=1; d<=days; d++){
      const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      let status = '', info = '', cls = (ds === hoyStr) ? 'today' : '';
      if(all[ds]){
        let tc = 0, tkc = 0, tke = 0;
        let regs = all[ds].comidas || all[ds];
        Object.values(regs).forEach(v => { if(v && v.k){ tc += parseFloat(v.c || 0); tkc += parseInt(v.k || 0); } });
        if(all[ds].ejercicio) Object.values(all[ds].ejercicio).forEach(e => tke += (e.k || 0));
        status = `<span style="font-size:0.5rem;">${tc > 30 ? '❌' : '✅'}</span>`;
        const pInfo = all[ds].peso ? `<br><span style="color:var(--keto); font-weight:bold;">${all[ds].peso}kg</span>` : '';
        info = `<div style="font-size:0.45rem; line-height:0.9; color:#666;">${tkc-tke}k${pInfo}</div>`;
      }
      grid.innerHTML += `<div class="calendar-day ${cls}" onclick="verDetalleDia('${ds}')"><b style="font-size:0.7rem;">${d}</b>${status}${info}</div>`;
    }
  }

  // GRÁFICAS
  function cargarGraficas() {
    db.ref('keto_logs').once('value', snap => {
        const all = snap.val() || {};
        const labels = [], pesos = [], carbos = [], kcals = [];
        
        // Usamos el mes que el usuario está viendo actualmente en el calendario
        const y = fechaVistaCalendario.getFullYear();
        const m = fechaVistaCalendario.getMonth();
        const ultimoDia = new Date(y, m + 1, 0).getDate();

        for (let d = 1; d <= ultimoDia; d++) {
            const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            labels.push(d);

            if (all[ds]) {
                const dia = all[ds];
                pesos.push(dia.peso ? parseFloat(dia.peso) : null);
                
                let cDia = 0, kDia = 0, tieneDatos = false;

                // --- PROCESAR COMIDAS (Cualquier estructura) ---
                // Buscamos tanto en dia.comidas como en el propio objeto dia
                const fuentes = [dia.comidas, dia]; 

                fuentes.forEach(fuente => {
                    if (fuente && typeof fuente === 'object') {
                        Object.values(fuente).forEach(item => {
                            // Verificamos si el objeto tiene las propiedades de comida (n, c, k)
                            if (item && typeof item === 'object' && (item.c !== undefined || item.k !== undefined)) {
                                cDia += parseFloat(item.c || 0);
                                kDia += parseFloat(item.k || 0);
                                tieneDatos = true;
                            }
                        });
                    }
                });

                // --- PROCESAR EJERCICIO ---
                let eDia = 0;
                if (dia.ejercicio) {
                    Object.values(dia.ejercicio).forEach(ex => {
                        const valorK = typeof ex === 'object' ? (ex.k || 0) : ex;
                        eDia += parseFloat(valorK || 0);
                        tieneDatos = true;
                    });
                }
                
                // Si encontramos cualquier dato (comida o ejercicio), enviamos el total
                if (tieneDatos) {
                    carbos.push(cDia);
                    kcals.push(kDia - eDia);
                } else {
                    carbos.push(null);
                    kcals.push(null);
                }
            } else {
                pesos.push(null);
                carbos.push(null);
                kcals.push(null);
            }
        }

        const opt = (max) => ({ 
            responsive: true, 
            maintainAspectRatio: false, 
            plugins: { legend: { display: false } }, 
            scales: { 
                y: { min: 0, max, ticks: { font: { size: 10 } } }, 
                x: { ticks: { font: { size: 9 } } } 
            }, 
            spanGaps: true 
        });

        if (window.wChart) window.wChart.destroy();
        if (window.cChart) window.cChart.destroy();
        if (window.kChart) window.kChart.destroy();

        window.wChart = new Chart(document.getElementById('weightChart'), { 
            type: 'line', 
            data: { labels, datasets: [{ data: pesos, borderColor: '#3b82f6', tension: 0.3, pointRadius: 3 }] }, 
            options: opt(100) 
        });

        window.kChart = new Chart(document.getElementById('kcalChart'), { 
            type: 'line', 
            data: { labels, datasets: [{ data: kcals, borderColor: '#27ae60', fill: true, backgroundColor: 'rgba(39,174,96,0.1)', tension: 0.3 }] }, 
            options: opt(2000) 
        });

        window.cChart = new Chart(document.getElementById('carbChart'), { 
            type: 'bar', 
            data: { labels, datasets: [{ data: carbos, backgroundColor: carbos.map(v => v > 30 ? '#e74c3c' : '#333') }] }, 
            options: opt(60) 
        });
    });
}
</script>
</body>
</html>
