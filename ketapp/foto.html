
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keto Vision Lab - Test 2.5</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; padding: 20px; color: #333; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #c0392b; text-align: center; margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        .btn-main { width: 100%; background: #27ae60; color: white; border: none; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-main:hover { background: #219150; }
        .btn-main:disabled { background: #bdc3c7; }

        #preview { width: 100%; border-radius: 10px; margin-top: 15px; display: none; border: 1px solid #ddd; }
        
        .loader { text-align: center; display: none; margin: 20px 0; font-weight: bold; color: #2980b9; }
        
        #resultado { margin-top: 20px; min-height: 50px; }
        .result-box { border: 2px solid #27ae60; padding: 15px; border-radius: 10px; background: #fafffa; }
        .error-box { border: 2px solid #e74c3c; padding: 15px; border-radius: 10px; background: #fffafa; color: #c0392b; font-size: 0.9rem; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h2>🧪 Keto Vision 2.5</h2>
    
    <div class="input-group">
        <label>API Key de Google AI Studio:</label>
        <input type="text" id="apiKey" placeholder="Pega tu clave aquí...">
    </div>
    
    <button class="btn-main" id="btnAnalizar" onclick="document.getElementById('fileInput').click()">
        📸 SACAR FOTO AL PLATO
    </button>
    
    <input type="file" id="fileInput" accept="image/*" capture="camera" style="display:none" onchange="analizarImagen(this)">

    <img id="preview" alt="Vista previa de la comida">
    
    <div class="loader" id="loader">⌛ Analizando macros con Gemini 2.5...</div>
    
    <div id="resultado"></div>
</div>

<script>
    // Función principal de análisis
    async function analizarImagen(input) {
        const apiKey = document.getElementById('apiKey').value;
        const resultadoDiv = document.getElementById('resultado');
        const loader = document.getElementById('loader');
        const preview = document.getElementById('preview');
        const btn = document.getElementById('btnAnalizar');

        if (!apiKey) {
            alert("⚠️ Por favor, introduce tu API Key.");
            return;
        }

        if (input.files && input.files[0]) {
            const file = input.files[0];
            
            // 1. Mostrar vista previa
            const reader = new FileReader();
            reader.onload = e => { 
                preview.src = e.target.result; 
                preview.style.display = 'block'; 
            }
            reader.readAsDataURL(file);

            // 2. Preparar UI
            loader.style.display = 'block';
            resultadoDiv.innerHTML = "";
            btn.disabled = true;

            try {
                // 3. Convertir a Base64
                const base64Data = await toBase64(file);
                const base64Content = base64Data.split(',')[1];

                // 4. Configurar llamada a la API (Modelo 2.5 solicitado)
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                
{ text: `Eres un analizador nutricional experto en dieta Cetogénica.
Tu tarea es analizar la imagen y calcular macros siguiendo estrictamente estos pasos:

1. LISTAR: Identifica cada ingrediente y estima su peso en gramos.
2. CALCULAR CARBOS NETOS: Para cada ingrediente, busca los carbohidratos totales y resta la fibra. (Carbos Netos = Totales - Fibra). Esto es crítico para el aguacate, frutos secos y verduras.
3. CALCULAR KCAL: Suma las calorías basadas en la densidad de grasas, proteínas y carbohidratos de cada porción estimada.
4. SER REALISTA: Si la comida parece grasosa o densa (aceites, aguacate, carnes), no subestimes las calorías.

RESPONDE EXCLUSIVAMENTE EN ESTE FORMATO JSON:
{"titulo": "Nombre del plato", "carbos": [suma_de_carbos_netos], "kcal": [suma_de_kcal_totales]}` }

                                { inline_data: { mime_type: "image/jpeg", data: base64Content } }
                            ]
                        }]
                    })
                });

                const data = await response.json();

                // 5. Procesar Respuesta
                if (data.candidates && data.candidates[0].content) {
                    let textoIA = data.candidates[0].content.parts[0].text;
                    
                    // Limpiar Markdown por si la IA lo incluye
                    textoIA = textoIA.replace(/```json/g, "").replace(/```/g, "").trim();
                    
                    try {
                        const resJson = JSON.parse(textoIA);
                        resultadoDiv.innerHTML = `
                            <div class="result-box">
                                <h3 style="margin:0; color:#27ae60;">${resJson.titulo}</h3>
                                <p style="margin:10px 0 5px 0;">🔥 <b>Calorías:</b> ${resJson.kcal} kcal</p>
                                <p style="margin:0;">🍞 <b>Carbos Netos:</b> ${resJson.carbos}g</p>
                            </div>
                        `;
                    } catch (parseError) {
                        resultadoDiv.innerHTML = `<div class="error-box"><b>Error en formato JSON:</b><br>${textoIA}</div>`;
                    }
                } else {
                    resultadoDiv.innerHTML = `<div class="error-box"><b>Respuesta de API:</b><br>${JSON.stringify(data)}</div>`;
                }

            } catch (error) {
                resultadoDiv.innerHTML = `<div class="error-box"><b>Error de conexión:</b><br>${error.message}</div>`;
            } finally {
                loader.style.display = 'none';
                btn.disabled = false;
            }
        }
    }

    // Función auxiliar para conversión Base64
    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
</script>

</body>
</html>
