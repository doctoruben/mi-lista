<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keto Vision Lab - Test</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h2 { color: #c0392b; text-align: center; }
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #27ae60; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #bdc3c7; }
        #resultado { margin-top: 20px; padding: 15px; background: #f9f9f9; border-left: 5px solid #27ae60; white-space: pre-wrap; font-size: 14px; min-height: 100px; overflow-y: auto; }
        #preview { width: 100%; border-radius: 8px; margin-top: 15px; display: none; }
        .loader { text-align: center; display: none; margin: 10px 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>🧪 Lab de Análisis Keto</h2>
    
    <label>Configura tu API Key de Gemini:</label>
    <input type="text" id="apiKey" placeholder="Pega aquí tu AI Studio API Key">
    
    <button onclick="document.getElementById('fileInput').click()">
        📸 CAPTURAR PLATO Y ANALIZAR
    </button>
    
    <input type="file" id="fileInput" accept="image/*" capture="camera" style="display:none" onchange="analizarImagen(this)">

    <img id="preview" alt="Vista previa">
    
    <div class="loader" id="loader">⌛ El médico IA está analizando la imagen...</div>
    
    <div id="resultado">El resultado del análisis aparecerá aquí...</div>
</div>
<script>
    async function analizarImagen(input) {
        const apiKey = document.getElementById('apiKey').value;
        const resultadoDiv = document.getElementById('resultado');
        const loader = document.getElementById('loader');

        if (!apiKey) { alert("Pega tu API Key"); return; }

        if (input.files && input.files[0]) {
            loader.style.display = 'block';
            resultadoDiv.innerText = "Calculando macros...";

            try {
                const base64Data = await toBase64(input.files[0]);
                const base64Content = base64Data.split(',')[1];

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Analiza la imagen de comida y responde ÚNICAMENTE con un objeto JSON (sin Markdown, sin texto extra) con este formato: {\"titulo\": \"Nombre del plato\", \"carbos\": 0, \"kcal\": 0}. Sé realista con las porciones." },
                                { inline_data: { mime_type: "image/jpeg", data: base64Content } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    let textoLimpio = data.candidates[0].content.parts[0].text;
                    
                    // Limpieza por si la IA pone bloques de código markdown ```json ... ```
                    textoLimpio = textoLimpio.replace(/```json|```/g, "").trim();
                    
                    const resJson = JSON.parse(textoLimpio);

                    // Formato visual igual al de tu App
                    resultadoDiv.innerHTML = `
                        <div style="border: 2px solid #27ae60; border-radius: 10px; padding: 15px;">
                            <h3 style="margin-top:0">${resJson.titulo}</h3>
                            <p>🍞 <b>Carbohidratos:</b> ${resJson.carbos}g</p>
                            <p>🔥 <b>Calorías:</b> ${resJson.kcal} kcal</p>
                            <hr>
                            <small>¿Es correcto? Ahora podrías darle a "Añadir"</small>
                        </div>
                    `;
                    
                    console.log("Datos para tu base de datos:", resJson);
                } 

            } catch (error) {
                resultadoDiv.innerText = "Error: " + error.message;
            } finally {
                loader.style.display = 'none';
            }
        }
    }

  </script>            
</body>
</html>
