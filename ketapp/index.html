<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keto AI Tracker 🥑</title>
    <style>
        :root { --keto: #27ae60; --dark: #1a1a1a; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        
        .dashboard { background: var(--dark); color: white; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        .progress-bar { background: #333; border-radius: 10px; height: 14px; margin: 15px 0; overflow: hidden; }
        #barFill { background: var(--keto); height: 100%; width: 0%; transition: 0.8s ease; }
        
        textarea { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; font-size: 1rem; resize: none; outline: none; }
        .btn-ia { background: var(--dark); color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; cursor: pointer; margin-top: 10px; font-weight: bold; font-size: 1rem; }
        
        .result-card { display: none; margin-top: 20px; padding: 15px; border-radius: 12px; background: #f0fff4; border: 1px solid #c6f6d5; }
        .btn-add { background: var(--keto); color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; cursor: pointer; margin-top: 10px; font-weight: bold; }

        .food-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        #loader { display: none; text-align: center; padding: 15px; color: var(--keto); font-weight: bold; }
        .settings-link { display: block; text-align: center; margin-top: 20px; font-size: 0.7rem; color: #bbb; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="dashboard">
        <h2 style="margin:0">Mi Día Keto</h2>
        <div class="progress-bar"><div id="barFill"></div></div>
        <p style="margin:0"><span id="totalCarbs">0</span> / 30g Carbs Netos</p>
    </div>

    <textarea id="foodInput" rows="3" placeholder="Ej: '2 huevos fritos y un aguacate'"></textarea>
    <button class="btn-ia" onclick="askGemini()">Analizar con IA ✨</button>
    
    <div id="loader">Gemini analizando...</div>

    <div id="resultCard" class="result-card">
        <h4 id="resName" style="margin:0"></h4>
        <div style="margin:10px 0; display:flex; justify-content: space-between; font-size: 0.85rem;">
            <span>Carbs Netos: <b id="resCarbs"></b>g</span>
            <span>Grasas: <b id="resFat"></b>g</span>
            <span>Proteína: <b id="resProt"></b>g</span>
        </div>
        <button class="btn-add" onclick="addFood()">Añadir al registro</button>
    </div>

    <div id="dailyList" style="margin-top:20px;"></div>
    
    <div style="text-align: center; margin-top: 20px;">
        <button onclick="resetDay()" style="color:red; border:none; background:none; cursor:pointer; font-size:0.8rem;">Reiniciar Día</button>
    </div>

    <span class="settings-link" onclick="updateApiKey()">⚙️ Configurar API Key</span>
</div>

<script>
    // --- CONFIGURACIÓN DEL MODELO ---
    const MODEL_NAME = "gemini-pro"; 
    // --------------------------------

    let dailyCarbs = 0;
    const LIMIT = 30;
    let lastFoundFood = null;

    window.onload = () => {
        if (!localStorage.getItem('GEMINI_KEY')) updateApiKey();
        loadDailyData();
    };

    function updateApiKey() {
        const key = prompt("Introduce tu Gemini API Key de Google AI Studio:");
        if (key) localStorage.setItem('GEMINI_KEY', key);
    }

    async function askGemini() {
        const apiKey = localStorage.getItem('GEMINI_KEY');
        const text = document.getElementById('foodInput').value.trim();
        
        if (!apiKey) { updateApiKey(); return; }
        if (!text) return;

        document.getElementById('loader').style.display = 'block';
        document.getElementById('resultCard').style.display = 'none';

        try {
            // Usamos la estructura que te funcionó en el otro código
            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Analiza: ${text}` }] }],
                        systemInstruction: { 
                            parts: [{ 
                                text: 'Eres un experto nutricionista Keto. Responde SOLO con un objeto JSON (sin markdown): {"nombre": "resumen", "carbs_netos": numero, "grasa": numero, "proteina": numero}' 
                            }] 
                        },
                        generationConfig: { 
                            temperature: 0.1,
                            maxOutputTokens: 200 
                        }
                    })
                }
            );

            const data = await response.json();

            if (data.error) throw new Error(data.error.message);

            const rawText = data.candidates[0].content.parts[0].text;
            // Limpiamos la respuesta por si la IA añade bloques de código
            const cleanJson = rawText.replace(/```json|```/g, "").trim();
            const res = JSON.parse(cleanJson);

            lastFoundFood = { 
                name: res.nombre, 
                carbs: res.carbs_netos, 
                fat: res.grasa, 
                prot: res.proteina 
            };

            document.getElementById('resName').innerText = res.nombre;
            document.getElementById('resCarbs').innerText = res.carbs_netos;
            document.getElementById('resFat').innerText = res.grasa;
            document.getElementById('resProt').innerText = res.proteina;
            document.getElementById('resultCard').style.display = 'block';

        } catch (e) {
            alert("ERROR: " + e.message);
            console.error(e);
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }

    function addFood() {
        if (!lastFoundFood) return;
        const saved = JSON.parse(localStorage.getItem('ketoData')) || [];
        saved.push(lastFoundFood);
        localStorage.setItem('ketoData', JSON.stringify(saved));
        renderItem(lastFoundFood);
        updateProgress();
        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('foodInput').value = '';
    }

    function renderItem(item) {
        const list = document.getElementById('dailyList');
        const div = document.createElement('div');
        div.className = 'food-item';
        div.innerHTML = `<span>${item.name}</span> <b>${item.carbs}g</b>`;
        list.prepend(div);
        dailyCarbs += parseFloat(item.carbs);
    }

    function loadDailyData() {
        const saved = JSON.parse(localStorage.getItem('ketoData')) || [];
        saved.forEach(renderItem);
        updateProgress();
    }

    function updateProgress() {
        const percent = Math.min((dailyCarbs / LIMIT) * 100, 100);
        document.getElementById('barFill').style.width = percent + '%';
        document.getElementById('totalCarbs').innerText = dailyCarbs.toFixed(1);
        document.getElementById('barFill').style.background = dailyCarbs > LIMIT ? 'var(--danger)' : 'var(--keto)';
    }

    function resetDay() {
        if(confirm("¿Borrar todo el día?")) {
            localStorage.removeItem('ketoData');
            location.reload();
        }
    }
</script>

</body>
</html>
