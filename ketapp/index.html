<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keto AI Assistant 🥑</title>
    <style>
        :root { --keto: #27ae60; --dark: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        .dashboard { background: var(--dark); color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: center; }
        .progress-bar { background: #333; border-radius: 10px; height: 12px; margin: 15px 0; overflow: hidden; }
        #barFill { background: var(--keto); height: 100%; width: 0%; transition: 0.8s ease; }
        textarea { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; font-size: 1rem; resize: none; outline: none; }
        textarea:focus { border-color: var(--keto); }
        .btn-ia { background: var(--dark); color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .result-card { display: none; margin-top: 20px; padding: 15px; border-radius: 12px; background: #fafffa; border: 1px solid #dcfce7; }
        .btn-add { background: var(--keto); color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .food-item { display: flex; justify-content: space-between; background: white; padding: 10px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        #loader { display: none; text-align: center; margin-top: 10px; color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div class="dashboard">
        <h2 style="margin:0">Keto AI Manager</h2>
        <div class="progress-bar"><div id="barFill"></div></div>
        <p style="margin:0"><span id="totalCarbs">0</span> / 30g Carbs Netos</p>
    </div>

    <textarea id="foodInput" rows="3" placeholder="Ej: 'Me he comido un aguacate pequeño y 3 lonchas de jamón serrano'"></textarea>
    <button class="btn-ia" onclick="askGemini()">Analizar con Inteligencia Artificial</button>
    
    <div id="loader">Gemini está pensando... ✨</div>

    <div id="resultCard" class="result-card">
        <h4 id="resName" style="margin:0"></h4>
        <div style="margin:10px 0; display:flex; justify-content: space-between;">
            <span>Carbs Netos: <b id="resCarbs"></b>g</span>
            <span>Grasas: <b id="resFat"></b>g</span>
        </div>
        <button class="btn-add" onclick="addFood()">Aceptar y Añadir al Día</button>
    </div>

    <div id="dailyList" style="margin-top:20px;"></div>
    <button onclick="resetDay()" style="margin-top:20px; border:none; background:none; color:red; cursor:pointer; font-size:0.8rem;">Reiniciar día</button>
</div>

<script>
    // --- COLOCA AQUÍ TU API KEY DE GOOGLE AI STUDIO ---
    const GEMINI_API_KEY = 'AIzaSyCZvTX30M4qYnGoafQYjQUBgkhZGf0_vW8';
    // --------------------------------------------------

    let dailyCarbs = 0;
    const LIMIT = 30;
    let lastFoundFood = null;

    window.onload = () => {
        const saved = JSON.parse(localStorage.getItem('ketoData')) || [];
        saved.forEach(f => renderFoodItem(f.name, f.carbs));
        updateProgress();
    };

    async function askGemini() {
        const text = document.getElementById('foodInput').value;
        if(!text) return;

        document.getElementById('loader').style.display = 'block';
        document.getElementById('resultCard').style.display = 'none';

        const prompt = `Actúa como un experto en nutrición cetogénica. 
        Analiza lo siguiente: "${text}". 
        Devuelve SOLO un objeto JSON con estos campos estrictos: 
        { "nombre": "resumen corto", "carbs_netos": numero, "grasa": numero, "proteina": numero }. 
        Si el usuario no especifica cantidad, asume una porción normal. 
        Calcula carbohidratos netos (carbohidratos menos fibra).`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const data = await response.json();
            const rawResponse = data.candidates[0].content.parts[0].text;
            
            // Limpiar la respuesta para asegurar que es JSON puro
            const jsonStr = rawResponse.replace(/```json|```/g, "").trim();
            const result = JSON.parse(jsonStr);

            lastFoundFood = {
                name: result.nombre,
                carbs: result.carbs_netos
            };

            document.getElementById('resName').innerText = result.nombre;
            document.getElementById('resCarbs').innerText = result.carbs_netos;
            document.getElementById('resFat').innerText = result.grasa;
            document.getElementById('resultCard').style.display = 'block';

        } catch (error) {
            console.error(error);
            alert("Error al conectar con la IA. Revisa tu API Key.");
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }

    function addFood() {
        if(!lastFoundFood) return;
        const saved = JSON.parse(localStorage.getItem('ketoData')) || [];
        saved.push(lastFoundFood);
        localStorage.setItem('ketoData', JSON.stringify(saved));
        renderFoodItem(lastFoundFood.name, lastFoundFood.carbs);
        updateProgress();
        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('foodInput').value = '';
    }

    function renderFoodItem(name, carbs) {
        const list = document.getElementById('dailyList');
        const div = document.createElement('div');
        div.className = 'food-item';
        div.innerHTML = `<span>${name}</span> <b>${carbs}g</b>`;
        list.prepend(div);
        dailyCarbs += parseFloat(carbs);
    }

    function updateProgress() {
        const percent = Math.min((dailyCarbs / LIMIT) * 100, 100);
        document.getElementById('barFill').style.width = percent + '%';
        document.getElementById('totalCarbs').innerText = dailyCarbs.toFixed(1);
        document.getElementById('barFill').style.background = dailyCarbs > LIMIT ? '#e74c3c' : '#27ae60';
    }

    function resetDay() {
        localStorage.removeItem('ketoData');
        location.reload();
    }
</script>

</body>
</html>
