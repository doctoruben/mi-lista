<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keto Tracker</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    
    <style>
        :root { --keto: #27ae60; --dark: #1a1a1a; --danger: #e74c3c; --gray: #f4f4f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gray); display: flex; justify-content: center; padding: 15px; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; position: relative; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-icon { background: #eee; border: none; padding: 10px; border-radius: 12px; cursor: pointer; font-size: 1.2rem; }

        .dashboard { background: var(--dark); color: white; padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 20px; }
        .progress-bar { background: #333; border-radius: 10px; height: 10px; margin: 10px 0; overflow: hidden; }
        #barFill { background: var(--keto); height: 100%; width: 0%; transition: 0.8s ease; }
        
        textarea { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 15px; box-sizing: border-box; font-size: 1rem; resize: none; outline: none; }
        .btn-main { background: var(--dark); color: white; border: none; padding: 15px; width: 100%; border-radius: 15px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        
        .result-card { display: none; margin-top: 20px; padding: 15px; border-radius: 15px; background: #f0fff4; border: 1px solid #c6f6d5; }
        .food-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .delete-x { color: #ccc; cursor: pointer; font-weight: bold; padding: 5px; }
        .delete-x:hover { color: var(--danger); }

        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; }
        .modal-content { background:white; padding:20px; border-radius:20px; width:85%; max-width:320px; max-height: 70vh; overflow-y: auto; }
        .history-row { display: flex; justify-content: space-between; padding: 10px; margin-bottom: 5px; border-radius: 8px; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="btn-icon" onclick="toggleModal('historyModal')">📅</button>
        <b id="displayDate"></b>
        <button class="btn-icon" onclick="toggleModal('configModal')">⚙️</button>
    </div>

    <div class="dashboard">
        <div class="progress-bar"><div id="barFill"></div></div>
        <div style="display:flex; justify-content: space-around; font-size: 0.9rem;">
            <div>Carbs: <b id="totalCarbs">0</b>/30g</div>
            <div>Kcal: <b id="totalKcal">0</b></div>
        </div>
    </div>

    <textarea id="foodInput" rows="2" placeholder="¿Qué comiste? Ej: 2 huevos..."></textarea>
    <button class="btn-main" onclick="analizarIA()">Analizar con IA ✨</button>
    <div id="status" style="text-align:center; font-size:0.8rem; color:#888; margin-top:5px;"></div>

    <div id="resultCard" class="result-card">
        <h4 id="resName" style="margin:0"></h4>
        <p id="resNutri" style="margin:10px 0; font-size:0.9rem;"></p>
        <button onclick="guardarEnFirebase()" style="width:100%; background:var(--keto); color:white; border:none; padding:10px; border-radius:10px; cursor:pointer; font-weight:bold;">Añadir Alimento</button>
    </div>

    <div id="dailyList" style="margin-top:20px;"></div>
</div>

<div id="historyModal" class="modal">
    <div class="modal-content">
        <h3>Historial por Días</h3>
        <div id="historyContent"></div>
        <button onclick="toggleModal('historyModal')" style="width:100%; margin-top:15px; padding:10px; border-radius:10px; border:1px solid #ccc; background:none;">Cerrar</button>
    </div>
</div>

<div id="configModal" class="modal">
    <div class="modal-content">
        <h3>Configuración</h3>
        <button class="btn-main" onclick="cambiarKey()">🔑 Cambiar Gemini API Key</button>
        <button class="btn-main" style="background:var(--danger)" onclick="resetFirebase()">🗑️ Borrar Todo el Historial</button>
        <button onclick="toggleModal('configModal')" style="width:100%; margin-top:15px; border:none; background:none; text-decoration:underline;">Cerrar</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBnmTgJYFsFAFWnGyaDZRUxOZGnL5SE1QA",
        authDomain: "lista-compra-9d6f5.firebaseapp.com",
        databaseURL: "https://lista-compra-9d6f5-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "lista-compra-9d6f5",
        storageBucket: "lista-compra-9d6f5.firebasestorage.app",
        messagingSenderId: "241322134457",
        appId: "1:241322134457:web:1b765857911f94d69cc468"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    const today = new Date().toISOString().split('T')[0];
    let tempFood = null;

    window.onload = () => {
        document.getElementById('displayDate').innerText = new Date().toLocaleDateString('es-ES', {day:'numeric', month:'short'});
        if (!localStorage.getItem('GEMINI_KEY')) cambiarKey();
        escucharDatos();
    };

    function toggleModal(id) {
        const m = document.getElementById(id);
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        if(id === 'historyModal' && m.style.display === 'flex') cargarHistorial();
    }

    function cambiarKey() {
        const k = prompt("Introduce tu Gemini API Key:");
        if(k) localStorage.setItem('GEMINI_KEY', k.trim());
    }

    async function analizarIA() {
        const key = localStorage.getItem('GEMINI_KEY');
        const text = document.getElementById('foodInput').value;
        if(!text) return;
        
        document.getElementById('status').innerText = "Analizando...";
        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
            const res = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({contents: [{parts: [{text: `Responde solo JSON: {"n": "nombre", "c": 0.0, "k": 0}. Analiza: ${text}`}]}]})
            });
            const data = await res.json();
            const json = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{.*\}/s)[0]);
            
            tempFood = json;
            document.getElementById('resName').innerText = json.n;
            document.getElementById('resNutri').innerText = `${json.c}g Carbohidratos | ${json.k} Calorías`;
            document.getElementById('resultCard').style.display = 'block';
            document.getElementById('status').innerText = "";
        } catch(e) { 
            document.getElementById('status').innerText = "Error en la IA";
        }
    }

    function guardarEnFirebase() {
        if(tempFood) {
            db.ref(`keto_logs/${today}`).push(tempFood);
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('foodInput').value = "";
            tempFood = null;
        }
    }

    function eliminarAlimento(id) {
        if(confirm("¿Eliminar?")) db.ref(`keto_logs/${today}/${id}`).remove();
    }

    function escucharDatos() {
        db.ref(`keto_logs/${today}`).on('value', snap => {
            const data = snap.val() || {};
            const list = document.getElementById('dailyList');
            list.innerHTML = "";
            let tc = 0, tk = 0;

            Object.keys(data).reverse().forEach(id => {
                const item = data[id];
                tc += parseFloat(item.c); tk += parseInt(item.k);
                list.innerHTML += `<div class="food-item">
                    <div><b>${item.n}</b><br><small>${item.c}g carbs | ${item.k} kcal</small></div>
                    <div class="delete-x" onclick="eliminarAlimento('${id}')">✕</div>
                </div>`;
            });

            document.getElementById('totalCarbs').innerText = tc.toFixed(1);
            document.getElementById('totalKcal').innerText = tk;
            const p = Math.min((tc / 30) * 100, 100);
            document.getElementById('barFill').style.width = p + '%';
            document.getElementById('barFill').style.background = tc > 30 ? 'var(--danger)' : 'var(--keto)';
        });
    }

    function cargarHistorial() {
        const container = document.getElementById('historyContent');
        container.innerHTML = "Cargando...";
        db.ref('keto_logs').once('value', snap => {
            const all = snap.val() || {};
            container.innerHTML = "";
            Object.keys(all).sort().reverse().forEach(date => {
                let dc = 0; Object.values(all[date]).forEach(f => dc += f.c);
                const color = dc > 30 ? '#e74c3c' : '#27ae60';
                container.innerHTML += `<div class="history-row" style="background:${color}">
                    <span>${date}</span><span>${dc.toFixed(1)}g</span>
                </div>`;
            });
        });
    }

    function resetFirebase() {
        if(confirm("¿BORRAR TODO EL HISTORIAL permanentemente?")) db.ref('keto_logs').remove();
    }
</script>
</body>
</html>
