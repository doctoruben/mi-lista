<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keto Tracker Pro (Google Auth)</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
    
    <style>
        :root { --keto: #27ae60; --dark: #1a1a1a; --danger: #e74c3c; --gray: #f4f4f9; --white: #ffffff; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--gray); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        .container { background: var(--white); padding: 25px; border-radius: 28px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 400px; display: none; }
        
        /* Pantalla de Login */
        #loginScreen { text-align: center; background: white; padding: 40px; border-radius: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 320px; }
        .google-btn { background: white; border: 1px solid #ddd; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }

        /* App UI */
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .nav-btn { background: #f0f0f0; border: none; font-size: 1.2rem; cursor: pointer; padding: 10px; border-radius: 12px; }
        .dashboard { background: var(--dark); color: white; padding: 22px; border-radius: 20px; text-align: center; margin-bottom: 20px; }
        .progress-bar { background: #333; border-radius: 10px; height: 12px; margin: 15px 0; overflow: hidden; }
        #barFill { background: var(--keto); height: 100%; width: 0%; transition: 1s ease; }
        textarea { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 16px; box-sizing: border-box; font-size: 1rem; resize: none; outline: none; }
        .btn-ia { background: var(--dark); color: white; border: none; padding: 16px; width: 100%; border-radius: 16px; cursor: pointer; margin-top: 12px; font-weight: bold; }
        .result-card { display: none; margin-top: 20px; padding: 18px; border-radius: 16px; background: #f0fff4; border: 1px solid #c6f6d5; }
        .food-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; border-bottom: 1px solid #f0f0f0; }
        .delete-btn { color: #ccc; cursor: pointer; font-size: 1.1rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 25px; border-radius: 24px; width: 90%; max-width: 340px; }
        .history-day { display: flex; justify-content: space-between; padding: 10px; border-radius: 10px; margin-bottom: 5px; color: white; }
    </style>
</head>
<body>

<div id="loginScreen">
    <h2 style="margin-top:0">Keto AI Tracker</h2>
    <p style="color:#666; font-size:0.9rem; margin-bottom:25px;">Inicia sesión para guardar tus datos en la nube de forma segura.</p>
    <button class="google-btn" onclick="login()">
        <img src="https://www.google.com/favicon.ico" width="18"> Entrar con Google
    </button>
</div>

<div class="container" id="appContent">
    <div class="top-nav">
        <button class="nav-btn" onclick="toggleModal('historyModal')">📅</button>
        <div id="dateLabel" style="font-weight: 800;"></div>
        <button class="nav-btn" onclick="toggleModal('settingsModal')">⚙️</button>
    </div>

    <div class="dashboard">
        <div class="progress-bar"><div id="barFill"></div></div>
        <div style="display:flex; justify-content: space-around;">
            <div><small>Carbs</small><div id="totalCarbs">0/30g</div></div>
            <div><small>Calorías</small><div id="totalKcal">0</div></div>
        </div>
    </div>

    <textarea id="foodInput" rows="2" placeholder="¿Qué has comido?"></textarea>
    <button class="btn-ia" onclick="askGemini()">Analizar Nutrición ✨</button>

    <div id="resultCard" class="result-card">
        <h4 id="resName" style="margin:0"></h4>
        <p id="resDetails" style="font-size: 0.85rem; margin: 10px 0;"></p>
        <button style="width:100%; background:var(--keto); color:white; border:none; padding:12px; border-radius:12px; cursor:pointer;" onclick="addFood()">Confirmar</button>
    </div>

    <div id="dailyList" style="margin-top:20px;"></div>
</div>

<div id="historyModal" class="modal"><div class="modal-content"><h3>Histórico</h3><div id="historyContainer"></div><button onclick="toggleModal('historyModal')" style="width:100%; margin-top:15px;">Cerrar</button></div></div>
<div id="settingsModal" class="modal"><div class="modal-content"><h3>Ajustes</h3><button class="btn-ia" onclick="setNewKey()">🔑 Cambiar Gemini Key</button><button class="btn-ia" style="background:#ddd; color:black;" onclick="logout()">Cerrar Sesión</button><button onclick="toggleModal('settingsModal')" style="width:100%; margin-top:15px; border:none; background:none;">Volver</button></div></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBnmTgJYFsFAFWnGyaDZRUxOZGnL5SE1QA",
        authDomain: "lista-compra-9d6f5.firebaseapp.com",
        databaseURL: "https://lista-compra-9d6f5-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "lista-compra-9d6f5",
        storageBucket: "lista-compra-9d6f5.firebasestorage.app",
        messagingSenderId: "241322134457",
        appId: "1:241322134457:web:1b765857911f94d69cc468"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    const LIMIT_CARBS = 30;
    const todayISO = new Date().toISOString().split('T')[0];
    let lastFoundFood = null;

    // Control de Sesión
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
            syncFromFirebase();
        } else {
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('appContent').style.display = 'none';
        }
    });

    function login() { auth.signInWithPopup(provider); }
    function logout() { auth.signOut(); location.reload(); }

    window.onload = () => {
        document.getElementById('dateLabel').innerText = new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
        if (!localStorage.getItem('KETO_KEY_FINAL')) setNewKey();
    };

    function toggleModal(id) {
        const m = document.getElementById(id);
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        if(id === 'historyModal' && m.style.display === 'flex') loadHistory();
    }

    function setNewKey() {
        const k = prompt("API Key de Gemini:");
        if(k) localStorage.setItem('KETO_KEY_FINAL', k.trim());
    }

    async function askGemini() {
        const key = localStorage.getItem('KETO_KEY_FINAL');
        const text = document.getElementById('foodInput').value.trim();
        if(!text) return;
        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
            const res = await fetch(url, { method: 'POST', body: JSON.stringify({contents: [{parts: [{text: `Responde solo JSON: {"n": "nombre", "c": 0.0, "k": 0}. Analiza: ${text}`}]}]}) });
            const data = await res.json();
            const json = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{.*\}/s)[0]);
            lastFoundFood = json;
            document.getElementById('resName').innerText = json.n;
            document.getElementById('resDetails').innerText = `${json.c}g Carbs | ${json.k} Kcal`;
            document.getElementById('resultCard').style.display = 'block';
        } catch(e) { alert("Error IA"); }
    }

    function addFood() {
        if(lastFoundFood) db.ref(`keto_logs/${todayISO}`).push(lastFoundFood);
        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('foodInput').value = "";
    }

    function deleteFood(id) { if(confirm("¿Borrar?")) db.ref(`keto_logs/${todayISO}/${id}`).remove(); }

    function syncFromFirebase() {
        db.ref(`keto_logs/${todayISO}`).on('value', snap => {
            const data = snap.val() || {};
            const list = document.getElementById('dailyList');
            list.innerHTML = "";
            let tc = 0, tk = 0;
            Object.keys(data).reverse().forEach(id => {
                const i = data[id]; tc += i.c; tk += i.k;
                list.innerHTML += `<div class="food-item"><div><b>${i.n}</b><br><small>${i.c}g | ${i.k} kcal</small></div><div class="delete-btn" onclick="deleteFood('${id}')">✕</div></div>`;
            });
            document.getElementById('totalCarbs').innerText = tc.toFixed(1) + "/30g";
            document.getElementById('totalKcal').innerText = tk;
            const p = Math.min((tc / LIMIT_CARBS) * 100, 100);
            document.getElementById('barFill').style.width = p + '%';
            document.getElementById('barFill').style.background = tc > LIMIT_CARBS ? 'var(--danger)' : 'var(--keto)';
        });
    }

    function loadHistory() {
        const container = document.getElementById('historyContainer');
        db.ref(`keto_logs`).once('value', snap => {
            const all = snap.val() || {};
            container.innerHTML = "";
            Object.keys(all).sort().reverse().forEach(date => {
                let dc = 0; Object.values(all[date]).forEach(f => dc += f.c);
                container.innerHTML += `<div class="history-day" style="background:${dc<=30?'#27ae60':'#e74c3c'}"><span>${date}</span><span>${dc.toFixed(1)}g</span></div>`;
            });
        });
    }
</script>
</body>
</html>
