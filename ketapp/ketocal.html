<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keto Tracker</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        :root { --keto: #27ae60; --dark: #1a1a1a; --danger: #e74c3c; --gray: #f4f4f9; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--gray); display: flex; justify-content: center; padding: 15px; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-icon { background: #eee; border: none; padding: 12px; border-radius: 14px; cursor: pointer; }
        .dashboard { background: var(--dark); color: white; padding: 20px; border-radius: 22px; text-align: center; margin-bottom: 20px; }
        .progress-bar { background: #333; border-radius: 10px; height: 10px; margin: 15px 0; overflow: hidden; }
        #barFill { background: var(--keto); height: 100%; width: 0%; transition: 1s ease; }
        textarea { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 15px; box-sizing: border-box; font-size: 1rem; resize: none; outline: none; }
        .btn-main { background: var(--dark); color: white; border: none; padding: 15px; width: 100%; border-radius: 15px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .result-card { display: none; margin-top: 20px; padding: 15px; border-radius: 15px; background: #f0fff4; border: 1px solid #c6f6d5; }
        .food-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:100; align-items:center; justify-content:center; backdrop-filter: blur(5px); }
        .modal-content { background:white; padding:20px; border-radius:24px; width:90%; max-width:350px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; margin-top: 15px; }
        .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 0.8rem; position: relative; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; position: absolute; bottom: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="btn-icon" onclick="toggleModal('historyModal')">📅</button>
        <b id="displayDate"></b>
        <button class="btn-icon" onclick="toggleModal('configModal')">⚙️</button>
    </div>

    <div class="dashboard">
        <div class="progress-bar"><div id="barFill"></div></div>
        <div style="display:flex; justify-content: space-around; font-size: 0.9rem;">
            <div>Carbs: <b id="totalCarbs">0</b>/30g</div>
            <div>Kcal: <b id="totalKcal">0</b></div>
        </div>
    </div>

    <textarea id="foodInput" rows="2" placeholder="Ej: ensalada césar..."></textarea>
    <button class="btn-main" onclick="analizarIA()">Analizar Plato ✨</button>
    <div id="status" style="text-align:center; font-size:0.75rem; color:#888; margin-top:8px; min-height: 15px;"></div>

    <div id="resultCard" class="result-card">
        <h4 id="resName" style="margin:0"></h4>
        <p id="resNutri" style="margin:10px 0; font-size:0.9rem;"></p>
        <button onclick="guardar()" style="width:100%; background:var(--keto); color:white; border:none; padding:12px; border-radius:12px; cursor:pointer; font-weight:bold;">Añadir</button>
    </div>

    <div id="dailyList" style="margin-top:20px;"></div>
</div>

<div id="historyModal" class="modal"><div class="modal-content"><h3 id="calendarMonthName"></h3><div class="calendar-grid" id="calendarDays"></div><button onclick="toggleModal('historyModal')" style="width:100%; margin-top:20px; border:none; background:#eee; padding:10px; border-radius:10px;">Cerrar</button></div></div>
<div id="configModal" class="modal"><div class="modal-content"><h3>Ajustes</h3><button class="btn-main" onclick="cambiarKey()">🔑 Configurar API Key</button><button onclick="toggleModal('configModal')" style="width:100%; margin-top:15px; border:none; background:none; text-decoration:underline;">Cerrar</button></div></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBnmTgJYFsFAFWnGyaDZRUxOZGnL5SE1QA",
        authDomain: "lista-compra-9d6f5.firebaseapp.com",
        databaseURL: "https://lista-compra-9d6f5-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "lista-compra-9d6f5",
        storageBucket: "lista-compra-9d6f5.firebasestorage.app",
        messagingSenderId: "241322134457",
        appId: "1:241322134457:web:1b765857911f94d69cc468"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const todayISO = new Date().toISOString().split('T')[0];
    let tempFood = null;

    window.onload = () => {
        document.getElementById('displayDate').innerText = new Date().toLocaleDateString('es-ES', {day:'numeric', month:'short'});
        escucharFirebase();
    };

    function toggleModal(id) {
        const m = document.getElementById(id);
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        if(id === 'historyModal' && m.style.display === 'flex') generarCalendario();
    }

    function cambiarKey() {
        const k = prompt("Pega aquí tu API Key:");
        if(k) localStorage.setItem('GEMINI_KEY', k.trim());
    }

    async function analizarIA() {
        const key = localStorage.getItem('GEMINI_KEY');
        const text = document.getElementById('foodInput').value.trim();
        const status = document.getElementById('status');
        
        if(!key) { alert("Configura la Key en ⚙️"); return; }
        if(!text) return;

        status.innerText = "Analizando...";
        document.getElementById('resultCard').style.display = 'none';

        try {
            // Estructura de mensaje exacta para Gemini 1.5
            const payload = {
                contents: [{
                    parts: [{
                        text: `Analiza este alimento: "${text}". Devuelve SOLO un JSON así: {"n":"nombre","c":0.0,"k":0}`
                    }]
                }]
            };

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            
            if (data.error) throw new Error(data.error.message);

            let txt = data.candidates[0].content.parts[0].text;
            // Limpiar por si la IA devuelve markdown
            txt = txt.replace(/```json/g, "").replace(/```/g, "").trim();
            
            tempFood = JSON.parse(txt);
            document.getElementById('resName').innerText = tempFood.n;
            document.getElementById('resNutri').innerText = `${tempFood.c}g Carbs | ${tempFood.k} Kcal`;
            document.getElementById('resultCard').style.display = 'block';
            status.innerText = "";

        } catch (err) {
            console.error(err);
            status.innerText = "Error: " + err.message;
        }
    }

    function guardar() {
        if(tempFood) {
            db.ref(`keto_logs/${todayISO}`).push(tempFood);
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('foodInput').value = "";
            tempFood = null;
        }
    }

    function escucharFirebase() {
        db.ref(`keto_logs/${todayISO}`).on('value', snap => {
            const data = snap.val() || {};
            const list = document.getElementById('dailyList'); list.innerHTML = "";
            let tc = 0, tk = 0;
            Object.keys(data).reverse().forEach(id => {
                const item = data[id]; tc += parseFloat(item.c || 0); tk += parseInt(item.k || 0);
                list.innerHTML += `<div class="food-item"><div><b>${item.n}</b><br><small>${item.c}g | ${item.k} kcal</small></div><div style="color:#ccc; cursor:pointer;" onclick="db.ref('keto_logs/${todayISO}/${id}').remove()">✕</div></div>`;
            });
            document.getElementById('totalCarbs').innerText = tc.toFixed(1);
            document.getElementById('totalKcal').innerText = tk;
            const p = Math.min((tc / 30) * 100, 100);
            document.getElementById('barFill').style.width = p + '%';
            document.getElementById('barFill').style.background = tc > 30 ? 'var(--danger)' : 'var(--keto)';
        });
    }

    async function generarCalendario() {
        const grid = document.getElementById('calendarDays');
        const now = new Date();
        document.getElementById('calendarMonthName').innerText = now.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
        const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
        const offset = firstDay === 0 ? 6 : firstDay - 1;
        const snap = await db.ref('keto_logs').once('value');
        const all = snap.val() || {};
        grid.innerHTML = "LMaMiJuViSaDo".split(/(?=[A-Z])/).map(d => `<div style="font-size:0.7rem;font-weight:bold;color:#999">${d}</div>`).join('');
        for(let i=0; i<offset; i++) grid.innerHTML += '<div></div>';
        for(let d=1; d<=daysInMonth; d++){
            const ds = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            let dot = "";
            if(all[ds]){
                let c = 0; Object.values(all[ds]).forEach(v => c += parseFloat(v.c || 0));
                dot = `<div class="status-dot" style="background:${c>30?'var(--danger)':'var(--keto)'}"></div>`;
            }
            grid.innerHTML += `<div class="calendar-day">${d}${dot}</div>`;
        }
    }
</script>
</body>
</html>
