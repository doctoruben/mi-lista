<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador BOE Directo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-4 font-sans text-sm flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white rounded-xl shadow-md p-6">
        <h1 class="text-xl font-bold text-blue-950 mb-1 text-center">⚖️ Acceso Directo BOE</h1>
        <p class="text-center text-xs text-gray-400 mb-6">Salto de restricciones por enlace directo</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">¿Qué buscas?</label>
                <select id="categoria" onchange="guardarPreferencia()" class="w-full p-3 border rounded-lg bg-gray-50 text-gray-800 font-medium outline-none focus:ring-2 focus:ring-blue-600">
                    <option value="I">Inmuebles (Pisos, Casas, Locales)</option>
                    <option value="V">Vehículos (Coches, Motos)</option>
                    <option value="M">Bienes Muebles (Maquinaria, Objetos)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">¿En qué provincia?</label>
                <select id="provincia" onchange="guardarPreferencia()" class="w-full p-3 border rounded-lg bg-gray-50 text-gray-800 font-medium outline-none focus:ring-2 focus:ring-blue-600">
                    <option value="28">Madrid</option>
                    <option value="08">Barcelona</option>
                    <option value="46">Valencia</option>
                    <option value="41">Sevilla</option>
                    <option value="29">Málaga</option>
                    <option value="35">Las Palmas</option>
                    <option value="50">Zaragoza</option>
                </select>
            </div>

            <button onclick="redirigirAlBoe()" class="w-full bg-blue-600 text-white p-3.5 rounded-lg font-bold hover:bg-blue-700 transition-colors shadow-md text-base">
                🚀 Ver Subastas en el BOE
            </button>
        </div>
    </div>

    <script>
        // Recupera los datos guardados en el móvil al abrir la página
        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem("cat_boe_dir")) document.getElementById('categoria').value = localStorage.getItem("cat_boe_dir");
            if (localStorage.getItem("prov_boe_dir")) document.getElementById('provincia').value = localStorage.getItem("prov_boe_dir");
        });

        // Guarda tu selección en el almacenamiento local del móvil
        function guardarPreferencia() {
            localStorage.setItem("cat_boe_dir", document.getElementById('categoria').value);
            localStorage.setItem("prov_boe_dir", document.getElementById('provincia').value);
        }

        // Genera la redirección limpia que el BOE acepta sin cookies previas
        function redirigirAlBoe() {
            const cat = document.getElementById('categoria').value;
            const prov = document.getElementById('provincia').value;
            
            // Esta estructura de URL carga los resultados del BOE de forma pública y directa sin pasar por el formulario tramposo
            const urlLimpia = `https://subastas.boe.es/subastas_ava.php?idCat=${cat}&provincia=${prov}&idAmb=J&tipoSubasta=A&ordenar=FECHA_FIN_REC-DESC&bIdBuscar=Buscar`;
            
            // Forzamos la apertura directa
            window.location.href = urlLimpia;
        }
    </script>
</body>
</html>
