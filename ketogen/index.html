<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KetoGen | AI Gourmet</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        /* CSS PURO: Carga instantánea sin dependencias externas */
        :root {
            --primary: #10b981;
            --dark: #0f172a;
            --bg: #f8fafc;
        }

        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); margin: 0; color: #334155; 
        }

        .navbar {
            background: #ffffff; padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #e2e8f0;
        }

        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }

        /* Tarjetas de menú */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
        
        .btn-card {
            background: white; border: 1px solid #e2e8f0; border-radius: 1rem;
            padding: 2rem 1rem; cursor: pointer; transition: 0.2s; text-align: center;
        }

        .btn-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .btn-card span { display: block; font-size: 2rem; margin-bottom: 0.5rem; }
        .btn-card h3 { margin: 0; font-size: 1rem; color: var(--dark); }

        .btn-full {
            width: 100%; margin-top: 1rem; padding: 1.2rem; background: var(--dark);
            color: white; border-radius: 1rem; border: none; font-weight: bold; cursor: pointer;
        }

        /* Área de Receta */
        .recipe-box { background: white; padding: 2.5rem; border-radius: 1.5rem; border: 1px solid #e2e8f0; }
        .recipe-box h2 { color: #064e3b; margin-top: 0; font-family: serif; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .recipe-box table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        .recipe-box th { background: #f8fafc; text-align: left; padding: 10px; font-size: 0.8rem; color: #64748b; }
        .recipe-box td { padding: 10px; border-bottom: 1px solid #f1f5f9; }

        /* Loader */
        .loader { 
            border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); 
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 3rem auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Modal Compacto */
        .modal {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6);
            display: none; align-items: center; justify-content: center; z-index: 1000; padding: 1rem;
        }
        .modal-content { background: white; padding: 2rem; border-radius: 1.5rem; width: 100%; max-width: 350px; }
        .field { margin-bottom: 1rem; }
        .field label { display: block; font-size: 11px; font-weight: 800; color: #94a3b8; margin-bottom: 5px; }
        .field input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; }

        /* Botón Configuración (Siempre Visible) */
        .config-btn {
            background: white; border: 1px solid #e2e8f0; width: 45px; height: 45px;
            border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <nav class="navbar">
        <h2 style="margin:0; font-size: 1.5rem;">KetoGen 🥗</h2>
        <button class="config-btn" onclick="toggleModal(true)">⚙️</button>
    </nav>

    <div class="container">
        <div id="selectionArea">
            <div class="menu-grid">
                <button class="btn-card" onclick="generateRecipe('desayuno')">
                    <span>🍳</span>
                    <h3>Desayuno</h3>
                </button>
                <button class="btn-card" onclick="generateRecipe('almuerzo')">
                    <span>🥗</span>
                    <h3>Almuerzo</h3>
                </button>
                <button class="btn-card" onclick="generateRecipe('cena')">
                    <span>🌙</span>
                    <h3>Cena</h3>
                </button>
            </div>
            <button class="btn-full" onclick="generateRecipe('menú completo para hoy')">
                📅 Generar Menú Completo
            </button>
        </div>

        <div id="loading" class="hidden">
            <div class="loader"></div>
            <p style="text-align:center; color: #64748b;">Consultando a la IA gourmet...</p>
        </div>

        <div id="recipeResult" class="hidden">
            <div class="recipe-box" id="printArea">
                <div id="recipeContent"></div>
            </div>
            <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                <button onclick="exportToPDF()" style="flex:1; padding: 1rem; background: var(--primary); color:white; border:none; border-radius: 1rem; font-weight: bold; cursor: pointer;">Descargar PDF</button>
                <button onclick="resetUI()" style="flex:1; padding: 1rem; background: white; border: 1px solid #e2e8f0; border-radius: 1rem; cursor: pointer;">Volver</button>
            </div>
        </div>
    </div>

    <div id="configModal" class="modal">
        <div class="modal-content">
            <h3 style="margin: 0 0 1.5rem 0;">Ajustes de API</h3>
            <div class="field">
                <label>GEMINI API KEY</label>
                <input type="password" id="gemKey" placeholder="AIzaSy...">
            </div>
            <div class="field">
                <label>GROQ API KEY</label>
                <input type="password" id="groKey" placeholder="gsk_...">
            </div>
            <button onclick="saveKeys()" style="width:100%; padding: 12px; background: var(--dark); color:white; border:none; border-radius: 10px; font-weight: bold; cursor: pointer;">Guardar Configuración</button>
            <button onclick="toggleModal(false)" style="width:100%; margin-top: 10px; background: none; border:none; color: #94a3b8; cursor: pointer;">Cerrar</button>
        </div>
    </div>

    <script>
        // FIREBASE (Se mantiene igual pero verificado)
        const firebaseConfig = {
            apiKey: "AIzaSyBnmTgJYFsFAFWnGyaDZRUxOZGnL5SE1QA",
            authDomain: "lista-compra-9d6f5.firebaseapp.com",
            databaseURL: "https://lista-compra-9d6f5-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lista-compra-9d6f5",
            storageBucket: "lista-compra-9d6f5.firebasestorage.app",
            messagingSenderId: "241322134457",
            appId: "1:241322134457:web:1b765857911f94d69cc468"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // PERSISTENCIA
        document.getElementById('gemKey').value = localStorage.getItem('G_KEY') || '';
        document.getElementById('groKey').value = localStorage.getItem('Q_KEY') || '';

        function toggleModal(show) {
            document.getElementById('configModal').style.display = show ? 'flex' : 'none';
        }

        function saveKeys() {
            localStorage.setItem('G_KEY', document.getElementById('gemKey').value);
            localStorage.setItem('Q_KEY', document.getElementById('groKey').value);
            toggleModal(false);
        }

        function resetUI() {
            document.getElementById('selectionArea').classList.remove('hidden');
            document.getElementById('recipeResult').classList.add('hidden');
            document.getElementById('loading').classList.add('hidden');
        }

        async function generateRecipe(tipo) {
    const gKey = localStorage.getItem('G_KEY');
    const qKey = localStorage.getItem('Q_KEY');

    if (!gKey && !qKey) return toggleModal(true);

    document.getElementById('selectionArea').classList.add('hidden');
    document.getElementById('loading').classList.remove('hidden');

    let historyText = "";
    try {
        const snapshot = await db.ref('keto_recetas').limitToLast(10).once('value');
        if (snapshot.val()) {
            historyText = "No repitas estas recetas: " + Object.values(snapshot.val()).map(v => v.titulo).join(', ');
        }
    } catch (e) { console.error("Error Firebase:", e); }

    const prompt = `Chef Keto Profesional. Crea una receta para ${tipo}. ${historyText}. REGLAS: Solo devuelve código HTML (h2 para titulo, h3 secciones, table para macros). Sin comentarios adicionales ni bloques de código markdown.`;

    try {
        let html = "";
        
        if (gKey) {
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${gKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                
                const data = await res.json();

                // VALIDACIÓN CRÍTICA PARA EVITAR EL ERROR '0'
                if (data.error) {
                    throw new Error(`Gemini Error: ${data.error.message}`);
                }
                
                if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                    throw new Error("La respuesta de Gemini no tiene el formato esperado.");
                }

                html = data.candidates[0].content.parts[0].text;
            } catch (e) {
                console.warn("Gemini falló, intentando Groq...", e.message);
                if (qKey) {
                    html = await callGroq(prompt, qKey);
                } else {
                    throw e; // Si no hay Groq, lanzamos el error original
                }
            }
        } else if (qKey) {
            html = await callGroq(prompt, qKey);
        }

        // Limpieza de posibles bloques de código que mande la IA
        const cleanHtml = html.replace(/```html|```/g, '').trim();
        
        document.getElementById('recipeContent').innerHTML = cleanHtml;
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('recipeResult').classList.remove('hidden');

        // Guardar en Firebase
        const titleElement = document.querySelector('#recipeContent h2');
        const title = titleElement ? titleElement.innerText : `Receta ${tipo}`;
        await db.ref('keto_recetas').push({ titulo: title, timestamp: Date.now() });

    } catch (err) {
        console.error(err);
        alert("Error de API: " + err.message);
        resetUI();
    }
}

async function callGroq(prompt, key) {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 
            'Authorization': `Bearer ${key}`, 
            'Content-Type': 'application/json' 
        },
        body: JSON.stringify({ 
            model: "mixtral-8x7b-32768", 
            messages: [{role: "user", content: prompt}] 
        })
    });
    
    const d = await res.json();
    
    if (d.error) {
        throw new Error(`Groq Error: ${d.error.message}`);
    }
    
    if (!d.choices || !d.choices[0]) {
        throw new Error("La respuesta de Groq no es válida.");
    }
    
    return d.choices[0].message.content;
}

        async function callGroq(prompt, key) {
            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: "mixtral-8x7b-32768", messages: [{role: "user", content: prompt}] })
            });
            const d = await res.json();
            return d.choices[0].message.content;
        }

        async function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const element = document.getElementById('printArea');
            const canvas = await html2canvas(element, { scale: 2 });
            const pdf = new jsPDF('p', 'mm', 'a4');
            const width = pdf.internal.pageSize.getWidth();
            const height = (canvas.height * width) / canvas.width;
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, width, height);
            pdf.save('KetoGen_Recipe.pdf');
        }
    </script>
</body>
</html>
