<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KetoGen | Smart Chef</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #10b981; --dark: #0f172a; --bg: #f8fafc; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; color: #334155; }
        
        .navbar { background: #fff; padding: 0.8rem 1.2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 800px; margin: 1.5rem auto; padding: 0 1rem; }

        .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; }
        .btn-card { background: white; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 1.5rem 0.5rem; cursor: pointer; text-align: center; }
        .btn-card span { display: block; font-size: 1.5rem; margin-bottom: 0.5rem; }
        .btn-card h3 { margin: 0; font-size: 0.7rem; text-transform: uppercase; }

        .btn-full { width: 100%; margin-top: 1rem; padding: 1.1rem; background: var(--dark); color: white; border-radius: 1rem; border: none; font-weight: bold; cursor: pointer; }

        .recipe-box { background: white; padding: 1.5rem; border-radius: 1.5rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        #recipeContent { all: revert; line-height: 1.6; }
        #recipeContent table { display: block; width: 100%; overflow-x: auto; border-collapse: collapse; margin: 1rem 0; }
        #recipeContent th { background: #f8fafc; padding: 10px; text-align: left; }
        #recipeContent td { padding: 10px; border-bottom: 1px solid #f1f5f9; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 15px; }
        .modal-content { background: white; padding: 1.5rem; border-radius: 1.5rem; width: 100%; max-width: 350px; max-height: 80vh; display: flex; flex-direction: column; }
        
        .item-receta { padding: 12px; border: 1px solid #eee; border-radius: 12px; margin-bottom: 8px; cursor: pointer; background: #fff; }
        .item-receta:hover { border-color: var(--primary); background: #f0fdf4; }

        .hidden { display: none !important; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 2rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav class="navbar">
        <h2 style="margin:0; font-size: 1.1rem;">KetoGen 🥗</h2>
        <div style="display:flex; gap:8px;">
            <button onclick="openRecientes()" style="background:#f1f5f9; border:none; border-radius:10px; padding:8px 12px; cursor:pointer; font-size:12px;">🕒</button>
            <button onclick="toggleModal(true)" style="background:none; border:1px solid #eee; border-radius:10px; padding:8px 12px; cursor:pointer;">⚙️</button>
        </div>
    </nav>

    <div class="container">
        <div id="selectionArea">
            <div class="menu-grid">
                <button class="btn-card" onclick="generateRecipe('desayuno')"><span>🍳</span><h3>Desayuno</h3></button>
                <button class="btn-card" onclick="generateRecipe('almuerzo')"><span>🥗</span><h3>Almuerzo</h3></button>
                <button class="btn-card" onclick="generateRecipe('cena')"><span>🌙</span><h3>Cena</h3></button>
            </div>
            <button class="btn-full" onclick="generateRecipe('menú completo del día')">📅 GENERAR MENÚ DIARIO</button>
        </div>

        <div id="loading" class="hidden"><div class="loader"></div></div>

        <div id="recipeResult" class="hidden">
            <div class="recipe-box" id="printArea">
                <div id="recipeContent"></div>
            </div>
            <div style="margin-top: 1.2rem; display: flex; gap: 0.8rem;">
                <button onclick="exportToPDF()" style="flex:2; padding: 1rem; background: var(--primary); color:white; border:none; border-radius: 1rem; font-weight: bold;">PDF</button>
                <button onclick="resetUI()" style="flex:1; padding: 1rem; background: #fff; border: 1px solid #ddd; border-radius: 1rem;">↩</button>
            </div>
        </div>
    </div>

    <div id="recientesModal" class="modal hidden">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <h3 style="margin:0">Recientes</h3>
                <button onclick="closeRecientes()" style="border:none; background:none; font-size:20px;">&times;</button>
            </div>
            <input type="text" id="searchRecetas" placeholder="Filtrar..." oninput="filtrarRecetas()" style="width:100%; padding:10px; border-radius:10px; border:1px solid #eee; margin-bottom:15px; box-sizing:border-box;">
            <div id="listaRecientes" style="overflow-y:auto; flex:1;"></div>
        </div>
    </div>

    <div id="configModal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin:0 0 1rem 0">Ajustes API</h3>
            <input type="password" id="gemKey" placeholder="Gemini Key" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd; box-sizing:border-box;">
            <input type="password" id="groKey" placeholder="Groq Key" style="width:100%; padding:10px; margin-bottom:15px; border-radius:8px; border:1px solid #ddd; box-sizing:border-box;">
            <button onclick="saveKeys()" style="width:100%; padding:12px; background:var(--dark); color:white; border:none; border-radius:10px; font-weight:bold;">Guardar</button>
            <button onclick="toggleModal(false)" style="width:100%; margin-top:10px; background:none; border:none; color:#999;">Cerrar</button>
        </div>
    </div>

    <script>
        // Inicialización de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBnmTgJYFsFAFWnGyaDZRUxOZGnL5SE1QA",
            authDomain: "lista-compra-9d6f5.firebaseapp.com",
            databaseURL: "https://lista-compra-9d6f5-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lista-compra-9d6f5",
            storageBucket: "lista-compra-9d6f5.firebasestorage.app",
            messagingSenderId: "241322134457",
            appId: "1:241322134457:web:1b765857911f94d69cc468"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let todasLasRecetas = [];

        // Funciones de UI básicas
        window.toggleModal = function(show) { document.getElementById('configModal').classList.toggle('hidden', !show); }
        window.closeRecientes = function() { document.getElementById('recientesModal').classList.add('hidden'); }
        window.resetUI = function() {
            document.getElementById('selectionArea').classList.remove('hidden');
            document.getElementById('recipeResult').classList.add('hidden');
            document.getElementById('loading').classList.add('hidden');
        }

        window.saveKeys = function() {
            localStorage.setItem('G_KEY', document.getElementById('gemKey').value);
            localStorage.setItem('Q_KEY', document.getElementById('groKey').value);
            toggleModal(false);
        }

        // --- LÓGICA DE RECIENTES ---
        window.openRecientes = async function() {
            document.getElementById('recientesModal').classList.remove('hidden');
            const container = document.getElementById('listaRecientes');
            container.innerHTML = "Cargando...";

            try {
                const snapshot = await db.ref('keto_recetas').orderByChild('timestamp').limitToLast(50).once('value');
                todasLasRecetas = [];
                snapshot.forEach(child => {
                    todasLasRecetas.unshift({ id: child.key, ...child.val() });
                });
                renderizarLista(todasLasRecetas);
            } catch (e) { container.innerHTML = "Error al conectar."; }
        }

        function renderizarLista(recetas) {
            const container = document.getElementById('listaRecientes');
            container.innerHTML = "";
            recetas.forEach(r => {
                const div = document.createElement('div');
                div.className = "item-receta";
                div.innerHTML = `<strong>${r.titulo}</strong><br><small>${new Date(r.timestamp).toLocaleDateString()}</small>`;
                div.onclick = () => {
                    document.getElementById('recipeContent').innerHTML = r.contenido;
                    document.getElementById('selectionArea').classList.add('hidden');
                    document.getElementById('recipeResult').classList.remove('hidden');
                    closeRecientes();
                };
                container.appendChild(div);
            });
        }

        window.filtrarRecetas = function() {
            const term = document.getElementById('searchRecetas').value.toLowerCase();
            const filtradas = todasLasRecetas.filter(r => r.titulo.toLowerCase().includes(term));
            renderizarLista(filtradas);
        }

        // --- GENERACIÓN DE RECETAS ---
      window.generateRecipe = async function(tipo) {
    const gKey = localStorage.getItem('G_KEY');
    const qKey = localStorage.getItem('Q_KEY');
    if (!gKey && !qKey) return toggleModal(true);

    document.getElementById('selectionArea').classList.add('hidden');
    document.getElementById('loading').classList.remove('hidden');

    // Prompt actualizado para incluir valores nutricionales obligatorios
    const prompt = `Actúa como Chef Keto Profesional y Nutricionista. 
    Crea una receta detallada para ${tipo}. 
    REGLAS ESTRICTAS:
    1. Estructura: <h2>Nombre</h2>, <h3>Ingredientes</h3>, <h3>Instrucciones</h3> y <h3>Información Nutricional</h3>.
    2. La sección de Información Nutricional DEBE ser una <table> con dos columnas: "Nutriente" y "Cantidad por ración".
    3. Incluye obligatoriamente: Calorías, Grasas, Proteínas y Carbohidratos Netos.
    4. Devuelve SOLO HTML limpio. Sin bloques de código markdown ni texto extra.`;

    let html = "";
    let exito = false;

    // --- 1. INTENTO GEMINI ---
    if (gKey) {
        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${gKey}`;
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            if (data?.candidates?.[0]?.content) {
                html = data.candidates[0].content.parts[0].text;
                exito = true;
            }
        } catch (e) { console.error("Gemini falló"); }
    }

    // --- 2. INTENTO GROQ (FALLBACK) ---
    if (!exito && qKey) {
        try {
            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${qKey.trim()}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "user", content: prompt }]
                })
            });
            const data = await res.json();
            if (data?.choices?.[0]) {
                html = data.choices[0].message.content;
                exito = true;
            }
        } catch (e) { console.error("Groq falló"); }
    }

    if (exito) {
        let cleanHtml = html.replace(/```html|```/g, '').trim();

        // Limpieza de títulos (el filtro que ya teníamos)
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = cleanHtml;
        const h2 = tempDiv.querySelector('h2');
        if (h2) {
            h2.innerText = h2.innerText.replace(/(¡|!|Aquí tienes|Tu receta|Directo de|Campeón|Chef)/gi, '').trim();
            cleanHtml = tempDiv.innerHTML;
        }

        document.getElementById('recipeContent').innerHTML = cleanHtml;
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('recipeResult').classList.remove('hidden');
        
        // Guardar en Firebase con los nuevos valores
        const finalTitle = h2 ? h2.innerText : "Receta Keto";
        db.ref('keto_recetas').push({ titulo: finalTitle, contenido: cleanHtml, timestamp: Date.now() });
    } else {
        alert("Error al generar la receta.");
        resetUI();
    }
} 

window.exportToPDF = async function() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');
    const content = document.getElementById('recipeContent');
    
    if (!content || !content.innerText.trim()) return alert("Genera una receta primero");

    const margin = 20;
    const pageWidth = doc.internal.pageSize.getWidth();
    let cursorY = 15;

    // --- 1. IMAGEN DE CABECERA (PROPORCIONAL) ---
    const imgUrl = "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCACHASwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZnaGlqc3R1dnd4eXqQ0f/aAAwDAQACE KEBA x8AP/9oADAMBAAIRAxEAPwD5/ooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigD/2Q==";
    
    // Función auxiliar para cargar la imagen y obtener sus dimensiones originales
    const getImageParams = (url) => {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.src = url;
            img.onload = () => resolve({ img, width: img.width, height: img.height });
            img.onerror = (e) => reject(e);
        });
    };

    try {
        const imgData = await getImageParams(imgUrl);
        
        // Calculamos el alto proporcional para el PDF
        // La relación es: Alto original / Ancho original = Alto PDF / Ancho PDF (pageWidth)
        const pdfImgWidth = pageWidth; 
        const pdfImgHeight = (imgData.height * pdfImgWidth) / imgData.width;

        // Añadimos la imagen al PDF sin deformación
        doc.addImage(imgData.img, 'JPEG', 0, 0, pdfImgWidth, pdfImgHeight, undefined, 'FAST');
        
        // El cursor comienza después de la imagen
        cursorY = pdfImgHeight + 10;

    } catch (e) {
        console.warn("No se pudo cargar la imagen de cabecera, usando fondo sólido.");
        // Fallback: Fondo verde sólido si la imagen falla
        doc.setFillColor(16, 185, 129);
        doc.rect(0, 0, pageWidth, 40, 'F');
        cursorY = 55;
    }

    // Texto de cabecera superpuesto (opcional, solo si la imagen es oscura)
    /*
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(26);
    doc.text("KetoGen Gourmet", margin, 25);
    */

    // --- 2. TÍTULO DE LA RECETA ---
    const title = content.querySelector('h2')?.innerText || "Receta Keto";
    doc.setTextColor(30, 41, 59);
    doc.setFontSize(20);
    doc.setFont("helvetica", "bold");
    const splitTitle = doc.splitTextToSize(title, pageWidth - (margin * 2));
    
    // Verificamos si el título cabe o necesita salto de página
    if (cursorY + (splitTitle.length * 10) > 280) { doc.addPage(); cursorY = 20; }
    
    doc.text(splitTitle, margin, cursorY);
    cursorY += (splitTitle.length * 10) + 10;

    // --- 3. PROCESAR ELEMENTOS (IDEM ANTERIOR CON AUTO-TABLE) ---
    const elements = Array.from(content.children);

    for (const el of elements) {
        if (el.tagName === 'H2') continue; // Ya procesamos el título

        // Control de salto de página simple para texto
        if (cursorY > 275) { doc.addPage(); cursorY = 20; }

        if (el.tagName === 'H3') {
            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.setTextColor(16, 185, 129);
            doc.text(el.innerText, margin, cursorY);
            cursorY += 8;
        } 
        else if (el.tagName === 'P' || el.tagName === 'UL' || el.tagName === 'OL' || el.tagName === 'LI') {
            doc.setFont("helvetica", "normal");
            doc.setFontSize(11);
            doc.setTextColor(71, 85, 105);
            
            // Tratamos li dentro de p si la IA lo devuelve mal formateado
            let textContent = el.innerText;
            if (el.tagName === 'UL' || el.tagName === 'OL') {
                 textContent = Array.from(el.querySelectorAll('li')).map(li => "• " + li.innerText).join('\n');
            }

            const lines = doc.splitTextToSize(textContent, pageWidth - (margin * 2));
            doc.text(lines, margin, cursorY);
            cursorY += (lines.length * 6) + 4;
        }
        else if (el.tagName === 'TABLE') {
            const rows = [];
            const headers = [];
            el.querySelectorAll('th').forEach(th => headers.push(th.innerText));
            el.querySelectorAll('tr').forEach((tr, index) => {
                if (index === 0 && el.querySelector('th')) return;
                const rowData = [];
                tr.querySelectorAll('td').forEach(td => rowData.push(td.innerText));
                if (rowData.length > 0) rows.push(rowData);
            });

            doc.autoTable({
                startY: cursorY,
                head: [headers.length > 0 ? headers : ["Macro", "Cantidad"]],
                body: rows,
                margin: { left: margin, right: margin },
                styles: { fontSize: 10, cellPadding: 3 },
                headStyles: { fillColor: [16, 185, 129], textColor: 255 },
                alternateRowStyles: { fillColor: [248, 250, 252] },
                theme: 'striped'
            });
            
            cursorY = doc.lastAutoTable.finalY + 10;
        }
    }

    // --- 4. PIE DE PÁGINA ---
    const pageCount = doc.internal.getNumberOfPages();
    for(let i = 1; i <= pageCount; i++) {
        doc.setPage(i);
        doc.setFontSize(8);
        doc.setTextColor(148, 163, 184);
        doc.text(`KetoGen AI - Página ${i} de ${pageCount}`, pageWidth/2, 285, { align: 'center' });
    }

    doc.save(`${title.replace(/\s+/g, '_')}.pdf`);
};

        // Cargar keys guardadas
        document.getElementById('gemKey').value = localStorage.getItem('G_KEY') || '';
        document.getElementById('groKey').value = localStorage.getItem('Q_KEY') || '';
    </script>
</body>
</html>
